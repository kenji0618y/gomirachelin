/* ========== 第2章 ととのうの科学 ========== */
{
 id:"ch2", tier:"t2", num:"02", icon:"🧠", accent:"var(--calm)",
 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-25.jpg", photoAlt:"雪景色の湖に浸かる寒中水泳",
 title:"「ととのう」の科学", subtitle:"自律神経と身体のメカニズム",
 desc:"医学的に見た「ととのう」とは何か。自律神経・血流・HSPの仕組み。",
 lessons:[
  {
   id:"l2-1", title:"「ととのう」とは何か（医学的定義）",
   blocks:[
    {type:"p",text:"「ととのう」という言葉は、レジェンドサウナー・濡れ頭巾ちゃんが仲間内で使い始め、漫画家タナカカツキが『サ道』で視覚化して世に広めたとされます。その医学的な裏づけを体系化したのが、日本サウナ学会の代表理事・加藤容崇（かとうやすたか）医師です。"},
    {type:"h",text:"医学的な定義"},
    {type:"p",text:"加藤医師によれば、「ととのう」とは「血中にアドレナリンが残っているのに、自律神経は副交感神経が優位という“まれな状態”」です。つまり、体はまだ興奮の名残（覚醒）を持ちながら、心はリラックスしている——本来なら同時に起こりにくい状態が同居する瞬間なのです。"},
    {type:"quote",text:"アドレナリンの血中半減期は約2分。だから外気浴の“最初の2分”こそが、真のととのいタイム。",small:"— 加藤容崇『医者が教えるサウナの教科書』の考え方より"},
    {type:"note",cool:true,text:"<b>脳のDMN（デフォルトモードネットワーク）</b>：ぼーっとしている時に働き、脳エネルギーを大量に消費する回路。強い温冷刺激で思考が止まると、この過活動が抑えられ、頭がスッキリします。サウナ後の脳は瞑想に近い状態に。"}
   ],
   sources:[
    {label:"加藤容崇『医者が教えるサウナの教科書』（Amazon）",url:"https://www.amazon.co.jp/dp/447811031X?tag=gomirachelin-22",icon:"📕"},
    {label:"LOCA｜サウナと自律神経の関係性",url:"https://loca-aoyama.jp/column/2024/04/18/post-1424/",icon:"🧠"}
   ],
   quiz:[
    {q:"「ととのう」の医学的な説明を体系化した人物は？",choices:["太田広","加藤容崇 医師","タナカカツキ","松尾大"],answer:1,explain:"日本サウナ学会 代表理事の<b>加藤容崇</b>医師です。慶應大学医学部の特任助教でもあります。"},
    {q:"加藤医師が「真のととのいタイム」とする時間帯は？",choices:["水風呂の中","外気浴の最初の約2分","サウナ室に入った直後","2セット目以降ずっと"],answer:1,explain:"アドレナリンの血中半減期が約2分のため、<b>外気浴の最初の2分</b>が鍵とされます。"}
   ]
  },
  {
   id:"l2-2", title:"自律神経の切り替わり",
   blocks:[
    {type:"p",text:"「ととのう」の正体は、自律神経の“急速な切り替え”にあります。自律神経には、活動・興奮を司る「交感神経」と、リラックスを司る「副交感神経」があります。サウナのセットは、この2つを短時間でジェットコースターのように行き来させます。"},
    {type:"h",text:"3ステップで起きていること"},
    {type:"list",items:[
     "<b>①サウナ室</b>：最初は副交感神経が優位。やがて熱さで交感神経が優位に切り替わり、アドレナリンが分泌され、心拍が上がり血管が収縮。",
     "<b>②水風呂</b>：冷たさの刺激で交感神経がさらに優位に。血液は体の中心部へ集まる。",
     "<b>③外気浴</b>：危機を脱したと体が判断し、一気に副交感神経が優位へ。血管が緩み、深いリラックスが訪れる。"
    ]},
    {type:"note",text:"この「交感神経 → 副交感神経」への急激なスイッチが起きた瞬間、アドレナリンの覚醒感とリラックスが同居し、独特の多幸感=「ととのう」が生まれると考えられています。"}
   ],
   sources:[
    {label:"LOCA｜サウナで自律神経がととのう理由",url:"https://loca-aoyama.jp/column/2024/04/18/post-1424/",icon:"🧠"}
   ],
   quiz:[
    {q:"サウナ→水風呂→外気浴で最終的に優位になるのは？",choices:["交感神経","副交感神経","どちらも同じ","運動神経"],answer:1,explain:"外気浴で一気に<b>副交感神経</b>が優位になり、深いリラックスが訪れます。"},
    {q:"水風呂に入っている時、血液は主にどこへ集まる？",choices:["手足の先","体の中心部","頭","皮膚の表面"],answer:1,explain:"冷刺激で血管が収縮し、血液は<b>体の中心部</b>へ集まります。"}
   ]
  },
  {
   id:"l2-3", title:"ヒートショックプロテインと健康効果",
   blocks:[
    {type:"p",text:"サウナで深部体温を上げると、「ヒートショックプロテイン（HSP）」という“ストレス防御タンパク質”が分泌されます。HSPは傷んだ細胞を修復し、免疫細胞を活性化させ、抗炎症・疲労回復・美肌などに寄与するとされます。"},
    {type:"h",text:"フィンランドの大規模研究"},
    {type:"p",text:"フィンランド東部大学のヤリ・ラウカネン博士らは、中年男性2,315人を中央値20.7年という長期にわたって追跡しました。その観察研究では、週4〜7回サウナに入る人は週1回の人と比べ、認知症全般のリスクが66%、アルツハイマー病のリスクが65%低かったと報告されています。"},
    {type:"statbig",items:[{b:"−66%",s:"認知症リスク（週4〜7回 vs 週1回）"},{b:"−63%",s:"心臓突然死リスク"},{b:"−40%",s:"全死因死亡リスク"}]},
    {type:"note",warn:true,text:"<b>これらは“相関”を示す観察研究の結果</b>です。因果関係が完全に証明されたわけではなく、対象は主に中年男性。効果には個人差があり、持病のある方は必ず主治医に相談してください。"}
   ],
   sources:[
    {label:"Laukkanen et al., JAMA Internal Medicine 2015（心血管）",url:"https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2130724",icon:"🔬"},
    {label:"Laukkanen et al., Age and Ageing 2017（認知症・アルツハイマー病）",url:"https://pubmed.ncbi.nlm.nih.gov/27932366/",icon:"🔬"},
    {label:"加藤容崇『医者が教えるサウナの教科書』（Amazon）",url:"https://www.amazon.co.jp/dp/447811031X?tag=gomirachelin-22",icon:"📕"}
   ],
   quiz:[
    {q:"深部体温を上げると分泌される“ストレス防御タンパク質”は？",choices:["アドレナリン","ヒートショックプロテイン(HSP)","メラトニン","コラーゲン"],answer:1,explain:"<b>ヒートショックプロテイン（HSP）</b>。細胞修復や免疫活性化に関わるとされます。"},
    {q:"ラウカネン博士らの研究について正しいのは？",choices:["因果関係を完全に証明した","相関を示す観察研究である","日本人が対象だった","1年間の短期研究だった"],answer:1,explain:"これは長期の<b>観察研究（相関）</b>で、対象は主にフィンランドの中年男性です。"}
   ]
  }
 ]

/* ========== 第4章 サウナストーブと熱源 ========== */
{
 id:"ch4", tier:"t2", num:"04", icon:"🪵", accent:"var(--hot)",
 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-10.jpg", photoAlt:"サウナストーンが積まれたストーブ",
 title:"サウナストーブと熱源", subtitle:"熱をつくる技術",
 desc:"対流式・輻射式・格納式。電気・薪・ガス。ロウリュと名門メーカー。",
 lessons:[
  {
   id:"l4-1", title:"ストーブの種類とロウリュ",
   blocks:[
    {type:"p",text:"サウナストーブは「方式」で大きく3つに分けられます。それぞれ、体感の温まり方や湿度の出し方が違います。"},
    {type:"list",items:[
     "<b>対流式（ストーン型）</b>：石を積み、そこに水をかける“ロウリュ”ができる方式。フィンランド式サウナの主役。",
     "<b>輻射式（遠赤外線型）</b>：遠赤外線でじんわり温める。日本の銭湯に多い。立ち上がりが早い。",
     "<b>格納式（ボナサーム）</b>：壁や座面の中にヒーターを収めるタイプ。省スペース。"
    ]},
    {type:"h",text:"ロウリュ（löyly）の科学"},
    {type:"p",text:"熱く焼けたサウナストーンに水（またはアロマ水）をかけると、一気に水蒸気が発生します。これが「ロウリュ」。湿度と体感温度が上がり、発汗が促されて新陳代謝が高まります。サウナストーンは蓄熱性が高く、大量の蒸気を生み出す名脇役です。"},
    {type:"note",cool:true,text:"<b>「ロウリュ」＝蒸気を発生させる行為</b>そのもの。その蒸気をタオルであおいで送るのは「アウフグース」で、別物です（第7章で詳しく）。"}
   ],
   sources:[
    {label:"ハルビア公式｜薪式サウナストーブとサウナストーン",url:"https://harvia.jp/",icon:"🔥"},

    {type:"list",items:[
     "<b>電気式</b>：家庭用の主流。火を使わず安全で温度管理も簡単。温まるまで約30分。ランニングコストは薪の1/5〜1/10ほど。",

/* ========== 第5章 サウナ室の設計 ========== */

    {type:"h",text:"温度と湿度"},
    {type:"list",items:[
     "<b>ドライサウナ</b>：80〜100℃・湿度10%前後の高温低湿。",
     "<b>フィンランド式</b>：ロウリュで湿度を上げる中温高湿。加藤医師は「80〜90℃のフィンランド式が最強」とも。"
    ]},
    {type:"h",text:"換気がなぜ大事か"},
    {type:"p",text:"温まった空気は上へ昇ります。換気がないと天井ばかり熱く、足元が冷たいムラができてしまいます。基本は「ストーブ近くの下部から新鮮な空気を入れ、対角線上から排気する」設計。給排気口には火傷を防ぐ木製の“ガラリ”が使われます。"},
    {type:"note",text:"<b>ベンチは高いほど熱い</b>。空気の対流で、上段ほど高温になります。加藤医師は「サウナでは足を上げるほうがよい」とも述べています。"}

   sources:[
    {label:"ReAir｜サウナの換気方法と設備",url:"https://re-air.jp/blog/49358/",icon:"⚙️"}

   quiz:[
    {q:"一般的なドライサウナの湿度はおよそ？",choices:["10%前後","40%前後","70%前後","100%"],answer:0,explain:"ドライサウナは<b>湿度10%前後</b>の高温低湿。ロウリュで湿度を上げるのがフィンランド式です。"},
    {q:"サウナ室で上段の席が熱い理由は？",choices:["ヒーターが上にあるから","温かい空気が上へ昇るから","窓が上にあるから","人が多いから"],answer:1,explain:"空気の<b>対流</b>で、温まった空気が上昇するため上段ほど高温になります。"}

  },

   id:"l5-2", title:"木材の選び方",

    {type:"list",items:[
     "<b>ヒノキ</b>：ヒノキチオールによる殺菌・抗菌作用と、豊かな芳香。日本のサウナの定番。",
     "<b>ケロ</b>：立ち枯れパインの高級材。“サウナの宝石”。",
     "<b>アバチ</b>：熱をゆっくり蓄えてやさしく放出。触れても熱くなりにくく、ベンチに最適。",

     "<b>スプルース</b>：フィンランドで多用される定番材。"

    {type:"note",text:"針葉樹（ヒノキ等）は温まりやすく冷めやすい。広葉樹（アバチ等）は熱をゆっくり蓄えるため、直接肌が触れるベンチに向いています。"}

  {
   id:"l5-3", title:"サウナの種類",

 lessons:[
  {

   blocks:[
    {type:"p",text:"水風呂の温度は、ととのいを左右する重要な要素です。加藤医師は16〜17℃（書籍により16〜18℃）を最適としています。"},
    {type:"h",text:"温度帯の呼び名"},
    {type:"list",items:[
     "<b>シングル / グルシン</b>：水温が1桁台（1〜9℃）の、キンキンに冷たい水風呂。コアなサウナーに人気。",
     "<b>ダブル</b>：2桁台の水温。一般的な水風呂。"
    ]},
    {type:"p",text:"「グルシン」という呼び名は、ラジオ番組での“グルシン（＝下1桁）”という言い回しに由来するという説があります。"},
    {type:"note",cool:true,text:"<b>冷たすぎる＝良い、ではありません。</b>最適な温度は人それぞれ。無理に低温へ挑戦せず、自分が心地よく感じる水温を見つけることが大切です。"}
   ],
   sources:[
    {label:"加藤容崇『医者が教えるサウナの教科書』（Amazon）",url:"https://www.amazon.co.jp/dp/447811031X?tag=gomirachelin-22",icon:"📕"}
   ],
   quiz:[
    {q:"加藤医師が最適とする水風呂の温度に近いのは？",choices:["5〜7℃","16〜17℃","24〜26℃","30℃以上"],answer:1,explain:"<b>16〜17℃</b>（書籍により16〜18℃）が最適とされます。"},
    {q:"水温が1桁台（1〜9℃）の水風呂の呼び名は？",choices:["ダブル","シングル（グルシン）","トリプル","ライト"],answer:1,explain:"<b>シングル（グルシン）</b>。キンキンに冷たく、コアなファンに人気です。"}

  },

   blocks:[
    {type:"p",text:"水風呂で体が冷える仕組みと、ベテランが使う“テクニック”を知ると、水風呂がぐっと楽になります。"},
    {type:"h",text:"TRPチャネル"},
    {type:"p",text:"人体には「TRPチャネル（トリップチャネル）」という温度センサーがあり、危険な温度を“痛み”として脳に知らせます。水風呂は体表の熱を奪い、交感神経を強く刺激します。"},

    {type:"p",text:"水風呂の中でじっと動かずにいると、体温で温められた薄い水の層が体の周りにできます。これが“羽衣”。この層が冷たさをやわらげ、水風呂が心地よく感じられるようになります。動くと羽衣がはがれ、再び冷たさを感じます。"},
    {type:"note",cool:true,text:"初心者が水風呂で「じっとしていると楽」と言われるのは、この<b>羽衣</b>をまとっているから。手足を動かさず、静かに浸かるのがコツです。"}
   ],
   sources:[
    {label:"加藤容崇『医者が教えるサウナの教科書』（Amazon）",url:"https://www.amazon.co.jp/dp/447811031X?tag=gomirachelin-22",icon:"📕"}

   quiz:[

    {q:"危険な温度を“痛み”として知らせる人体の温度センサーは？",choices:["TRPチャネル","HSP","DMN","アドレナリン"],answer:0,explain:"<b>TRPチャネル（トリップチャネル）</b>が温度を感知し、脳に知らせます。"}

    {type:"p",text:"本場フィンランドには、日本のような冷たい水風呂はほとんどありません。代わりに、凍った湖に穴を開けて入る「アヴァント」の文化があります。日本のように高温サウナと冷たい水風呂をセットで楽しむスタイルは、独自に発展したものです。"},

   ],
   sources:[

    {type:"p",text:"1966年大阪生まれの漫画家・映像作家。2008年にサウナに開眼し、2011年にエッセイ『サ道』（PARCO出版）を刊行。漫画版は講談社「モーニング」で2015年から連載されました。2019年にテレビ東京でドラマ化（主演・原田泰造）され、「ととのう」を視覚化して第三次ブームの火付け役に。日本サウナ・スパ協会の「サウナ大使」も務め、2022年開業の渋谷SAUNASを総合プロデュースしています。"},

    {type:"p",text:"日本サウナ学会 代表理事。慶應義塾大学医学部の特任助教で、がんの病理診断が専門。『医者が教えるサウナの教科書』（2020年・6万部超）、『医者が教える 究極にととのう サウナ大全』（2023年）で、ととのうを医学的に解き明かしました。"},

    {type:"p",text:"2021年9月結成の3人組「アカデミックサウナレーベル」。メンバーは総合演出家のUK、戦略コンサルタントのYAS、そして現役外科医のYsKという異色の組み合わせです。YsKはロシア製テントサウナ「Ex-pro Igloo」を個人輸入して日本に初導入した人物。サウナを“科学”と捉え、アウトドアサウナの演出、独自ギア（電気式「MAD ENGINE」など）の開発、施設プロデュースを手がけ、Saunner of the Year 2024を受賞しました。"},
    {type:"h",text:"熱波と笑いの発信者"},
    {type:"list",items:[

     "<b>井上勝正（サウナ皇帝）</b>：元大日本プロレスのレスラー。横浜「おふろの国」で独自の熱波を「熱波道」として確立した、日本の熱波師文化のパイオニア。",
     "<b>サウナーヨモギダ</b>：年間約700回サウナに入るトップサウナー。「サウナでは欲張らない」哲学で知られます。"

    {type:"h",text:"メディアとコミュニティ"},
    {type:"p",text:"検索サイト「サウナイキタイ」はサウナ好き4人チームが運営する日本最大のサウナポータルで、活動記録「サ活」の投稿文化を生みました。2025年初時点で登録施設は約1.4万・ユーザー約39万人とされます。雑誌ではSAUNA BROS.（東京ニュース通信社）、発信者では清水みさと（Saunner of the Year 2023）や文筆家の岩田リョウコ（同2025）ら、女性サウナーの活躍も目立ちます。"},
    {type:"note",cool:true,text:"<b>Saunner of the Year</b>：TTNEがサウナシュランと同日（11月11日）に発表する、その年のサウナ文化に貢献した人・モノの表彰。発信者たちの動向を知る絶好の定点観測です。"}

   blocks:[
    {type:"p",text:"サウナ後の食事「サ飯（サウナ飯）」。あの異常な美味さには、ちゃんと理由があります。近畿大学の研究者たちの解説をもとに分解してみましょう。"},
    {type:"h",text:"美味さの三段構え"},
    {type:"list",items:[
     "<b>①体が欲している</b>：サウナ後は運動後と同様にエネルギーを消費し血糖値が低下。発汗でナトリウム（塩分）も失われるため、炭水化物と塩気を欲するのは自然な生理反応（応用心理学・味覚研究の大沼卓也准教授）。",
     "<b>②脳への伝わり方が変わる</b>：味覚センサー自体が鋭くなるというより、リラックス状態が美味しさの主観的体験を増幅します。",
     "<b>③マインドフルネス効果</b>：サウナは外部情報が遮断され「今この瞬間」に集中する瞑想に近い状態をつくり、入ってくる情報＝味の解像度が上がります（臨床心理学の本岡寛子教授）。"
    ]},
    {type:"h",text:"伝説のサ飯"},
    {type:"p",text:"サ飯の代名詞といえば、上野「サウナ&カプセルホテル北欧」の北欧特製カレーライス。ドラマ『サ道』の舞台でもあるこの施設の名物は、2022年にセブン-イレブンで「サウナ北欧監修 特製カレーライス」として商品化され、パッケージに堂々と「サウナ飯」と記されました。サ飯が一般語になった象徴的な出来事です。"},
    {type:"note",text:"サ飯選びのコツ：発汗で失った<b>塩分・水分・糖質</b>を補えるものが体に沁みます。だからカレー、ラーメン、定食が強いのです。"}

  {
   id:"l12-2", title:"オロポとサウナドリンクの科学",
   blocks:[
    {type:"p",text:"サウナ界で最も有名なドリンク「オロポ」。オロナミンCとポカリスエットを混ぜた飲み物で、基本の黄金比は1:1とされます。"},

    {type:"p",text:"発祥は「東京都内のサウナ店」とする説が有力で、西麻布のサウナ「adam・eve」を発祥とする説がよく知られています（サウナしきじ説を推す声もあり、諸説あります）。『サ道』で描かれたことで全国区になりました。派生形として、アクエリアス＋リアルゴールドの「アクリ」なども生まれています。"},

    {type:"h",text:"サウナしきじ（静岡）——水の聖地"},
    {type:"p",text:"「サウナの聖地」と呼ばれる24時間営業の名店。最大の武器は、地下から汲み上げた飲めるほど良質な天然水の掛け流し水風呂です。高温サウナに加え、当帰や薄荷など生薬を焚く薬草サウナも名物。なお、毛落ちによる水質への影響を理由にサウナハットは使用不可という独自ルールがあります。"},
    {type:"h",text:"湯らっくす（熊本）——西の聖地"},
    {type:"p",text:"名物は水風呂の「MADMAXボタン」。押すと頭上から天然水の滝が降り注ぎます。水深は男湯171cmで「日本一深い水風呂」として知られ、サウナシュランには2018〜2020年の3年連続受賞で殿堂入りしました。"},
    {type:"h",text:"ウェルビー栄（名古屋）——氷の聖地"},
    {type:"p",text:"室温最低マイナス25℃の「アイスサウナ」に約2℃の水風呂を備え、ラップランドの冬を再現。フィンランドの暗く静かな小部屋を再現した「森のサウナ」も名物です。2018年の第1回サウナシュランで初代1位、2023年にも1位に輝き殿堂入りしています。"},
    {type:"note",text:"三大聖地の共通点は<b>「水風呂への異常なこだわり」</b>。サウナ室の熱さ自慢ではなく、冷やし方に個性が宿るのが日本流です。"}

   id:"l14-1", title:"テントサウナ入門",
   blocks:[
    {type:"p",text:"テントサウナは、耐熱テントに薪ストーブを組み込んだ移動式サウナ。10〜20万円台で「自分のサウナ」が手に入る、アウトドアサウナの入口です。"},
    {type:"h",text:"御三家ブランド比較（2026年時点の実勢）"},
    {type:"list",items:[
     "<b>MORZH（モルジュ／ロシア発）</b>:断熱材入り3層キルト構造で保温性最強。氷点下でも100℃超、薪を焚けば120℃超も。ストーブ込み実勢約19万円。",
     "<b>Savotta（サヴォッタ／フィンランド）</b>：フィンランド国防軍採用メーカー。唯一の六角形で床面積5.4m²と最大。サウナストーンを約40kg積むのが特徴。テント＋ストーブ約14.5〜16万円。",
     "<b>Mobiba（モビバ／ロシア発）</b>：ストーブ込み約10万円台・総重量24.4kgと最軽量のコスパ王。大型窓が気持ちいい。"
    ]},
    {type:"h",text:"命を守る装備"},
    {type:"p",text:"薪ストーブで最も怖いのは、無色無臭の一酸化炭素（CO）。COチェッカー（警報器）の設置は必須です。吸気の確保、耐熱グローブと薪トング、テントと煙突の離隔にも注意しましょう。"},
    {type:"note",warn:true,text:"<b>炭や熾火だけの運用はNG</b>。煙突が温まらず排気が滞り、CO中毒の危険が高まります。必ず炎のある薪で焚くのが基本です。"}
   ],
   sources:[

  {

   blocks:[
    {type:"p",text:"アウトドアサウナの醍醐味は、川・湖・雪という天然の水風呂。ただし自然は施設と違い、管理者も監視員もいません。ルールと法律を知ることが、遊びを守ります。"},
    {type:"h",text:"水辺の鉄則4か条（SaunaCamp.より）"},
    {type:"list",items:[
     "水遊び禁止の場所で入らない。",
     "飲酒後は入らない。",
     "子どもだけで入らせない。",
     "日没後は入らない。"
    ]},
    {type:"p",text:"人は「静かに溺れる」——溺れる人は声を上げられません。大人でも水深30cmで溺れる可能性があり、救命浮き輪やロープの備えが推奨されます。"},
    {type:"h",text:"法律の基礎知識"},
    {type:"list",items:[
     "テントサウナの個人利用自体を禁じる法律はないが、<b>場所の規制</b>に従う必要がある（長野県の公式見解より）。",
     "国立公園の<b>特別地域では「仮設工作物の新設」として許可が必要</b>（自然公園法。違反は1年以下の懲役又は100万円以下の罰金）。",
     "河川敷は自由使用が原則だが、営利・継続利用は河川管理者の許可が必要な場合も。",
     "他人を入浴させて営業するなら<b>公衆浴場法の営業許可</b>が必要。"
    ]},
    {type:"note",text:"マナー面では、石鹸・シャンプーを川や湖に流さない、ロウリュのアロマ水も自然界に配慮する、が愛されるサウナーの基本です。"}

    {type:"p",text:"ストーブは薪式30万円前後〜、電気式約40万円〜（200Vの電気工事が別途約15万円〜）。光熱費の目安は薪100〜160円/時、電気（4.5kW）120円/時〜。サウナストーンは2〜4年ごとの交換が推奨されます。"},
    {type:"h",text:"忘れてはいけない届出"},
    {type:"p",text:"サウナストーブは火災予防条例上の「火を使用する設備」に当たり、屋外バレルサウナ等の設置時には管轄消防署への「火を使用する設備等の設置（変更）届出書」の提出が求められることがあります（個人利用では不要な自治体もあり、要確認）。事業利用なら消防法・公衆浴場法への適合が必須です。"},

    {type:"p",text:"日本のサウナ人口を毎年定点観測しているのが、日本サウナ・温冷浴総合研究所（日本サウナ総研）。毎年3月7日「サウナの日」前後に、1万人調査に基づく「日本のサウナ実態調査」を発表しています。"},

     "<b>ライトサウナー</b>：年1回〜数ヶ月に1回。約1,000万人規模。"
    ]},

    {type:"p",text:"興味深いのは、全体人数はコロナ前より少なめで推移する一方、ヘビー層が急増していること。「広く浅く」から「深くハマる」文化への移行が数字に表れています。施設リピートの理由は9年連続で「住まい・職場からの距離」が1位（38%）。人は結局、近いサウナに通うのです。"},

    {type:"p",text:"ロシアの伝統蒸気風呂「バーニャ」は、12世紀の『原初年代記』にすでに記述が残ります。「極限まで熱し、裸になり、若い枝で身を打ち、冷水を浴びて蘇る」——現代のサウナーが読んでも共感する一節です。"},

    {type:"p",text:"韓国式サウナ「チムジルバン」のルーツは、15世紀『世宗実録』に登場する「汗蒸所」。当時は医師が派遣される民間医療施設でもありました。現代のチムジルバンは床暖房「オンドル」と窯型サウナを組み合わせた健康ランドで、窯焼き卵と甘い米の飲料「シッケ」が定番のお供です。"},
    {type:"h",text:"トルコ：ハマム"},
    {type:"p",text:"ハマムは、ローマ浴場（テルマエ）とイスラムの清浄文化が融合して生まれた大理石の蒸気浴場。中央には「ギョベックタシュ（へそ石）」と呼ばれる加熱された大理石の台があり、そこに横たわって発汗し、「ケセ」という垢すりミトンの施術と泡マッサージを受けます。イスタンブールには15〜17世紀築のハマムが今も現役です。"},
    {type:"h",text:"メキシコ：テマスカル"},
    {type:"p",text:"メソアメリカ先住民のドーム型蒸し風呂「テマスカル」の語源は、ナワトル語の temazcalli＝「熱の家」。スペイン人到来より少なくとも700年以上前から存在し、治療や出産前後のケア、戦いの後の回復に使われました。入口をくぐることは冥界への入口を象徴し、「テマスカルの祖母」トシツィンが祀られた神聖な空間です。"},
    {type:"note",text:"熱の器で比べると面白い——韓国は<b>窯（石と黄土）</b>、トルコは<b>大理石</b>、メキシコは<b>土のドーム</b>。世界中の人類が、それぞれの素材で「汗をかく聖域」を築いてきました。"}

    {type:"h",text:"現存する古代サウナ"},
    {type:"list",items:[
     "<b>かま風呂（京都・八瀬）</b>：壬申の乱（672年）で矢傷を負った大海人皇子（後の天武天皇）を、村人が土の窯で温めて治療したという伝承を持つ和式サウナ。約55〜60℃の低温多湿で、筵に横たわり陶器の枕で休みます。地名「八瀬」は「矢背」に由来すると伝わります。",
     "<b>から風呂（香川・さぬき市）</b>：約1300年前、奈良時代の高僧・行基が造ったと伝わる石室サウナ。松葉を約150kg焚き、濡れむしろに塩をまいて蒸します。今も現役です。",
     "<b>石風呂</b>：瀬戸内海沿岸に点在した岩穴式の蒸し風呂。岩窟で火を焚き、海藻や筵で蒸気浴しました。"

    {type:"h",text:"江戸の銭湯も蒸し風呂だった"},

    {type:"note",cool:true,text:"現代の第三次サウナブームは「輸入文化の流行」ではなく、<b>1300年の蒸し風呂史への回帰</b>とも言えます。この視点を持つと、サウナがもっと面白くなります。"}

    {type:"p",text:"ノルウェー語でサウナは「バストゥーエ（badstue）」。ヴァイキング時代から存在し、土曜日を意味する lørdag は古ノルド語の「風呂の日（laugardagr）」に由来します。しかし宗教改革後の裸体禁止令で、バストゥーエ文化は約300年間も途絶えました。復活の転機は1999年、フィヨルドに浮かぶサウナの登場。以降オスロでは港に浮かぶサウナが爆発的に増え、今や「世界の浮きサウナ首都」と呼ばれます。"},

    {type:"p",text:"鍵は深部体温です。サウナでいったん深部体温を上げると、その後1〜2時間かけて下がっていき、この“体温の下り坂”が強い眠気を生みます。つまり、眠りたい時刻の1〜2時間前にサウナを終えるのが理想。加藤医師が関わった宿泊施設での共同実験では、サウナ併用グループは入眠までの時間が約半分になり、入眠直後の深い睡眠が増えたと報告されています（企業との共同実験で、査読論文としての詳細は未確認）。"},

/* ========== 熱の物理学（マスター） ========== */
{

 lessons:[
  {
   id:"l17-1", title:"ロウリュはなぜ熱いのか——潜熱の科学",
   blocks:[
    {type:"p",text:"ロウリュの瞬間、室温計はほとんど動かないのに、体感は劇的に熱くなる。この謎を解く鍵が「潜熱（せんねつ）」です。"},
    {type:"h",text:"皮膚の上で起きる“逆結露”"},
    {type:"p",text:"水は蒸発するときに熱を奪い、凝縮する（水に戻る）ときに熱を放出します。この出入りする熱が潜熱で、その量は約2,260kJ/kg——1gの水蒸気が皮膚の上で水滴に戻るだけで、約540カロリーの熱が皮膚に直接注ぎ込まれる計算です。ロウリュで発生した水蒸気は、室内で最も冷たい表面——つまりあなたの皮膚（約33℃）——で凝縮し、潜熱を解放します。これが「熱波」の正体です。"},
    {type:"h",text:"もうひとつの理由——汗が乾かない"},
    {type:"p",text:"人体の冷却装置は汗の蒸発です。ところが湿度が上がると汗が蒸発できなくなり、冷却が効かなくなる。つまりロウリュは「熱を注ぎ込む（凝縮）」と「冷却を切る（蒸発阻害）」のダブルパンチで体感温度を押し上げるのです。専門メディアの計測例では、ロウリュ直後に湿度は10〜15%から40〜60%へ数秒で急上昇するとされます。"},
    {type:"statbig",items:[{b:"約2,260kJ/kg",s:"水の凝縮潜熱（物理定数）"},{b:"約33℃",s:"皮膚表面＝室内で最も冷たい面"},{b:"数秒",s:"ロウリュで湿度が数倍になる時間"}]},
    {type:"note",text:"「80℃のフィンランド式が90℃のドライサウナより熱く感じる」のは気のせいではなく、<b>物理法則</b>です。温度計の数字だけでサウナの強さは測れません。"}
   ],
   sources:[

    {label:"ThermalFinn｜Sauna Thermodynamics",url:"https://thermalfinn.com/thermodynamics/",icon:"🌡️"}

    {q:"ロウリュで体感温度が上がる理由として正しい組み合わせは？",choices:["室温が10℃上がる＋照明が暗くなる","凝縮潜熱の放出＋汗の蒸発冷却の阻害","酸素が減る＋心拍が下がる","石が発光する＋音の効果"],answer:1,explain:"<b>潜熱の注入と蒸発冷却の停止</b>のダブルパンチ。室温自体はほぼ変わりません。"}
   ]

  {
   id:"l17-2", title:"熱の三態と温度成層",
   blocks:[
    {type:"p",text:"サウナ室の熱は、3つのルートであなたに届きます。この配分を知ると、席選びが物理学になります。"},
    {type:"h",text:"3つの熱伝達"},
    {type:"list",items:[
     "<b>対流</b>：ストーブで温まった空気が循環して熱を運ぶ。上段ほど熱いのはこれ。",
     "<b>輻射（放射）</b>：ストーブ・石・壁・天井、そして他の入浴者からの赤外線。対流と並ぶ主要な熱の伝わり方とされる。",
     "<b>伝導</b>：ベンチとの接触面から伝わる熱。木材の性質が効く（次のレッスンで）。"
    ]},
    {type:"h",text:"温度成層——サウナ室は熱のミルフィーユ"},
    {type:"p",text:"温かい空気は軽く、上に溜まります。この鉛直方向の温度差を「温度成層」と呼び、フィンランド式サウナでは天井付近110℃超・床付近30℃前後という例も報告されています（室により大きく変動）。同じ部屋の中に、実は80℃もの温度差が隠れているのです。"},
    {type:"note",cool:true,text:"応用：<b>「足を上げる」が理にかなう理由</b>も成層です。座って足を下ろすと、頭は100℃・足は50℃の“温度差サンドイッチ”に。体を同じ高さに揃えるほど、均一に温まります（加藤医師の推奨とも一致）。"}
   ],
   sources:[

    {label:"ThermalFinn｜Sauna Thermodynamics",url:"https://thermalfinn.com/thermodynamics/",icon:"🌡️"}

    {q:"サウナで「足を上げる」のが理にかなっている理由は？",choices:["筋トレになる","温度成層の中で体を同じ温度帯に揃えられる","靴下が乾く","マナーだから"],answer:1,explain:"頭と足で数十℃違う<b>温度成層</b>の中では、体を水平に近づけるほど均一に温まります。"}

    {type:"p",text:"90℃のサウナ室で、90℃の木のベンチには座れるのに、90℃の金具に触れると飛び上がる。この日常の謎を解くのが「熱慣性（サーマル・エフュージビティ）」です。"},
    {type:"h",text:"接触温度は“平均”で決まる"},
    {type:"p",text:"物に触れたとき皮膚が感じる温度は、物体の温度そのものではなく、皮膚と物体の熱慣性の重み付き平均で決まります。熱慣性が小さい木は皮膚に熱をゆっくりしか渡せないため、90℃のシダー材でも接触面は約43.5℃（痛みを感じる約48℃以下）。一方ステンレスは熱慣性が桁違いに大きく、接触面は約82.5℃——即やけどです。"},
    {type:"h",text:"樹種別・熱伝導率（W/m·K）"},
    {type:"list",items:[
     "<b>アバチ 0.09</b>／アスペン 0.10／ウエスタンレッドシダー 0.11——低いほど「熱くない」ベンチ向き。",
     "スプルース 0.12／ノルディックパイン 0.14／ハンノキ 0.15。",
     "参考：ガラス 1.0／ステンレス 16（シダーの約145倍）／アルミ 205。"
    ]},
    {type:"note",warn:true,text:"<b>節（ふし）に注意</b>：木の節は密度と樹脂分が高く、熱伝導率が周囲の2〜4倍。局所的に55〜65℃の熱いスポットになりえます。サウナ用材が「節なし等級」を使うのは、美観ではなく安全のためです。"}
   ],
   sources:[
    {label:"ThermalFinn｜Sauna Wood Thermal Conductivity",url:"https://thermalfinn.com/thermodynamics/wood-thermal-conductivity/",icon:"🌲"},
    {label:"Siemens Simcenter｜Why Metal Sauna Benches Aren't a Thing",url:"https://blogs.sw.siemens.com/simcenter/touch-temperature-part-1-why-metal-sauna-benches-arent-a-thing/",icon:"⚙️"}
   ],
   quiz:[
    {q:"90℃のサウナで木に座れて金属でやけどする理由を決める物性は？",choices:["色","熱慣性（エフュージビティ）","重さ","硬さ"],answer:1,explain:"<b>熱慣性</b>の差。接触面温度は木で約43.5℃、ステンレスで約82.5℃になります。"},
    {q:"サウナ材に「節なし」が選ばれる実用的な理由は？",choices:["高級に見える","節は熱伝導率が高く熱いスポットになるから","軽いから","香りが強いから"],answer:1,explain:"節は熱伝導率が周囲の<b>2〜4倍</b>で、局所的な高温スポットになるためです。"}
   ]
  },
  {
   id:"l17-4", title:"ストーブ設計とストーンの科学",
   blocks:[
    {type:"h",text:"Harvia公式・出力の設計則"},
    {type:"list",items:[
     "基本は<b>室容積1m³あたり約1kW</b>（8m³なら8kW級）。",
     "ガラスや石などの無断熱面は<b>1m²につき容積1.2m³ぶん</b>を加算。",
     "無断熱のログ壁は係数<b>1.5</b>。",
     "出力不足のストーブは常時フル稼働になり、かえって寿命を縮める。"
    ]},
    {type:"h",text:"サウナストーンの正解"},
    {type:"p",text:"フィンランドの標準は「オリビン・ダイアベース」というかんらん岩系の火山岩。高密度で蓄熱容量が大きく、ロウリュの急冷に耐える耐熱衝撃性を併せ持ちます。Harviaは5〜10cmサイズを20kg箱で販売し、約1,000℃で熱処理した業務用グレードも存在します。"},
    {type:"h",text:"換気の定石と「200の法則」"},
    {type:"p",text:"フィンランド式の換気は「給気はストーブ付近の低い位置、排気は天井近くの対角」が基本で、換気回数の目安は毎時約6回とされます。また快適域の経験則として「気温（華氏°F）＋相対湿度（%）≒200」という<b>200の法則</b>が知られています（例：180°F≒82℃なら湿度20%）。※華氏基準の法則なので、摂氏のまま足すと成立しない点に注意。"},
    {type:"note",text:"ここまで学ぶと、施設のサウナ室を見る目が変わります。<b>「ストーブは室容積に見合っているか」「給排気はどこか」「石は何をどれだけ積んでいるか」</b>——プロの視点です。"}
   ],
   sources:[
    {label:"Harvia公式サポート｜How do I select the correct heater power?",url:"https://support.harvia.com/hc/en-gb/articles/22158995674524-How-do-I-select-the-correct-heater-power",icon:"🔥"},
    {label:"Harvia公式｜サウナストーン製品情報",url:"https://www.harvia.com/en-US/sauna-heater-stones/",icon:"🪨"},

   ],
   quiz:[
    {q:"Harviaの設計則で、室容積1m³あたりに必要なストーブ出力は約？",choices:["0.1kW","1kW","5kW","10kW"],answer:1,explain:"<b>1m³≒1kW</b>が基本。ガラス面1m²は容積1.2m³ぶんとして加算します。"},
    {q:"フィンランドで標準とされるサウナストーンの岩石は？",choices:["大理石","オリビン・ダイアベース（かんらん岩系）","軽石","花崗岩のみ"],answer:1,explain:"<b>オリビン・ダイアベース</b>。高い蓄熱容量と耐熱衝撃性が理由です。"}

/* ========== 論文で読むサウナ健康学（マスター） ========== */
{
 id:"ch18", tier:"t4", icon:"📄", accent:"var(--calm)",
 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-43.jpg", photoAlt:"窓辺のサウナストーブと石の落ち着いた室内",
 title:"論文で読むサウナ健康学", subtitle:"エビデンスを一次資料で",
 desc:"体温と発汗の生理学、KIHDコホート、RCTとの矛盾。数字と論文で語る健康効果。",
 lessons:[
  {
   id:"l18-1", title:"サウナ中、体の中で何が起きているか",
   blocks:[
    {type:"p",text:"「気持ちいい」の裏側で、体は精密な熱制御を行っています。査読論文（Heinonen & Laukkanen 2018のレビュー等）が報告する数字を見てみましょう。"},
    {type:"h",text:"体温と発汗の生理データ"},
    {type:"list",items:[
     "<b>皮膚温</b>：まず先に上昇し、約40℃に達する。",
     "<b>深部体温</b>：37℃から緩やかに38℃へ、その後やや速く約39℃まで上昇。",
     "<b>発汗量</b>：中温サウナで約0.6〜1.0kg/時。運動を併用した強い熱ストレス下では2〜4L/時に達しうる。",
     "<b>循環</b>：心拍出量が最大60〜70%増加。体循環の50〜70%が深部から皮膚へ再配分される。"
    ]},
    {type:"h",text:"HSPが働き始める温度"},
    {type:"p",text:"第2章で登場したヒートショックプロテイン（HSP）は、おおむね深部体温38.5℃超で発現が増えるとされます。つまり「深部体温を38℃台後半まで上げる」ことが、サウナの生理的効果を引き出す一つの目安になります。"},
    {type:"note",warn:true,text:"人間は「耐えられる最高体温」を鍛えて上げることはできません。高温はタンパク質の立体構造（フォールディング）を根本から壊すため、一定を超えれば必ず危険。<b>我慢は生理学的に無意味</b>だと、数字が教えてくれます。"}
   ],
   sources:[
    {label:"Heinonen & Laukkanen 2018｜Finnish sauna bathing の生理レビュー（AJP, DOI:10.1152/ajpregu.00115.2017）",url:"https://journals.physiology.org/doi/full/10.1152/ajpregu.00115.2017",icon:"📄"},
    {label:"ScienceDirect｜Sauna use as a lifestyle practice to extend healthspan",url:"https://www.sciencedirect.com/science/article/pii/S0531556521002916",icon:"🔬"}
   ],
   quiz:[
    {q:"一般的なフィンランド式サウナで深部体温はおよそ何℃まで上がる？",choices:["約37℃","約39℃","約42℃","約45℃"],answer:1,explain:"37℃→38℃→<b>約39℃</b>と上昇。HSPは概ね38.5℃超で発現が増えます。"},
    {q:"「我慢して長く入るほど強くなる」が生理学的に無意味な理由は？",choices:["筋肉がつかないから","高温はタンパク質構造を壊すため耐熱の上限は上げられない","時間の無駄だから","汗が出ないから"],answer:1,explain:"高温は<b>タンパク質のフォールディングを破壊</b>します。耐えられる体温に上限があるのは物理法則です。"}
   ]
  },
  {
   id:"l18-2", title:"KIHDコホート——20年の追跡が語ること",
   blocks:[
    {type:"p",text:"サウナ健康研究の“ゴールドスタンダード”が、フィンランド東部大学のKIHD研究（Kuopio Ischaemic Heart Disease）。中年男性を数十年追跡した大規模観察研究群です。"},
    {type:"h",text:"主な報告（すべて観察研究＝相関）"},
    {type:"list",items:[
     "<b>心臓突然死</b>：週4〜7回利用者は週1回に比べ約63%低い（2015, JAMA Intern Med）。",
     "<b>認知症・アルツハイマー病</b>：週4〜7回で約66%・65%低い。",
     "<b>精神病性障害</b>：男性2,138人・中央値24.9年追跡で、週4〜7回のリスクは週1回の約5分の1（多変量調整後HR0.21）。",
     "<b>炎症マーカー</b>：男性2,269人・11年で、頻回利用者ほどhsCRPが低い。"
    ]},
    {type:"h",text:"“頻度と時間”の用量反応"},
    {type:"p",text:"KIHD研究の特徴は、回数が多いほど・1回が長いほどリスクが下がる「用量反応関係」が見られた点です。これは因果を示唆する状況証拠のひとつとされますが、それでも観察研究の限界は残ります。"},
    {type:"note",text:"覚えておくべき数字は<b>「週4〜7回」</b>。多くの好結果がこの高頻度群で観察されています。ただし対象は主に中年フィンランド人男性である点を忘れずに。"}
   ],
   sources:[
    {label:"Laukkanen et al., JAMA Internal Medicine 2015（心臓突然死）",url:"https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2130724",icon:"📄"},
    {label:"Medical Principles and Practice（PMC）｜サウナ頻度と精神病性障害",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC6422146/",icon:"🔬"}
   ],
   quiz:[
    {q:"KIHD研究で心臓突然死リスクが約63%低かったのはどの頻度群？",choices:["週1回","週2〜3回","週4〜7回","月1回"],answer:2,explain:"<b>週4〜7回</b>の高頻度群。多くの好結果がこの群で観察されています。"},
    {q:"KIHD研究群の性質として正しいのは？",choices:["ランダム化比較試験","日本人対象","主に中年男性の観察研究（相関）","1週間の短期実験"],answer:2,explain:"<b>中年フィンランド人男性の長期観察研究</b>。相関であり、因果の完全な証明ではありません。"}
   ]
  },
  {
   id:"l18-3", title:"観察研究とRCTの矛盾を読み解く",
   blocks:[
    {type:"p",text:"ここがマスターの分かれ目。「サウナは体にいい」の受け止め方には、科学的な作法があります。"},
    {type:"h",text:"食い違う二つの証拠"},
    {type:"list",items:[
     "<b>観察研究（KIHD等）</b>：サウナ頻回者は心疾患・死亡リスクが劇的に低い。ただし相関。",
     "<b>RCT（ランダム化比較試験）</b>：2025年発表の20試験メタ分析では、全体としては受動加熱による有意な血圧低下は確認されなかった（ただし心血管リスク群など一部のサブグループでは有意な低下を示す結果もあり、一枚岩の結論ではない）。"
    ]},
    {type:"h",text:"なぜ矛盾するのか——交絡という落とし穴"},
    {type:"p",text:"考えられる説明のひとつが「交絡（こうらく）」。週4〜7回もサウナに通える人は、そもそも健康で、時間と経済に余裕があり、社会的つながりも豊か——という別要因が、リスク低下の一部を説明している可能性があります。つまり「サウナが健康を作った」のか「健康な人がサウナに通える」のか、観察研究だけでは切り分けられないのです。"},
    {type:"note",warn:true,text:"マスターの心得三箇条：<b>①相関と因果を区別する ②「治る」と断定する情報を疑う ③自分の体調と主治医を最優先する</b>。この批判的視点こそ、あらゆる健康情報から身を守る最強の教養です。"}
   ],
   sources:[
    {label:"PMC｜受動加熱と血圧のRCTメタ分析（2025）",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12490526/",icon:"🔬"},
    {label:"Journal of Applied Physiology｜冠動脈疾患患者のサウナRCT（2023）",url:"https://journals.physiology.org/doi/full/10.1152/japplphysiol.00322.2023",icon:"📄"}
   ],
   quiz:[
    {q:"観察研究とRCTでサウナの評価が食い違う主な理由として説明されるのは？",choices:["測定ミス","交絡（サウナに通える人はそもそも健康で余裕がある等）","RCTは信用できない","偶然"],answer:1,explain:"<b>交絡</b>。相関の背後に別の要因が隠れている可能性を、観察研究は排除しきれません。"},
    {q:"2025年の20試験RCTメタ分析が示したサウナ等受動加熱の血圧への効果は？",choices:["大幅に低下","有意な低下は確認されなかった","上昇した","測定不能"],answer:1,explain:"<b>有意な血圧低下は確認されず</b>。観察研究の好結果を「効果」と断定できない根拠です。"}
   ]
  }
 ]
},
/* ========== サウナ経営学と業界地図（マスター） ========== */
{
 id:"ch19", tier:"t4", icon:"🏢", accent:"var(--gold)",

 title:"サウナ経営学と業界地図", subtitle:"つくる側・商う側の知識",

 lessons:[
  {
   id:"l19-1", title:"サウナを開くための法律",
   blocks:[
    {type:"p",text:"「いつか自分のサウナを」と夢見る人へ。趣味と商売の間には、公衆浴場法という一本の線があります。"},
    {type:"h",text:"公衆浴場法の基本"},
    {type:"list",items:[
     "他人を入浴させて営業するには、<b>都道府県知事等の営業許可</b>（浴場業）が必要（公衆浴場法・昭和23年）。",
     "区分は「一般公衆浴場」（＝料金統制のある銭湯）と「<b>その他の公衆浴場</b>」。サウナ・健康ランド・個室サウナはすべて後者。",
     "構造設備・衛生の具体基準は<b>各都道府県の条例</b>で定めるため、自治体ごとに違う。",
     "申請には建築基準法の検査済証、消防法令適合通知書などが必要。"
    ]},
    {type:"h",text:"個室サウナ開業の現実"},
    {type:"p",text:"近年急増した個室サウナも、他人を入浴させる以上は「その他の公衆浴場」の許可が原則必要です。保健所への事前相談から始め、消防・建築の要件を満たして施設検査を受ける——サウナ開業に個人資格は要りませんが、行政手続きのハードルは決して低くありません。"},
    {type:"note",text:"「サウナ・スパ プロフェッショナル」資格のテキストが、レジオネラ症対策（循環浴槽の残留塩素0.4〜1.0mg/L維持）や防火管理まで扱うのは、まさにこの<b>“商う側”の責任</b>を教えるためです。"}
   ],
   sources:[
    {label:"厚生労働省｜公衆浴場法概要",url:"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/seikatsu-eisei/seikatsu-eisei04/04.html",icon:"⚖️"},
    {label:"マネーフォワード｜サウナを開業するには",url:"https://biz.moneyforward.com/establish/basic/51932/",icon:"📋"}
   ],
   quiz:[
    {q:"個室サウナを営業する際に原則必要な許可は？",choices:["飲食店営業許可","公衆浴場法の「その他の公衆浴場」許可","古物商許可","不要"],answer:1,explain:"他人を入浴させる以上、<b>「その他の公衆浴場」の営業許可</b>が原則必要です。"},
    {q:"サウナの構造設備・衛生の具体的な基準はどこで定められる？",choices:["公衆浴場法本体","各都道府県の条例","国土交通省令","業界の自主ルール"],answer:1,explain:"法律は枠組みのみで、<b>都道府県の条例</b>が具体基準を定めます。だから自治体で違います。"}
   ]
  },
  {
   id:"l19-2", title:"サウナ施設の経済学",
   blocks:[
    {type:"p",text:"コスパで斬るGOMIRACHELINなら、施設を“経営の目”でも見たいところ。ざっくりした数字感覚を持ちましょう。"},
    {type:"h",text:"かかるお金・入るお金"},
    {type:"list",items:[
     "<b>初期費用</b>：小規模でも数千万円規模が一般的。水風呂・排水・防水・断熱工事が費用を押し上げる。",
     "<b>ランニング</b>：燃料費・水道光熱費が近年高騰。月数十万〜数百万円。",
     "<b>試算例</b>：料金2,000円×1日10人＝年商約700万円。コストを売上の50%と置くと、経営者の手取りは年300〜400万円という民間試算。",
     "<b>資金調達</b>：日本政策金融公庫の新規開業資金（限度額7,200万円）や小規模事業者持続化補助金、クラファンなど。"
    ]},
    {type:"h",text:"個室サウナの弱点＝稼働率"},
    {type:"p",text:"個室・少人数型は同時に入れる人数が構造的に少なく、収益が「稼働率」に直結します。予約枠の空白と当日キャンセルが、そのまま固定費の垂れ流しに。だからこそ立地・予約体験・差別化が生死を分けます。"},
    {type:"note",cool:true,text:"参考：スーパー銭湯最大手・極楽湯ホールディングス（東証スタンダード）の2025年3月期連結売上高は約151.6億円。“ととのい”は、いまや立派な産業です。"}
   ],
   sources:[
    {label:"マネーフォワード｜サウナ開業の費用と収益",url:"https://biz.moneyforward.com/establish/basic/51932/",icon:"💴"},
    {label:"極楽湯ホールディングス｜会社概要",url:"https://www.gokurakuyu-holdings.co.jp/corporate/profile.html",icon:"♨️"}
   ],

}

    S.streak.last=t;

  if(S.goal.date!==t){S.goal.date=t;S.goal.count=0;}

    ${ls.sources.map(s=>`<a class="srccard" href="${s.url}" target="_blank" rel="noopener">
      <div class="si">${s.icon||'🔗'}</div>
      <div class="sx"><b>${esc(s.label)}</b><span>${(()=>{try{return new URL(s.url).hostname;}catch(e){return s.url;}})()}</span></div>
      <div class="go">開く ↗</div></a>`).join("")}
  </div>`:"";
  const prev=idx>0?ch.lessons[idx-1]:null;
  const next=idx<ch.lessons.length-1?ch.lessons[idx+1]:null;
  const alreadyDone=S.done.includes(ls.id);
  document.getElementById("view-lesson").innerHTML=`<section class="section"><div class="wrap reader">
    <div class="backlink" onclick="go('chapter','${ch.id}')">‹ ${esc(ch.title)}</div>
    <div class="r-eyebrow" style="color:${tm.color}">${tm.icon} ${tm.name} ・ LESSON ${idx+1}</div>
    <h2>${esc(ls.title)}</h2>
    <div class="progress-line"><i style="width:${Math.round((idx+1)/ch.lessons.length*100)}%"></i></div>
    ${body}
    ${quizHtml?`<div id="quizZone"><p class="unitnote" style="font-family:var(--label);font-size:12.5px;color:var(--muted);margin-top:26px">📝 単位認定：理解度チェックに全問正解すると、このレッスンを完了できます（不正解でも再挑戦できます）</p>${quizHtml}</div>`:""}
    ${srcHtml}
    <div class="blogcta" style="margin-top:34px">
      <div class="bx"><div class="beye">GOMIRACHELIN</div>
        <h3>もっと知りたくなったら</h3>
        <p>実際の施設で、学んだ知識を確かめてみませんか。忖度なしの正直レビューが待っています。</p>
      </div>
      <a class="btn ghost" href="https://sauna-cospa.com" target="_blank" rel="noopener">ブログへ →</a>
    </div>
    <div class="lesson-nav">
      ${prev?`<button class="btn ghost" onclick="go('lesson',{ch:'${ch.id}',ls:'${prev.id}'})">‹ 前のレッスン</button>`:`<span></span>`}
      <button class="btn gold" id="lessonDone" onclick="completeLesson()" ${(!alreadyDone&&(ls.quiz||[]).length)?'disabled':''}>${alreadyDone?'✓ 完了済み ・ 次へ':'このレッスンを完了 →'}</button>
    </div>
  </div></section>`;
}
function renderBlock(b){
  if(b.type==="p")return `<div class="block"><p>${b.text}</p></div>`;
  if(b.type==="h")return `<div class="block"><h3>${esc(b.text)}</h3></div>`;
  if(b.type==="list")return `<div class="block"><ul>${b.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
  if(b.type==="note")return `<div class="block"><div class="note${b.warn?' warn':''}${b.cool?' cool':''}">${b.text}</div></div>`;
  if(b.type==="quote")return `<div class="block"><div class="quote">${esc(b.text)}${b.small?`<small>${esc(b.small)}</small>`:""}</div></div>`;
  if(b.type==="statbig")return `<div class="block"><div class="statbig">${b.items.map(s=>`<div class="s"><b>${esc(s.b)}</b><span>${esc(s.s)}</span></div>`).join("")}</div></div>`;
  return "";
}
function renderLessonQuiz(q,qi){
  const opts=q.choices.map((c,ci)=>`
    <div class="opt" data-q="${qi}" data-c="${ci}" onclick="answerLessonQuiz(${qi},${ci})">
      <div class="k">${String.fromCharCode(65+ci)}</div><div>${esc(c)}</div>
    </div>`).join("");
  return `<div class="lquiz" data-qi="${qi}">
    <div class="qtag">◆ 理解度チェック ${qi+1}</div>
    <div class="q">${esc(q.q)}</div>
    <div class="opts">${opts}</div>
    <div class="explain" id="exp-${qi}"></div>
  </div>`;
}
function answerLessonQuiz(qi,ci){
  if(!LSTATE||LSTATE.answered[qi]!=null)return;
  const q=LSTATE.ls.quiz[qi]; const ok=(ci===q.answer);
  LSTATE.answered[qi]=ci;
  if(ok){LSTATE.correct++;S.correctTotal++;if(S.correctTotal>=50)award("quiz50");if(S.correctTotal>=150)award("quiz150");save();}
  const zone=document.querySelector(`.lquiz[data-qi="${qi}"]`);
  zone.querySelectorAll(".opt").forEach(o=>{
    const c=+o.dataset.c; o.setAttribute("disabled","");
    if(c===q.answer)o.classList.add("correct");
    else if(c===ci)o.classList.add("wrong");
    else o.classList.add("dim");
  });
  const exp=document.getElementById("exp-"+qi);
  exp.className=`explain show ${ok?"ok":"ng"}`;
  exp.innerHTML=(ok?"✅ 正解！":"❌ 不正解。")+`<br>${q.explain}`;
  touchStreak();
  addXp(ok?(LSTATE.retry?2:10):(LSTATE.retry?0:3));
  const total=(LSTATE.ls.quiz||[]).length;
  if(Object.keys(LSTATE.answered).length>=total){
    if(LSTATE.correct>=total){
      const btn=document.getElementById("lessonDone");
      if(btn)btn.removeAttribute("disabled");
      if(!S.done.includes(LSTATE.ls.id))toast("🎓","全問正解！単位認定——完了ボタンで次へ");
    }else{
      const zone=document.getElementById("quizZone");
      if(zone&&!document.getElementById("quizRetry")){
        zone.insertAdjacentHTML("beforeend",`<div id="quizRetry" style="text-align:center;margin-top:18px">
          <p style="color:var(--muted);font-size:13.5px;margin-bottom:10px">${total-LSTATE.correct}問が不正解。解説を読んで、もう一度挑戦しましょう。</p>
          <button class="btn ghost" onclick="retryLessonQuiz()">🔁 もう一度挑戦する</button></div>`);
      }
    }
  }
}
function retryLessonQuiz(){
  if(!LSTATE)return;
  LSTATE.answered={};LSTATE.correct=0;LSTATE.retry=true;
  const zone=document.getElementById("quizZone");
  if(!zone)return;
  const quizHtml=(LSTATE.ls.quiz||[]).map((q,qi)=>renderLessonQuiz(q,qi)).join("");
  zone.innerHTML=`<p class="unitnote" style="font-family:var(--label);font-size:12.5px;color:var(--muted);margin-top:26px">📝 単位認定：理解度チェックに全問正解すると、このレッスンを完了できます（不正解でも再挑戦できます）</p>`+quizHtml;
  zone.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"});
}
function completeLesson(){
  if(!LSTATE)return;
  const {ch,ls}=LSTATE;
  const wasNew=!S.done.includes(ls.id);
  if(wasNew&&(ls.quiz||[]).length){
    if(Object.keys(LSTATE.answered).length<ls.quiz.length||LSTATE.correct<ls.quiz.length){
      toast("✍️","理解度チェックに全問正解するとレッスン完了です");return;
    }
  }
  if(wasNew){
    S.done.push(ls.id);
    award("first");
    addXp(20);
    toast("📚","レッスン完了！+20 XP");
    checkTierBadges();
    save();
  }
  const idx=ch.lessons.indexOf(ls);
  const next=ch.lessons[idx+1];
  if(next)go("lesson",{ch:ch.id,ls:next.id});
  else go("chapter",ch.id);
}

const ZEMI_LECTURES=[{"moduleId":"gyotai","title":"業態戦略——数字で選ぶ、あなたのサウナのかたち","icon":"🧭","subtitle":"業態戦略ゼミ｜「どのサウナ屋になるか」を数字と制度で決める","intro":"無料章「サウナ開業の全体像とビジネスモデル」では、4つの業態を初期投資の地図として眺めました。このゼミでは、その地図に等高線を描き込みます。業態ごとの月次コスト構造、公表されている実例収支の検算のしかた、サウナ×カフェ・サウナ×宿泊という複合業態の制度と算盤、居抜き・中古設備の経済性と落とし穴、公庫の開業統計を物差しにした意思決定フレーム、そして立地と商圏の読み方。「どの業態を選ぶか」を、雰囲気ではなく数字と制度で決められるようになる——そのための6レッスンです。","lessons":[{"title":"業態は「月次の家計簿」で選ぶ——固定費構造の読み方","blocks":[{"type":"p","text":"無料章で見たのは「入口のお金」、つまり初期投資でした。しかし業態の性格を本当に決めるのは、開業した翌月から毎月出ていくお金——固定費の構造です。このレッスンでは、中小機構（J-Net21）が公開しているスーパー銭湯の事業モデルを「家計簿」として読み解き、そこから4業態すべてに通じる原理を取り出します。"},{"type":"h","text":"施設型のモデル収支を分解する"},{"type":"list","items":["J-Net21の起業ガイドが示す施設型のモデルは、<b>平均客単価1,200円（軽食コーナーや入浴セットの利用込み）×1日1,000人</b>。日商約120万円、月商約3,600万円、年商約4億3,200万円という規模感です。","対する月次支出の例は<b>合計1,480万円</b>。内訳は施設減価償却費700万円、水道光熱費・諸経費600万円、人件費160万円、広告宣伝費20万円。","最大の費目は広告でも人件費でもなく、<b>減価償却費（初期投資約4億円を5年で回収する前提）と水道光熱費</b>。この2つだけで月次支出の約88%を占めます。"]},{"type":"p","text":"つまり施設型は、客が一人も来ない月でも巨額の費用が出ていく「装置産業」です。ここから逆算すると、4業態の違いは初期投資の桁だけではなく、<b>「客が来ない月に、いくら出ていくか」</b>の違いだと分かります。個室サウナなら家賃と光熱費、テントサウナなら保管費と車両維持費程度、バレル設置型なら土地代——固定費が軽い業態ほど、外した時の傷が浅く、撤退もしやすいのです。"},{"type":"h","text":"あなたの業態の「家計簿」を作る4つの手順"},{"type":"list","items":["手順①：想定物件の<b>家賃・共益費</b>を調べる（施設型モデルでは減価償却費がこの位置に相当します）。","手順②：<b>水道光熱費</b>を、ストーブの熱源（電気・ガス・薪）と営業時間から概算する。温浴業はここが経営を直撃する費目だというのは、無料章で見た通りです。","手順③：<b>人件費</b>を決める。自分ひとりか、家族か、雇用するのか。無人運営型なら予約・解錠システムなどの管理費に置き換わります。","手順④：合計を「売上ゼロでも毎月出ていく金額」として書き出し、<b>手元資金で何カ月耐えられるか</b>を数える。この「耐久月数」が業態選びの安全余白になります。"]},{"type":"note","cool":true,"text":"J-Net21のモデル数値は2026年7月時点で公開されている試算例であり、立地・規模・エネルギー価格で大きく変わります。本講義は一般的な情報であり、法的・税務的助言ではありません。実際の事業計画は税理士・中小企業診断士・行政窓口など専門家に必ず確認してください。"}],"sources":[{"label":"J-Net21（中小機構）｜スーパー銭湯\u2028起業ガイド（事業モデル収支）","url":"https://j-net21.smrj.go.jp/startup/guide/service/h006.html","icon":"🏛️"}]},{"title":"公表収支の検算——ハコサウナの1,500万円をもう一段深く読む","blocks":[{"type":"p","text":"無料章では、熊本のトレーラーサウナ「ハコサウナ」が公表する初期投資約1,500万円・回収約2.5年という数字を紹介しました。ゼミではもう一段踏み込み、<b>公表された数字を自分で検算し、自分の計画に翻訳する手順</b>を練習します。他人の公表収支は、検算して初めて教材になります。"},{"type":"h","text":"検算①——「回収2.5年」は数字として整合するか"},{"type":"list","items":["公表値は客単価4,000円・月商約140万円・利益率40%。つまり月間利益は<b>140万円×40%＝約56万円</b>。","初期投資1,500万円÷月56万円＝<b>約27カ月（約2.2年）</b>。立ち上がり期の低稼働まで見込めば、公表の「約2.5年」は保守的に丸めた妥当な数字だと分かります。数字同士が矛盾しない公表例は、それだけで信頼度が一段上がります。","月商140万円÷客単価4,000円＝<b>月あたり延べ約350人</b>。トレーラー2台なら1台あたり月175人、1日あたり延べ6人弱です。この稼働イメージが自分の商圏・営業時間で現実的か——ここが他人の数字を自分の計画に翻訳する接続点になります。"]},{"type":"h","text":"検算②——「利益率40%」の中身を問う"},{"type":"p","text":"公表収支を読むとき必ず確認したいのが、<b>オーナー自身の人件費がコストに含まれているか</b>です。家族経営や無人運営で人件費を計上していなければ、利益率は高く見えます。あなたが人を雇って同じ店をやるなら、その分を引いた利益率で回収期間を引き直す必要があります。同じく、その「利益」が借入返済前なのか後なのかでも意味は変わります。公表する側が悪いのではなく、<b>定義を確かめずに流用する側が危ない</b>のです。"},{"type":"list","items":["内訳にもヒントがあります。公表ではサウナ本体が300万円なのに対し、<b>運送・工事・備品などの付帯費用は本体と同等かそれ以上</b>。カタログの本体価格を2倍しても、まだ総額の半分に届かない——見積書を読むときの基準になる比率です。","土地条件も総額を左右します。給排水が既にあれば引込は10〜20万円程度、<b>更地からだと100万〜200万円以上</b>。同じ「1,500万円の計画」でも、土地次第で数百万円単位でブレます。","だからこそ同社は<b>総見積りの10〜20%の予備費</b>を推奨しています。予備費は「どんぶり勘定」ではなく、実例に裏付けられた設計項目です。","許認可は保健所（公衆浴場許可）・消防署・土木事務所（トレーラーの車両認定）の3系統だったと公表されています。固定建物で開業するなら車両認定の壁は消えますが、代わりに建築確認など建物側の論点が増えます。"]},{"type":"h","text":"検算③——あなた自身の予想も、検算の対象"},{"type":"p","text":"他人の数字を検算できるようになったら、最後は自分の予想月商に同じ目を向けます。日本政策金融公庫の2025年度新規開業実態調査では、開業前の予想月商を達成できた（達成率100%以上の）開業者は<b>約6割（58.7%）</b>。裏を返せば、<b>約4割は自分の予想を下回った</b>ということです。事業計画には「予想通りの表」だけでなく、売上が2〜3割下振れしても耐久月数が保てるかを試す「下振れの表」を必ず添えましょう。"},{"type":"note","warn":true,"text":"公表収支はその施設の立地・時期・運営体制に固有の結果であり、<b>「同じ投資をすれば同じ利益が出る」根拠にはなりません</b>。事業計画に使うときは、必ず自分の物件条件・人件費・金利で数字を引き直してください。本講義は一般的な情報であり、投資判断の助言ではありません。"}],"sources":[{"label":"ハコサウナ｜プライベートサウナ開業費用1,500万円の内訳（実例公表）","url":"https://hakosauna.com/blog/private-sauna-startup-cost","icon":"📗"},{"label":"日本政策金融公庫総合研究所｜2025年度新規開業実態調査（予想月商達成率）","url":"https://www.jfc.go.jp/n/findings/pdf/kaigyo_251205_1.pdf","icon":"🏦"}]},{"title":"複合業態のつくり方——サウナ×カフェ、サウナ×宿泊の制度と算盤","blocks":[{"type":"p","text":"サウナ料金だけで固定費を賄うのが苦しいとき、次の一手が複合業態です。実は厚労省の統計でも、公衆浴場の営業許可施設2万3,673施設（令和6年3月末）のうち、いわゆる街の銭湯（一般公衆浴場）は2,847施設。昭和45年には浴場業全体の87%を占めた一般公衆浴場が、令和5年度には12.0%まで下がり、スーパー銭湯や健康ランドのような<b>複合型の「その他の公衆浴場」が主流</b>になっています。さらに、レッスン1で見たJ-Net21の施設型モデルも客単価1,200円を「軽食コーナー、入浴セットなどを利用」した場合として説明しており、<b>大型温浴の収益モデルは最初から入浴×飲食×物販の複合</b>としてできています。小さなサウナがそれを縮小コピーするのは理にかなった発想です。"},{"type":"h","text":"サウナ×カフェ——単価と滞在時間を買う"},{"type":"list","items":["効果：サウナ後の1杯・1皿は客単価を直接積み上げます。カフェ側が「サウナ待ち」の受け皿にもなり、予約枠の隙間時間が売上に変わります。","制度：設備を設けて客に飲食させる営業には、<b>食品衛生法の営業許可（飲食店営業）が別途必要</b>です。平成30年の食品衛生法改正で営業許可業種の見直し・営業届出制度の創設・HACCP（ハサップ）に沿った衛生管理の制度化が行われています。出発点は管轄保健所への事前相談です。","実務のコツ：メニューを絞るほど設備要件も人手も軽くなります。<b>「フルキッチンのカフェ」ではなく「サウナ客のための一杯」から始める</b>のが定石です。"]},{"type":"h","text":"サウナ×宿泊——「泊まれるサウナ」の法律の線"},{"type":"list","items":["制度の線引き：<b>宿泊料を受けて人を宿泊させる営業は旅館業法の許可が必要</b>です（旅館・ホテル営業／簡易宿所営業／下宿営業の3類型）。「宿泊」とは寝具を使用して施設を利用することと定義されています。","見落としやすい点：厚労省の解説では、宿泊料という名目でなくても<b>休憩料・寝具賃貸料・クリーニング代・光熱水道費・室内清掃費など、実質的に寝具や部屋の使用料とみなされるものは宿泊料に含まれる</b>とされています。「サウナ付きレンタルスペースの深夜プラン」のつもりでも、寝具を出して朝まで滞在させれば旅館業に当たり得るということです。","効果：宿泊が加わると1組あたりの単価が大きく上がり、遠方客も商圏に入ります。グランピング施設がバレルサウナを集客装置にする流れ（無料章参照）の逆で、<b>サウナが主役の泊まれる施設</b>という設計もあり得ます。"]},{"type":"p","text":"算盤の面では、複合化の妙味は「固定費は1つ、財布は2つ」にできることです。同じ家賃・同じ光熱費基盤の上に、売上の柱をもう1本立てられる。レッスン1で作った家計簿に2本目の売上列を足して試算してみてください。ただし人員とオペレーションは確実に複雑になります。<b>1人で回せない複合は、固定費に人件費という最重量物を追加する</b>ことも忘れずに。"},{"type":"note","warn":true,"text":"複合業態は、許認可が業態の数だけ増えます。<b>無許可の宿泊営業・飲食営業は法令違反として処分の対象になり得ます</b>。計画段階で保健所（浴場・食品・旅館の各担当）と消防署に必ず相談してください。本講義は一般的な情報であり、法的助言ではありません。個別の判断は必ず行政窓口・専門家にご確認ください。"}],"sources":[{"label":"厚生労働省｜旅館業法（定義・営業種別・宿泊料の範囲）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000130600.html","icon":"🏛️"},{"label":"厚生労働省｜営業規制（営業許可・営業届出）に関する情報","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/shokuhin/kigu/index_00010.html","icon":"🏛️"},{"label":"厚生労働省｜公衆浴場業の概要（施設数の推移）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/seikatsu-eisei/seikatsu-eisei03/04.html","icon":"🏛️"},{"label":"J-Net21（中小機構）｜スーパー銭湯\u2028起業ガイド","url":"https://j-net21.smrj.go.jp/startup/guide/service/h006.html","icon":"🏛️"}]},{"title":"居抜き・中古設備の経済学——「安い」の内訳を見に行く","blocks":[{"type":"p","text":"初期投資を圧縮する二大手段が、居抜き物件と中古設備です。ただし、安さには必ず内訳があります。内訳を確認せずに飛びつくと、圧縮したはずの数百万円が後から改修費として戻ってくる——このレッスンでは「安さの内訳の見方」を、中小機構の起業マニュアルに沿って整理します。"},{"type":"h","text":"居抜きの本当の価値は「内装」ではなく「インフラ」"},{"type":"list","items":["J-Net21の起業マニュアルは、前の借主の内装や設備を引き継ぐ居抜き物件を借りると<b>内装や設備の費用を抑えられる</b>としています。飲食店なら「居抜物件を探しておけば内装工事を簡単に済ませることができる」とも。","ただしサウナの場合、本当の価値は壁紙や什器ではありません。<b>給排水・電気容量・換気というライフライン</b>です。レッスン2で見た通り、給排水の引込は条件次第で10〜20万円にも100万〜200万円以上にもなる。飲食店や浴場系の居抜きは、この一番高い部分を引き継げる可能性があるから強いのです。","内見時の基本チェックはトイレ・水回り・電気・空調・換気（J-Net21が挙げる確認項目）。サウナ用途ではさらに、ストーブに必要な電源容量と排気経路、水風呂に必要な給排水量を、施工業者に同伴してもらって確認しましょう。"]},{"type":"h","text":"契約と設備の落とし穴"},{"type":"list","items":["<b>敷金・保証金は賃料の2〜12カ月分くらいが相場</b>とされ、幅が非常に大きい項目です。月30万円の物件なら60万〜360万円。物件が変われば初期投資の試算も大きく動きます。","<b>定期借家契約は、特約がない限り途中解約ができない</b>可能性があります。撤退の自由度は業態戦略の生命線なので、契約形態は賃料の安さより先に確認する価値があります。","見学時には細部も。<b>ビルのメンテナンス日にはその日休業になる</b>ことがありますし、物件によってはアスベスト調査や耐震診断の説明を受けることが定められています（J-Net21）。古い建物の居抜きほど、この2点は重い論点になります。","引き継ぐ設備は「誰の持ち物か」を必ず確認すること。リースは<b>所有権がリース会社に残る</b>仕組みなので、前の借主のリース品が混ざっていれば、それはあなたの物になりません。","前の営業者が持っていた営業許可をそのまま使うことは原則できません。<b>自分名義での許可・届出を取り直す前提</b>で、契約前に管轄の保健所・消防署へ相談を。"]},{"type":"h","text":"中古とリースの使い分け"},{"type":"p","text":"J-Net21の内装工事ガイドは、厨房機器や什器備品は新品で買うとかなり高額で、<b>中古品にすれば大きなコストダウンになる</b>一方、リースは<b>分割払いで支払総額は高くなるが初期費用を抑えられる</b>、そして<b>小規模経営や個人事業主はリースを断られるケースも多々ある</b>と指摘しています。整理すると、序盤の現金を守りたいならリース、支払総額を守りたいなら中古の現金買い。ただしサウナストーブという心臓部だけは話が別です。中古の劣化リスクと交換費用の大きさ（無料章で見た200〜300万円という目安の世界）を考えると、<b>保証のある新品を軸に検討する価値</b>があります。"},{"type":"note","cool":true,"text":"居抜き・中古の損得は、物件と設備の個体差がすべてです。本レッスンは一般的な考え方の整理であり、契約・資産・税務の具体的判断は宅地建物取引士・税理士などの専門家と、管轄の保健所・消防署に必ず確認してください。"}],"sources":[{"label":"J-Net21（中小機構）｜店舗物件の選び方（居抜き・敷金・定期借家）","url":"https://j-net21.smrj.go.jp/startup/manual/list3/3-2-4.html","icon":"🏛️"},{"label":"J-Net21（中小機構）｜店舗内装工事とは（中古品・リースの使い分け）","url":"https://j-net21.smrj.go.jp/startup/manual/list3/3-2-5.html","icon":"🏛️"},{"label":"J-Net21（中小機構）｜リース調達とは","url":"https://j-net21.smrj.go.jp/startup/manual/list3/3-2-6.html","icon":"🏛️"},{"label":"ハコサウナ｜開業費用の実例公表（給排水工事費の幅）","url":"https://hakosauna.com/blog/private-sauna-startup-cost","icon":"📗"}]},{"title":"意思決定フレーム——「平均的な開業」を知ってから、自分の答えを出す","blocks":[{"type":"p","text":"このレッスンでは、業態を決めるための物差しを揃えます。使うのは日本政策金融公庫総合研究所の「2025年度新規開業実態調査」（2025年12月公表、回答2,165社）。公庫の融資を受けて開業した企業の実測データです。サウナに限らない全業種の数字ですが、だからこそ「世の中の開業の平均像」とあなたの計画との距離を測る物差しになります。"},{"type":"h","text":"平均的な開業のすがた（2025年度調査）"},{"type":"list","items":["開業費用は<b>平均975万円・中央値600万円</b>。分布では「250万円未満」が20.1%、「250万〜500万円未満」が21.7%で、<b>500万円未満の少額開業が4割超</b>。長期的にも少額化の傾向です。","資金調達は平均1,219万円。うち<b>金融機関等からの借入が827万円（67.9%）、自己資金は279万円（22.9%）</b>。平均像は「自己資金の約3倍を借りる」開業です。","開業時の平均従業者数は<b>2.8人</b>（経営者本人を含む）。そして<b>1週間の労働時間が50時間以上の開業者が49.8%</b>。","開業時に苦労したことの1位は<b>「資金繰り・資金調達」56.9%</b>、2位「顧客・販路の開拓」49.9%、3位「財務・税務・法務に関する知識の不足」36.4%。","そして見逃せないのが経験です。開業者の<b>81.1%は同じ業種で働いた経験（斯業経験）</b>を持ち、その年数は平均15.3年。事業の決定理由も1位は「これまでの仕事の経験や技能を生かせるから」（43.8%）でした。","それでも現在の採算が<b>黒字基調の企業は67.0%</b>、売上は「増加傾向」が60.1%、開業への満足は7割超（74.8%）です。"]},{"type":"p","text":"この平均像に、無料章とこのゼミの数字を重ねると、各業態の立ち位置が見えてきます。テントサウナ（基本セット50万〜150万円程度〜という目安）は「250万円未満」の少額開業ゾーン。ハコサウナ型（約1,500万円）は平均975万円を上回り、<b>借入とライフライン設計が前提になる規模</b>。個室サウナの相場観（1,000万〜5,000万円・目安）は上に行くほど、施設型（億単位）は完全に、「平均的な開業」の世界の外側にあります。そしてもう一つ。「サウナが好き」と「サウナ業の斯業経験」は別物です。平均的な開業者が15年の経験を持ち込む世界に、経験ゼロで参入するなら——温浴施設で働いてみる、イベントでテントサウナを回してみるなど、<b>小さく経験を買う期間</b>を業態戦略の最初に置くことは、統計に裏付けられた合理的な一手です。"},{"type":"h","text":"業態を決める5つの問い"},{"type":"list","items":["問い①<b>お金</b>：自己資金はいくらか。公庫の平均像（自己資金279万円＋借入827万円）と比べて、あなたの計画の借入依存度は高すぎないか。","問い②<b>撤退</b>：その業態は、外れたときに畳めるか。テント・バレルは撤退や転用が利きやすく、施設型は利きません。レッスン1の「耐久月数」とレッスン4の契約形態がここに効きます。","問い③<b>時間</b>：開業者の約半数が週50時間以上働くという現実に、あなたの生活は耐えられるか。常駐型か、無人型か、家族と回すのか（開業時の平均従業者は2.8人）。","問い④<b>土地</b>：候補地のライフラインはどうか。更地なら給排水で100万〜200万円以上の上振れ（レッスン2）、居抜きならそこが浮く（レッスン4）。","問い⑤<b>成長経路</b>：最初の業態は終着点か、通過点か。テントで実績と常連を作って固定店舗へ——無料章で見たこの段階論は、開業費用の少額化という統計の潮流とも一致しています。"]},{"type":"p","text":"5つの問いに答えが揃ったら、それがあなたの業態です。揃わないなら、揃わない問いが「まだ決めるな」と教えてくれています。数字は夢を殺すためではなく、夢を長生きさせるためにある——業態選びの結論はそれに尽きます。資金の問い①を実務に落とす作業は、資金調達を扱う無料章ch33と収支計画のch34、そして経営ゼミの各ツールで続けましょう。"},{"type":"note","cool":true,"text":"本レッスンの統計は日本政策金融公庫の融資先企業を対象としたアンケート調査（2025年8月時点）であり、開業者全体の悉皆データではありません。本講義は一般的な情報であり、投資・融資・法務・税務の助言ではありません。実際の判断は必ず専門家・金融機関・行政窓口にご確認ください。"}],"sources":[{"label":"日本政策金融公庫総合研究所｜2025年度新規開業実態調査（2025年12月5日）","url":"https://www.jfc.go.jp/n/findings/pdf/kaigyo_251205_1.pdf","icon":"🏦"}]},{"title":"立地と商圏の読み方——家賃を払う前に、人の流れを数える","blocks":[{"type":"p","text":"業態が決まったら、次は場所です。立地は内装と違って、開業後にやり直しがきかない意思決定です。まず押さえたいのは、商圏は業態で変わるということ。中小機構（J-Net21）の出店ガイドは、商圏を「自店に来る顧客のいる範囲」とし、日常品なら近隣5〜10分圏、家具のような高関与商品なら30分程度の範囲と整理しています。サウナに翻訳すると、仕事帰りに週1で通ってもらう個室サウナは前者に、休日に遠征してもらう郊外型は後者に近い。<b>あなたのサウナはどちらの商圏の商売か</b>——ここが立地検討の出発点です。"},{"type":"h","text":"商圏は、無料の政府ツールで数字にできる"},{"type":"list","items":["総務省統計局の<b>jSTAT\u2028MAP（地図で見る統計）</b>は、誰でも無料で使える地理情報システムです。候補地を地点登録し、円や到達圏（徒歩○分圏など）のエリアを作れば、その範囲の人口・世帯などの統計をリッチレポートとして自動集計できます。統計局のリーフレット自身が、出店候補地の商圏分析を利活用例として紹介しています。","サウナは夜と休日の商売になりがちですが、平日夜に来る客は<b>昼間その街にいる人</b>です。J-Net21も、従業地・通学地による人口（昼間人口）や鉄道会社が発表する乗降客数の確認を勧めています。住宅地立地なら夜間人口、オフィス街立地なら昼間人口と乗降客数——狙う時間帯に合わせて、見る統計を変えましょう。","地図の円をそのまま信じないこと。J-Net21は、<b>交通の障害になりそうな川や線路の反対側は商圏として考えない方がよい</b>と指摘しています。半径1km圏でも、橋や踏切で分断された側からは客は来にくいのです。"]},{"type":"h","text":"競合は「数える」だけでなく「観る」"},{"type":"p","text":"J-Net21が挙げる競合調査のチェック項目は、客数・売場面積・商品構成・営業時間・駐車場・広告です。サウナ語に訳すと、ピーク時間帯の混み具合、収容人数、水風呂と外気浴スペースの質、朝ウナ・深夜営業の有無、駐車台数、SNSの発信力。検索サイトで商圏内の競合を数え上げたら、必ず自分が客として通い、この項目で観察してください。そして<b>競合ゼロは朗報とは限りません</b>。誰も出店していない街は、需要そのものがない街かもしれないからです。"},{"type":"h","text":"家賃は相場ではなく「逆算」で判定する"},{"type":"p","text":"その家賃を払えるかどうかは、レッスン1で作った家計簿の延長で判定できます。使う式はJ-Net21の<b>損益分岐点売上高＝固定費÷（1−変動費率）</b>。家賃を含む固定費から赤字にならない売上高を出し、客単価で割って「月に必要な客数」に換算します。その客数が、jSTAT\u2028MAPで数えた商圏人口や現地で数えた人通りに対して現実的か——駅前の高い家賃は、この検算を通ったときだけ「高いが妥当」になります。サウナは1組の滞在が長く、飲食店のような回転数で稼ぎにくい業態です。通行量の多さそのものより、<b>滞在型の客がその商圏に何人いるか</b>を見てください。"},{"type":"h","text":"サウナならではの3つの立地条件"},{"type":"list","items":["<b>駅近か郊外か</b>：徒歩客型なら、駅からの帰宅動線上にあるか、夜道の明るさまで実際に歩いて確かめます。車客型ならJ-Net21の言う通り<b>道路や鉄道に近い場所は商圏が広くなる</b>——幹線道路からの視認性と入りやすさが、そのまま集客装置になります。","<b>駐車場</b>：郊外型では駐車場が実質の入口です。台数が「同時に受け入れられる客数」の上限を決めます。送迎やバス便の有無も、商圏の広さを左右します。","<b>裸で歩ける動線</b>：サウナ→水風呂→外気浴を着衣なしで移動でき、隣の建物や道路から見えないか。外気浴テラスが隣のマンションから丸見えなら、計画自体が成り立ちません。しかも浴場の構造設備基準や配置基準は<b>都道府県等の条例</b>で定められ、自治体により異なります（厚労省・公衆浴場法概要）。間取りを描く前に、候補物件の図面を持って管轄保健所へ相談に行きましょう。"]},{"type":"note","cool":true,"text":"本講義は2026年7月時点で公開されているツール・資料に基づく一般的な情報であり、不動産契約・許認可・投資判断に関する専門的助言ではありません。浴場の基準は自治体の条例により異なるため、物件の契約前に必ず管轄の保健所・自治体窓口と、宅地建物取引士・中小企業診断士などの専門家にご確認ください。"}],"sources":[{"label":"J-Net21（中小機構）｜出店地域の選び方（商圏・昼間人口・競合調査）","url":"https://j-net21.smrj.go.jp/startup/manual/list3/3-2-3.html","icon":"🏛️"},{"label":"総務省統計局｜jSTAT\u2028MAPリーフレット（無料の商圏分析・リッチレポート）","url":"https://www.stat.go.jp/info/guide/public/kouhou/img/gallery_06.pdf","icon":"📊"},{"label":"J-Net21（中小機構）｜損益分岐点を使った目標売上高","url":"https://j-net21.smrj.go.jp/startup/manual/list5/5-2-9.html","icon":"🏛️"},{"label":"厚生労働省｜公衆浴場法概要（構造設備・配置基準は都道府県条例で規定）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/seikatsu-eisei/seikatsu-eisei04/04.html","icon":"🏛️"}]}]},{"moduleId":"shikin","title":"サウナ開業の資金調達・実務編","icon":"💰","subtitle":"資金調達ゼミ｜「貸してください」を「貸したい」に変える","intro":"無料章で、お金には4つの財布があること、そして使う順番があることを学びました。このゼミでは、いよいよ財布のひもを実際に開けにいきます。主役は日本政策金融公庫のA3用紙1枚、「創業計画書」。8つの記入欄の向こう側には、あなたの計画を数字で読む審査担当が座っています。計画書の書き方、自己資金の育て方、面談の準備、制度融資という第二の入口、そしてクラウドファンディングの電卓仕事まで——「貸してください」を「貸したい」に変えるための実務を、一歩ずつ進めましょう。","lessons":[{"title":"創業計画書という台本——8つの欄と審査担当の視線","blocks":[{"type":"p","text":"日本政策金融公庫に創業融資を申し込むと、あなたはA3用紙1枚の書類と向き合うことになります。「創業計画書」——記入欄は8つ、それに自由記述欄。この書類の正体は、公庫自身が様式の冒頭に書いています。"},{"type":"quote","text":"この書類は、ご面談にかかる時間を短縮するために利用させていただきます。——創業計画書・様式注記（日本政策金融公庫\u2028国民生活事業）"},{"type":"p","text":"つまりこれは提出書類である前に、<b>面談の台本</b>です。ここに書いたことがそのまま聞かれ、書かなかったことも聞かれます。だからこそ、1項目ずつ「審査担当は何を見ているのか」から逆算して書く価値があるのです。"},{"type":"h","text":"8つの欄の全体像——前半は「言葉」、後半は「数字」"},{"type":"list","items":["①創業の動機\u2028②経営者の略歴等\u2028③取扱商品・サービス\u2028④取引先・取引関係等——前半4つは<b>言葉で語る欄</b>です。","⑤従業員\u2028⑥お借入の状況\u2028⑦必要な資金と調達方法\u2028⑧事業の見通し（月平均）——後半4つは<b>数字で語る欄</b>。最後に自由記述欄（アピールポイント・悩み・希望するアドバイス）が付きます。","審査担当が見るのは各欄の出来ばえ以上に、<b>言葉と数字が噛み合っているか</b>。「地域に開かれた交流拠点に」と書きながら客単価8,000円の高級路線なら、どちらかが嘘になります。"]},{"type":"h","text":"①創業の動機——熱意の作文ではなく「なぜあなたが、なぜ今、なぜここか」"},{"type":"p","text":"記入欄はわずか数行です。公庫の公式記入例に書かれているのは「自分の経験を生かしたい」「かねてから自分の店をもつことが夢だった」に続く、<b>「○○駅の近くに良い店舗が見つかったため」</b>という一文。夢と同じ欄に、物件という現実が並んでいる——これがお手本の温度感です。サウナなら「サウナが好きだから」ではなく、「3年通った○○エリアに水風呂のある個室サウナが1軒もない。○○駅徒歩5分に給排水条件の合う物件を見つけた」まで書けたとき、動機は事業になります。"},{"type":"h","text":"②経営者の略歴等——8つの欄でいちばん重い場所"},{"type":"p","text":"様式には<b>「勤務先名だけではなく、担当業務や役職、身につけた技能等についても記載してください」</b>と明記されています。公庫総合研究所の2024年度調査では、開業者の<b>83.1%が斯業経験</b>（いまの事業に関連する仕事の経験）をもって開業しています。審査担当が探しているのは、職歴と事業の「地続き感」です。サウナ施設で働いた経験がなくても、接客・施設管理・仕入と数字の管理・チーム運営など、<b>事業に翻訳できる経験</b>を具体的に書いてください。取得資格の欄もあります（防火管理者などはここで効きます）。空欄は「準備不足」と読まれます。"},{"type":"h","text":"③④——「誰に・何を・いくらで」と「お金の流れ」"},{"type":"list","items":["③取扱商品・サービスには、内容とセールスポイントに加えて<b>販売ターゲット・販売戦略、競合・市場など企業を取り巻く状況</b>を書く欄があります。記入例は商品を3つに分け、品数と価格帯まで書いています。サウナなら「貸切90分1室3,800円」「物販（タオル・サウナハット）」のように単価で語ること。","④取引先・取引関係等は、販売先・仕入先と<b>回収・支払の条件</b>（何日締め・何日払い）を書く欄。個室サウナは「一般個人100%・即金」で済みそうですが、薪・アメニティ・リネンの仕入先と支払サイトまで書くと、開業後の資金繰りを理解している人だと伝わります。","様式の注記には<b>「立地選定理由についても触れてください」</b>とあります。③④は商圏分析の発表の場でもあるのです。"]},{"type":"note","cool":true,"text":"様式と記入例は公庫サイト「各種書式ダウンロード」から無料で入手できます。美容業など9業種の記入例があり、設備投資型の業種が参考になります。なお本講義は一般的な情報であり、法的・税務的助言ではありません。実際の申請は公庫支店・商工会議所等の窓口で最新の様式と条件をご確認ください。"}],"sources":[{"label":"日本政策金融公庫｜創業計画書\u2028記入例（小売業）","url":"https://www.jfc.go.jp/n/service/pdf/kaigyourei04_220401f.pdf","icon":"🏦"},{"label":"日本政策金融公庫｜各種書式ダウンロード（国民生活事業）","url":"https://www.jfc.go.jp/n/service/dl_kokumin.html","icon":"🏦"},{"label":"日本政策金融公庫｜創業計画の書き方（公式動画解説）","url":"https://www.jfc.go.jp/n/finance/sougyou/business-plan/","icon":"🏦"},{"label":"公庫総合研究所｜2024年度新規開業実態調査","url":"https://www.jfc.go.jp/n/findings/pdf/kaigyo_241127_1.pdf","icon":"🏦"}]},{"title":"数字の4項目——審査は⑦と⑧で決まる","blocks":[{"type":"p","text":"後半の4つの欄は数字で語ります。なかでも<b>⑦必要な資金と調達方法</b>と<b>⑧事業の見通し</b>は創業計画書の心臓部です。公庫の公式記入例（婦人服・子供服小売業）を「模範解答」として、審査担当の目の動きを追いかけてみましょう。"},{"type":"h","text":"⑦必要な資金と調達方法——左右の合計は1円まで一致する"},{"type":"list","items":["表の左側が<b>必要な資金</b>：設備資金（内装工事費・備品・保証金などを見積先の名前つきで）と運転資金（仕入・諸経費）。様式の注記は<b>「見積書などを添付してください」</b>。サウナなら内装・ストーブと給排気・水風呂とチラー・保証金・予備費まで内訳で割ります。","右側が<b>調達の方法</b>：自己資金、親・兄弟・知人等からの借入、公庫からの借入、他の金融機関からの借入。そして注記に一言——<b>「金額は一致します」</b>。左右がズレた計画書は、その瞬間に計算能力への信用を失います。","記入例の配分は総額850万円に対して自己資金250万円・公庫からの借入600万円。<b>自己資金がおよそ3割</b>という構図は、覚えておく価値があります。"]},{"type":"h","text":"審査担当は「利益」と「返済元金」を見比べる"},{"type":"p","text":"記入例の借入600万円には<b>「元金7万円×86回」</b>という返済方法が書き込まれています。そして⑧事業の見通しの利益欄は、創業当初39万円・軌道に乗った後44万円。様式の注記にはっきり書かれています——<b>「借入金の返済元金はここから支払われることになります」</b>。月の利益が返済元金を上回っている。この1枚の中で完結する整合こそ、最重要チェックポイントです。あなたの計画書でも、⑧の利益から⑦の返済が払えるか、提出前に必ず自分で検算してください。"},{"type":"h","text":"⑧事業の見通し——主役は数字ではなく「根拠」欄"},{"type":"p","text":"売上高の数字より大切なのが、隣の<b>「売上高、売上原価（仕入高）、経費を計算された根拠」</b>欄です。記入例は「7,500円（平均単価）×10人／日×26日＝195万円」。掛け算の形で見せるのがお作法です。サウナなら「90分3,800円×1日6枠×2室×稼働60%×26日≒71万円」のように分解する。稼働率という不確かな変数が入るからこそ、控えめな値でも成立するかを見られます。記入例では1年後の「創業当初の1.2倍」にも「勤務時の経験から」と根拠が添えられています。そして⑥お借入の状況（住宅・車・カードローン）は正直に。<b>書かないことだけが致命傷</b>になります。"},{"type":"h","text":"上級の一手——月別収支計画書"},{"type":"p","text":"公庫は月平均の計画だけでなく、<b>月別収支計画書</b>の様式（記入例つき）も配布しています。サウナは季節で客足が動く商売です。夏の谷と冬の繁忙を織り込んだ月別計画を添付できれば、「月平均でしか考えていない申込者」とは一段違う場所に立てます。"},{"type":"note","warn":true,"text":"数字は大きく見せるより、<b>小さくても噛み合っている</b>方が強い——これが計画書の鉄則です。金額・様式は2026年7月時点のもの。本講義は一般的な情報であり、融資判断や税務の助言ではありません。申請前に必ず公庫窓口で最新情報をご確認ください。"}],"sources":[{"label":"日本政策金融公庫｜創業計画書\u2028記入例（小売業）","url":"https://www.jfc.go.jp/n/service/pdf/kaigyourei04_220401f.pdf","icon":"🏦"},{"label":"日本政策金融公庫｜各種書式ダウンロード（月別収支計画書）","url":"https://www.jfc.go.jp/n/service/dl_kokumin.html","icon":"🏦"}]},{"title":"自己資金の正体——通帳は嘘をつかない","blocks":[{"type":"p","text":"「自己資金はいくら必要ですか」。公庫の公式Q&Aの答えは、少し意外です——<b>自己資金の最低額の定めはありません</b>。重要なのは創業計画全体がしっかりしているかどうか。ただし同じQ&Aはこう続けます。「創業資金総額に占める自己資金の割合は<b>平均で2割程度</b>」。要件ではないけれど、相場はある。この距離感を正確につかみましょう。"},{"type":"h","text":"データで見る自己資金の相場"},{"type":"list","items":["公庫総合研究所「2024年度新規開業実態調査」によると、開業費用は<b>平均985万円・中央値580万円</b>で、長期的に少額化の傾向にあります。","開業時の資金調達総額は平均1,197万円。うち<b>金融機関等からの借入が780万円（65.2%）、自己資金が293万円（24.5%）</b>で、両者で約9割を占めます。","つまり平均的な開業者の姿は「<b>約300万円の自己資金を土台に、その2〜3倍を借りる</b>」。無料章で学んだ「自己資金が土台、融資がテコ」の実際の倍率がこれです。","ちなみに同調査で、開業時に苦労したことの1位は<b>「資金繰り、資金調達」（59.2%）</b>。あなただけが苦しいのではありません。"]},{"type":"h","text":"「見せ金」がなぜ一発で見抜かれるのか"},{"type":"p","text":"公庫は面談時に<b>「資産・負債がわかる書類」</b>の準備を公式に求めています。実務的には通帳やローンの明細です。ここで大事なのは、通帳が語るのは残高ではなく<b>時間</b>だということ。毎月3万円ずつ2年かけて貯まった72万円の通帳は、「この人は毎月決まった額を管理し続けられる」という<b>返済能力そのものの証明</b>になります。逆に、申込直前にぽんと現れた300万円は、必ず出所を聞かれます。知人から一時的に借りて口座に置く、いわゆる<b>見せ金</b>は、返済能力の証明を偽る行為であり、説明できなければ金額の問題ではなく計画全体の信用が崩れます。開業を思い立ったその月から、事業用口座に定額の積み立てを始めてください。1年後、その通帳があなたの一番の応援者になります。"},{"type":"h","text":"親からの応援——「もらう」と「借りる」を区別する"},{"type":"p","text":"創業計画書の調達欄には、自己資金とは別に<b>「親、兄弟、知人、友人等からの借入（内訳・返済方法）」</b>という行がわざわざ用意されています。返すお金なら、この行に返済条件まで書く。返さなくてよいお金（贈与）なら自己資金側に整理し得ますが、税の世界では贈与税の対象になり、暦年課税の基礎控除は<b>年110万円</b>（2026年7月時点）。これを超える贈与は申告が必要になり得ます。一番危ないのは「とりあえず口座に振り込んでもらう」こと。お金の性質を先に決め、必要なら書面にし、通帳に載せる前に確認する——この順番を守ってください。"},{"type":"note","warn":true,"text":"本講義は一般的な情報であり、税務・法務の助言ではありません。贈与や親族間借入の扱いは個別性が高いため、実際の判断は必ず税理士・税務署・公庫窓口でご確認ください。"}],"sources":[{"label":"日本政策金融公庫｜創業支援Q&A（自己資金・審査期間）","url":"https://www.jfc.go.jp/n/finance/sougyou/faq/","icon":"🏦"},{"label":"公庫総合研究所｜2024年度新規開業実態調査","url":"https://www.jfc.go.jp/n/findings/pdf/kaigyo_241127_1.pdf","icon":"🏦"},{"label":"国税庁｜贈与税がかかる場合（タックスアンサー\u2028No.4402）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/zoyo/4402.htm","icon":"🏛️"},{"label":"日本政策金融公庫｜創業計画書\u2028記入例（調達方法の欄）","url":"https://www.jfc.go.jp/n/service/pdf/kaigyourei04_220401f.pdf","icon":"🏦"}]},{"title":"面談準備——3週間の審査で何が見られるか","blocks":[{"type":"p","text":"公庫の公式Q&Aによれば、申込から融資までは<b>平均3週間程度</b>。流れは「相談→申込（インターネットで24時間365日受付）→面談→融資」の4段階です。そしてもうひとつ、公式Q&Aに明記された大事な事実——創業初期段階の方は<b>原則として無担保・無保証人</b>で各種融資制度を利用できます。個人保証で家族を巻き込まずに挑戦できる設計が公式に用意されている。これは知っているだけで景色が変わります。"},{"type":"h","text":"面談で実際に起きること（公式情報から）"},{"type":"list","items":["面談では<b>資金の使いみちと事業計画</b>について聞かれます（公庫公式）。","<b>店舗や事業所の予定地を訪問</b>されます（公庫公式）。契約前でも、物件の場所・図面・工事見積を自分の言葉で説明できる状態にしておきましょう。","準備するもの：創業計画書、本人確認書類（運転免許証・マイナンバーカード等）、設備資金の申込は<b>見積書</b>、法人は登記簿謄本、許認可が必要な業種は<b>許認可証</b>。サウナなら公衆浴場業の許可の段取り状況（保健所との事前相談まで進んでいるか）を説明できることが効きます。","そして<b>資産・負債がわかる書類</b>——通帳、住宅・車のローン明細。前のレッスンの「通帳の時間」がここで審査されます。"]},{"type":"h","text":"想定問答のつくり方——質問は8つの欄から来る"},{"type":"list","items":["「なぜこの場所なんですか」→①動機と④立地選定理由から。商圏と競合を自分の足で調べた言葉で答える。","「サウナ施設の運営経験はないですよね」→②略歴から。翻訳できる経験＋足りない部分の補い方（研修・経験者の採用・顧問）をセットで。","「この客単価と稼働率の根拠は」→⑧の根拠欄から。悲観・普通・楽観の3パターンを口頭で言えると強い。","「光熱費が上がったらどうしますか」→経費の欄から。値付け・営業時間の設計・断熱への投資を一言で。","「この自己資金はどうやって貯めましたか」→通帳から。ここまでのレッスンを実践したあなたには、もう怖くない質問です。"]},{"type":"p","text":"コツは答えの暗記ではありません。<b>計画書の数字を、ぜんぶ自分の言葉で再構成できる</b>ようにしておくことです。専門家に書類づくりを手伝ってもらうのは構いません。ただ、面談の椅子に座るのはあなた一人。自分で説明できない数字は、書いていない数字より印象が悪いのです。"},{"type":"h","text":"器の大きさも知っておく"},{"type":"p","text":"申し込む制度「新規開業・スタートアップ支援資金」は、限度額7,200万円（うち運転資金4,800万円）、返済期間は設備20年以内・運転10年以内、<b>据置期間は各5年以内</b>。据置期間——元金返済が始まるまでの猶予——は、開業直後の一番苦しい時期を守る設計変数です。女性・若年層・シニア層など要件別の特別利率区分（A〜C）もあるので、面談前に公式ページで自分が該当する区分を確認しておきましょう。"},{"type":"note","cool":true,"text":"制度内容・利率は2026年7月時点のもので、改定されることがあります。本講義は一般的な情報であり、融資の可否や条件を保証するものではありません。必ず公庫公式サイトと支店窓口で最新情報をご確認ください。"}],"sources":[{"label":"日本政策金融公庫｜お手続きの流れ（創業予定の方）","url":"https://www.jfc.go.jp/n/finance/flow/tetsudukij_c.html","icon":"🏦"},{"label":"日本政策金融公庫｜創業支援Q&A","url":"https://www.jfc.go.jp/n/finance/sougyou/faq/","icon":"🏦"},{"label":"日本政策金融公庫｜新規開業・スタートアップ支援資金","url":"https://www.jfc.go.jp/n/finance/search/01_sinkikaigyou_m.html","icon":"🏦"}]},{"title":"制度融資と信用保証協会——第二の入口","blocks":[{"type":"p","text":"公庫が唯一の入口ではありません。もうひとつの公的ルートが、都道府県や市区町村の<b>制度融資</b>——自治体・民間金融機関・信用保証協会の三者がスクラムを組む融資です。無料章で名前だけ触れた「信用保証協会付き融資」の中身を、ここで開けてみましょう。"},{"type":"h","text":"三者の役割分担"},{"type":"list","items":["<b>金融機関</b>が実際にお金を貸します。融資の審査も金融機関（と保証協会）が行います。","<b>信用保証協会</b>が公的な保証人になります。あなたの返済が滞ったときは、協会が金融機関へ<b>代位弁済</b>します。","<b>自治体</b>は制度の枠組みをつくり、多くの場合<b>利子補給（金利の一部補助）や保証料の補助</b>を行います。内容は自治体により異なります。","大事な注意をひとつ。代位弁済されても<b>あなたの借金は消えません</b>。債権者が金融機関から保証協会に代わり、以後は協会へ返済していきます。保証とは「チャラ」の仕組みではなく、実績のない創業者にも金融機関がお金を貸せるように、貸し手のリスクを公的に肩代わりする仕組みです。"]},{"type":"h","text":"創業者のための保証制度"},{"type":"list","items":["<b>創業関連保証</b>：これから創業する個人（1か月以内に事業開始する具体的計画がある方）、2か月以内に設立予定の法人、創業後5年未満の事業者などが対象です。","保証限度額は、再挑戦支援保証などとの併用合計で<b>3,500万円</b>。申込には<b>創業計画書</b>が必要です（保証協会にひな形があります）。市区町村の認定を受けた創業支援を受けている場合、申請できる期間が6か月に延長される特例もあります。","<b>スタートアップ創出促進保証</b>：経営者が連帯保証人にならなくてよい制度。その代わり保証料が0.2%上乗せされます。「無保証」はタダではなく、値段がついている——この感覚は経営者として持っておきたいところです。"]},{"type":"h","text":"公庫とどちらを選ぶか——実務の手順"},{"type":"p","text":"一般論の比較表より、動き方を覚えてください。<b>①あなたの市区町村名＋「創業\u2028制度融資」で検索する、②商工会議所か自治体の商工担当窓口で利子補給・保証料補助の有無を聞く、③公庫の条件と並べて総コストで比べる</b>。自治体の補助が厚ければ、制度融資の方が有利になることがあります。一方でJ-Net21が指摘するとおり、制度融資は自治体・金融機関・保証協会と関係者が多く、<b>入金までの時間は長くかかります</b>。物件契約の期日が迫っているなら、この時間差そのものが判断材料です。そしてもうひとつ——制度融資を通じて地元の信用金庫・地銀と取引が始まること自体が、2店舗目や設備更新のときに効いてくる無形の資産になります。"},{"type":"note","warn":true,"text":"制度融資の条件（金利・補助・据置期間・対象要件）は<b>自治体により大きく異なります</b>。本講義は2026年7月時点の一般的な仕組みの説明であり、法的・財務的助言ではありません。必ずお住まいの自治体窓口・信用保証協会・金融機関でご確認ください。"}],"sources":[{"label":"J-Net21（中小機構）｜制度融資の活用","url":"https://j-net21.smrj.go.jp/startup/manual/list4/4-3-2.html","icon":"🏛️"},{"label":"全国信用保証協会連合会｜創業をお考えの方","url":"https://www.zenshinhoren.or.jp/model-case/sogyo/","icon":"🏦"},{"label":"全国信用保証協会連合会｜信用保証制度の仕組み","url":"https://www.zenshinhoren.or.jp/guarantee-system/","icon":"🏦"}]},{"title":"クラウドファンディング設計——手取りから逆算する","blocks":[{"type":"p","text":"無料章で、クラファンの本当の価値が「開業前のテストマーケティング」であることを学びました。実務編のこのレッスンでは、ロマンをいったん脇に置いて電卓を叩きます。設計を誤ると、<b>「達成したのにお金が足りない」</b>が現実に起きるからです。"},{"type":"h","text":"まず手取り率を計算する"},{"type":"list","items":["CAMPFIREの手数料は<b>利用手数料12%＋決済手数料5%、それぞれ別途消費税</b>。掲載自体は無料で、手数料はプロジェクト成立時のみ発生します。","支援総額100万円なら、手数料17万円＋消費税で<b>約18.7万円が差し引かれ、手取りは約81.3万円</b>。","ここからさらに<b>リターンの原価・送料・製作の手間</b>が出ていきます。リターン原価率が25%なら、手元に残るのは支援総額の6割弱です。"]},{"type":"h","text":"目標金額は「必要額÷手元に残る率」で解く"},{"type":"p","text":"サウナ室の造作費の一部80万円をクラファンで賄いたいとします。目標金額は80万円ではありません。<b>80万円÷（1−0.187−リターン原価率0.25）≒142万円</b>。目標金額とは願望ではなく、方程式の解です。リターン設計もこの式から逆算します。入浴券・回数券は原価が軽い（開業後の空き枠を使える）代わりに、<b>オープン後の売上を先食いする</b>性質をもちます。オリジナルグッズは原価と発送実務が重い。だから金額の大きい支援には、貸切券や設備の命名権のような「原価より希少性」で価値をつくるリターンを当てる——方程式と相性のよい組み立てはこの形です。"},{"type":"h","text":"スケジュール——「終了日」から資金繰りを引き算する"},{"type":"list","items":["募集期間は<b>1〜79日（All-or-Nothing方式は1〜59日）</b>で設定できます。","CAMPFIRE公式アカデミーによれば、目標達成したプロジェクトは<b>30〜45日間での実施が多い</b>。長くやれば集まるわけではありません。支援が伸びるのは<b>開始直後と終了直前</b>です。","入金はプロジェクト終了と同時ではなく、振込申請をした月の<b>翌月末</b>（公式アカデミー）。つまり終了から1〜2か月後です。<b>工事代金や物件費用の支払期日に間に合うか</b>、必ず資金繰り表に落としてください。早期振込サービスもありますが、追加の手数料がかかります。"]},{"type":"h","text":"融資と組み合わせて完成する"},{"type":"p","text":"クラファンの達成実績は、創業計画書③の販売ターゲット欄に書ける<b>生きた実証データ</b>になります。「開業前に○○人が支援し、SNSのフォロワーが○○人いる」——面談で審査担当に見せられる、これ以上ない説明資料です。4つの財布は、順番を設計すると互いを強くします。コツコツ育てた通帳が公庫を説得し、クラファンの支援者数が計画書を裏づけ、開業後の返済実績が制度融資での二の矢につながる。資金調達とは1回のイベントではなく、<b>信用が積み上がっていく設計</b>のことなのです。"},{"type":"note","warn":true,"text":"手数料率・振込時期などの仕様は2026年7月時点のCAMPFIRE公表情報で、プラットフォームや時期により異なります。実施前に必ず公式ヘルプで最新を確認してください。リターンは支援者への履行義務を伴います。本講義は一般的な情報であり、法的・税務的助言ではありません。実際の判断は専門家・各窓口にご確認ください。"}],"sources":[{"label":"CAMPFIRE公式｜掲載時の手数料","url":"https://help.camp-fire.jp/hc/ja/campfire%E6%8E%B2%E8%BC%89%E6%99%82%E3%81%AE%E6%89%8B%E6%95%B0%E6%96%99","icon":"💴"},{"label":"CAMPFIREアカデミー｜最適な募集期間と終了日の決め方","url":"https://camp-fire.jp/academy/articles/article-8","icon":"📗"}]},{"title":"開業後のお金の守り——運転資金と追加調達","blocks":[{"type":"p","text":"融資が振り込まれ、店の鍵を受け取った日、資金調達は終わったように見えます。でも数字は静かに語ります。公庫総合研究所の2024年度新規開業実態調査では、開業前に予想していた月商を達成できた開業者は59.6%——<b>約4割は予想を下回り</b>、現在の採算が<b>赤字基調の人も32.7%</b>。開業後の「現在苦労していること」でも37.0%が資金繰り・資金調達を挙げています。第3講で見た開業時の苦労は、開業後も形を変えて続くのです。この講では、入ってきたお金を守る実務——運転資金の読み方と追加調達を学びます。"},{"type":"h","text":"黒字なのに現金が減る——元金返済は経費ではない"},{"type":"quote","text":"利益を上げたとしても、それ以上に在庫が増えてしまったり、借入金の元金返済が負担となっている場合は、当然に現金が流出します。——J-Net21（中小機構）起業マニュアル「資金繰りとは」"},{"type":"p","text":"ここが開業後最初の落とし穴です。損益計算書に借入金の元金返済は登場しません。利息は経費ですが、<b>元金は税引後の利益から返すお金</b>。だから帳簿は黒字でも通帳は減る、が普通に起きます。第2講で「⑧の利益から返済元金が払えるか検算せよ」と学んだ構造が、開業後は毎月の現実になる。しかもサウナは水道光熱費が大きく、季節で客足も振れる商売です。第4講で見た据置期間が明けて元金返済が始まる月に、夏の閑散期が重なる——資金が細る典型パターンは、たいていこの「重なり」で起きます。"},{"type":"h","text":"資金繰り表——通帳の未来を予報する6つの行"},{"type":"list","items":["資金繰り表は、一定期間のすべての現金収入と現金支出を分類・集計した表。資金不足を事前に予測し、<b>黒字倒産を防ぐ</b>ためのツールです（中小機構）。","構造は6区分。<b>前月繰越金→収入合計→支出合計→差引過不足→財務収支（借入・返済）→次月繰越金</b>。次月繰越金が初めてマイナスになる月が、あなたの店の「資金ショート予報日」です。","Excelで自作できます。サウナ用に作るなら、水道光熱費の季節変動、住民税・消費税など納税の月、元金返済、リネンや薪の支払サイトを月ごとの行に落とし込むこと。","毎月、予定と実績の差を埋めて更新します。中小機構が指摘するとおり、資金繰り表は<b>金融機関との借入交渉にも使える</b>——次の追加融資の説明資料が、日々の運用から自動的に育っていきます。"]},{"type":"h","text":"追加融資——「残高が尽きる前」に支店へ"},{"type":"p","text":"公庫の公式Q&Aは明快です。返済が完了しないと新たな借入は申し込めないのか——答えは<b>「ご返済の途中でも、お申込いただけます」</b>。追加融資は裏技ではなく正規の入口です。しかも開業後のあなたには、開業前になかった武器がある。<b>毎月遅れず返した実績と、実績の数字</b>です。資金繰り表で3か月先に谷が見えたら、現金があるうちに試算表と資金繰り表を持って支店に相談へ。手元資金が残っている段階の相談と、尽きてからの相談では、選べる手の数がまるで違います。"},{"type":"h","text":"業況が悪化したら——セーフティネット貸付と借換え"},{"type":"list","items":["売上が前期（前々期）比5%以上減少しているなど、外的要因による一時的な業況悪化には、公庫の<b>経営環境変化対応資金（セーフティネット貸付）</b>。限度額7,200万円、運転資金は10年以内・<b>据置期間3年以内</b>です（2026年7月時点）。","借入が複数になり月々の返済が重いなら、信用保証協会の<b>借換保証</b>。複数の保証付借入金を1本にまとめて長期で返済し、毎月の返済額を軽くする制度で、<b>新たな資金の上乗せ</b>も可能です。第5講の保証協会は、開業後もあなたの隣にいます。","共通する設計思想はひとつ。これらは「返せなくなった人」の制度ではなく、<b>返せるうちに返済計画を作り直す</b>ための制度だということ。動くタイミングが早いほど、条件は良くなります。"]},{"type":"note","warn":true,"text":"制度の要件・限度額・据置期間は2026年7月時点のもので、改定されることがあります。借換えには保証料等のコストが伴い、条件は金融機関・信用保証協会・自治体により異なります。本講義は一般的な情報であり、財務・税務・法務の助言ではありません。実際の判断は必ず公庫支店・信用保証協会・税理士等の専門家にご確認ください。"}],"sources":[{"label":"公庫総合研究所｜2024年度新規開業実態調査（予想月商達成率・採算状況）","url":"https://www.jfc.go.jp/n/findings/pdf/kaigyo_241127_1.pdf","icon":"🏦"},{"label":"J-Net21（中小機構）｜起業マニュアル「資金繰りとは」","url":"https://j-net21.smrj.go.jp/startup/manual/list4/4-1-4.html","icon":"🏛️"},{"label":"J-Net21（中小機構）｜ビジネスQ&A「資金繰り表の作成」","url":"https://j-net21.smrj.go.jp/solution/qa/financeqa/Q0225.html","icon":"🏛️"},{"label":"日本政策金融公庫｜経営環境変化対応資金（セーフティネット貸付）","url":"https://www.jfc.go.jp/n/finance/search/07_keieisien_m.html","icon":"🏦"},{"label":"日本政策金融公庫｜よくあるご質問（事業資金・国民生活事業）","url":"https://www.jfc.go.jp/n/faq/jigyoqj_m.html","icon":"🏦"},{"label":"全国信用保証協会連合会｜資金繰りの改善をお考えの方（借換保証）","url":"https://www.zenshinhoren.or.jp/model-case/shikinguri/","icon":"🏦"}]}]},{"moduleId":"shuushi","title":"収支設計ゼミ","icon":"🧮","subtitle":"収支設計ゼミ｜利益と現金、両方を設計する","intro":"無料章ch34で手に入れた「損益分岐点」は、収支設計の入口にすぎません。このゼミでは損益計算書の読み方から、固定費と変動費の分解実務、回数券・月額プラン・値上げの数理と法律、減価償却とキャッシュフローのズレ、そして撤退ラインの引き方まで——「好き」を続けるための数字の技術を、行政の一次資料に基づいて実務レベルまで掘り下げます。レッスン6では、アプリの収支シミュレーターを使って悲観・普通・楽観の3シナリオを実際に作ります。","lessons":[{"title":"損益計算書（P/L）——サウナ業の数字を5階建てで読む","blocks":[{"type":"p","text":"ch34であなたは「月に何人来れば潰れないか」という1つの数字を手に入れました。ゼミの最初のレッスンでは、その数字が住んでいる建物——<b>損益計算書（P/L）</b>を読めるようになります。P/Lは、売上が上の階から下の階へ降りるたびに費用に削られていく、5階建ての建物です。"},{"type":"h","text":"5階建ての構造をサウナ業に当てはめる"},{"type":"list","items":["<b>売上高</b>：入浴料、回数券・月額プランの消化分、物販、レンタル。サウナ業は「入浴」と「物販」で原価率がまったく違うので、最初から科目を分けて記帳するのが実務の基本です。","<b>売上原価</b>：ドリンクやサウナハットの仕入れ、レンタル品のクリーニング外注など、売れた分だけ発生する費用。","<b>売上総利益（粗利）</b>：売上高−売上原価。ch34の「1人あたり粗利」はこの階の住人です。","<b>販売費・一般管理費（販管費）</b>：家賃・人件費・水道光熱費・広告費・減価償却費。サウナ業の主戦場はこの階。温浴業のP/Lは、売上原価よりも販管費が分厚いのが特徴です。","<b>営業利益</b>：本業の稼ぐ力。あなたが毎月必ず見るべき数字はここです。"]},{"type":"p","text":"中小機構のJ-Net21が公開するスーパー銭湯の開業ガイドでも、収支は「売上→支出→利益」の順で示され、初年度売上高約4億3,200万円に対し年間支出約1億7,760万円という規模例が載っています。ただしそこには「ある程度リピーターが確保できた場合に見込める売上であるため、オープン当初から達成できるとは限らない」という注意書きが添えられています。P/Lの5階建てのうち、いちばん崩れやすいのは最上階の売上です。"},{"type":"p","text":"なお営業利益の下には、借入金の支払利息などを差し引いた<b>経常利益</b>の階があります。ここで覚えておいてほしいのは、P/Lに載るのは利息だけで、<b>元本の返済はP/Lのどこにも出てこない</b>ということ。この不思議がのちのち効いてきます（レッスン4で回収します）。"},{"type":"p","text":"帝国データバンクの調査（2025年度見通し）では、銭湯業の売上高は1,200億円前後とコロナ禍以降で最高水準となる見通しの一方、業界全体の利益は前年度の49億円から27億円へほぼ半減、2024年度は4社に1社が赤字経営でした。「売上は伸びているのに利益が消える」——これはP/Lの下の階、つまり光熱費や人件費などの販管費が膨らんでいるサインです。売上高だけを見ていては、この病気に気づけません。"},{"type":"h","text":"P/Lを読む3つの目線"},{"type":"list","items":["<b>前月比</b>：季節要因か、構造の変化か。サウナは冬繁忙・夏閑散の波が大きい業態です。","<b>前年同月比</b>：季節の波を除いた「本当の傾き」。開業2年目からの主役です。","<b>率で見る</b>：金額でなく売上高営業利益率・光熱費率で見ると、規模が変わっても比較できます。"]},{"type":"note","cool":true,"text":"月に1回、<b>営業利益と売上高営業利益率</b>だけでも定点観測してください。会計ソフトを使う場合も、光熱費と物販原価の科目設計を開業時に正しく作っておくと、あとの分析が一気に楽になります。"}],"sources":[{"label":"J-Net21（中小機構）｜スーパー銭湯開業ガイド（収支モデル）","url":"https://j-net21.smrj.go.jp/startup/guide/service/h006.html","icon":"🏛️"},{"label":"帝国データバンク｜銭湯業界の動向調査（市場規模・利益・赤字比率）","url":"https://prtimes.jp/main/html/rd/p/000001313.000043465.html","icon":"📊"}]},{"title":"固定費・変動費の分解実務——間違えやすい5項目","blocks":[{"type":"p","text":"損益分岐点の式（固定費÷1人あたり粗利）は、固定費と変動費の分解を間違えると簡単に狂います。そしてサウナ業は、この分解がいちばん難しい業種のひとつです。教科書どおり「家賃は固定・材料は変動」と覚えただけでは、現場で必ずつまずきます。"},{"type":"h","text":"間違えやすい5項目"},{"type":"list","items":["<b>光熱費は「準固定費」</b>：サウナ室を営業温度に保つ基礎分は、客がゼロでも出ていく固定費。客が増えるたびに増えるシャワー・洗濯・ロウリュ分が変動費です。全額を変動費に入れると、損益分岐点を実際より甘く見積もってしまいます。","<b>人件費は契約形態で分かれる</b>：あなた自身の生活費と正社員給与は固定費、繁忙時間帯だけのアルバイトは準変動費。ワンオペや無人運営は、突き詰めれば「固定費を小さくする」戦略です。","<b>決済手数料は純粋な変動費</b>：キャッシュレス比率が上がるほど、売上の数%が粗利から確実に削られます。客単価×手数料率を1人あたり変動費に忘れずに入れてください。","<b>修繕費は「月割の固定費」として積む</b>：ストーブやチラーの故障は数年に一度、数十万円単位でドンと来ます。月1〜2万円の修繕積立をあらかじめ固定費に入れておくのが実務です。","<b>減価償却費も固定費</b>：現金は出ていかないのに利益を減らす、少し不思議な固定費。この正体はレッスン4で扱います。"]},{"type":"p","text":"もうひとつ、実務で効くのが<b>「階段状の固定費」</b>という考え方です。スタッフを1人増やす、2室目を作る——こうした決断のたびに、固定費は坂道ではなく階段のように一段上がります。そして一段上がった固定費は、簡単には下がりません。「この一段を上がると損益分岐点が何人増えるか」を、増員・増室の前に必ず計算してください。"},{"type":"p","text":"この分解が生死を分けるのは、燃料単価が動いたときです。帝国データバンクの試算では、燃料費が3割上昇した場合の営業利益の減少率は全産業平均で約5%にとどまる一方、銭湯業では平均30%に達します。熱を売る商売は、固定費の中に「温度を保つためのエネルギー」が大きく張り付いているため、燃料単価の変動が利益を直撃するのです。"},{"type":"h","text":"予約制は「固定費を変動費化する」発明"},{"type":"p","text":"個室・予約制サウナの本質的な強みは、予約がない時間は加熱しないという選択によって、光熱費の固定部分を変動費側へ寄せられることです。ドロップイン型にするか予約制にするかは、営業スタイルの好みの問題ではなく、<b>費用構造の設計問題</b>として決めてください。"},{"type":"note","warn":true,"text":"事業計画書で「光熱費＝全額変動費」として金融機関に提出すると、根拠を問われて計画全体の信頼を落とすことがあります。基礎分（固定）と従量分（変動）を分けて説明できるようにしておきましょう。"}],"sources":[{"label":"帝国データバンク｜燃料費3割上昇時の営業利益への影響試算","url":"https://prtimes.jp/main/html/rd/p/000001313.000043465.html","icon":"📊"},{"label":"J-Net21（中小機構）｜スーパー銭湯開業ガイド（エネルギーコスト対応）","url":"https://j-net21.smrj.go.jp/startup/guide/service/h006.html","icon":"🏛️"}]},{"title":"値付けの各論——回数券・サブスク・値上げの数理と法律","blocks":[{"type":"p","text":"ch34では「価格は自分の損益分岐点と提供価値から逆算する」と学びました。ゼミではその先へ——回数券・月額プラン・値上げという3つの値付け実務を、数理と法律の両面から設計します。"},{"type":"h","text":"回数券——割引率の数理と資金決済法"},{"type":"list","items":["<b>割引は粗利に増幅されて効く</b>：客単価4,000円・1人あたり変動費1,000円なら粗利は3,000円。10回券を1割引で売ると、400円の割引は売上の10%ですが、粗利では約13%減。割引率は「売上比」ではなく<b>「粗利比」</b>で判断するのが鉄則です。","<b>先払いは資金繰りの味方、ただし前受金</b>：回数券はお金が先に入りますが、未消化分はまだ売上ではない「預かりもの」です。入金を使い込むと、消化が進む月に現金が足りなくなります。","<b>資金決済法の壁</b>：有効期限が発行日から6ヶ月を超える回数券・プリペイドは法律上の「前払式支払手段」に該当し、基準日（毎年3月末・9月末）の未使用残高が1,000万円を超えると、残高の2分の1以上の発行保証金の供託などの義務が生じます。小規模店の定石は、<b>有効期限を発行から6ヶ月以内に設計して適用除外に収める</b>ことです（2026年7月時点）。"]},{"type":"h","text":"月額プラン（サブスク）——「使われすぎ」を設計に織り込む"},{"type":"list","items":["<b>実質単価＝月額料金÷想定利用回数</b>：月額9,000円・想定月3回なら実質単価3,000円。都度料金4,000円との差1,000円が「会員の得」であり、あなたが差し出す値引き原資です。","<b>損益分岐利用回数を先に計算する</b>：1回あたり変動費1,000円なら、月額9,000円の会員は月9回の利用で粗利がゼロになります。<b>ヘビーユーザー上位1割が月に何回使うか</b>を想定してから月額を決める。利用回数の上限や時間帯限定は、ケチではなく数理的な安全弁です。","<b>解約率が月額の価値を決める</b>：月次解約率が5%なら会員の平均継続期間は約20ヶ月（1÷0.05）、10%なら約10ヶ月です。会員1人の生涯価値＝月額粗利×平均継続月数。値引きしてでも会員化する価値があるかは、この掛け算で判断します。","<b>オンライン販売なら特定商取引法</b>：Webで月額プランを申し込ませる場合、通信販売の規制により、最終確認画面に分量・販売価格・支払時期と方法・解約に関する事項などを表示する義務があります。2回以上の継続契約が必要な場合は、その旨と条件の広告表示も必要です（2026年7月時点）。"]},{"type":"h","text":"値上げの作法——表示のルールと信頼の作法"},{"type":"list","items":["<b>二重価格表示に注意</b>：「通常価格5,000円→4,000円」のような表示は、比較対照の価格が「最近相当期間にわたって販売されていた価格」でなければ、景品表示法の不当表示（有利誤認）に当たるおそれがあります（消費者庁ガイドライン）。実際に売っていない旧価格からの「値下げ演出」は違法リスクです。","<b>価格表示は税込の総額表示が義務</b>：消費者に対してあらかじめ表示する価格は、消費税を含めた総額表示が義務です。値上げの告知も税込価格で行いましょう。","<b>値上げそのものは自由、作法が信頼を決める</b>：予告期間を置く、購入済みの回数券・既存会員の条件を尊重する、何が良くなるのかを一言添える。価格は経営者の意思表示であると同時に、常連との約束でもあります。"]},{"type":"note","warn":true,"text":"本レッスンは一般的な情報であり、法的助言ではありません。回数券が前払式支払手段に該当するかの判断や価格表示の適法性は、財務局・消費者庁の公式資料と専門家に必ずご確認ください。"}],"sources":[{"label":"関東財務局｜前払式支払手段（商品券・プリペイドカード等）関係","url":"https://lfb.mof.go.jp/kantou/kinyuu/pagekthp00400036.html","icon":"🏛️"},{"label":"日本資金決済業協会｜前払式支払手段発行業の概要（6ヶ月適用除外・供託）","url":"https://www.s-kessai.jp/businesses/prepaid/prepaid_means_overview/","icon":"🏦"},{"label":"消費者庁｜二重価格表示（景品表示法）","url":"https://www.caa.go.jp/policies/policy/representation/fair_labeling/representation_regulation/double_price","icon":"🏛️"},{"label":"国税庁｜タックスアンサー\u2028No.6902「総額表示」の義務付け","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shohi/6902.htm","icon":"🏛️"},{"label":"消費者庁｜特定商取引法ガイド（通信販売）","url":"https://www.no-trouble.caa.go.jp/what/mailorder/","icon":"🏛️"}]},{"title":"利益と現金は別物——減価償却とキャッシュフローの正体","blocks":[{"type":"p","text":"「今月のP/Lは黒字なのに、通帳の残高は減っている」。開業1年目の経営者の多くが直面する謎です。犯人は2人います。<b>減価償却費</b>と、<b>借入金の元本返済</b>です。"},{"type":"h","text":"減価償却——大きな買い物を「分割で経費にする」仕組み"},{"type":"p","text":"国税庁の定義では、減価償却とは資産の取得に要した金額を「一定の方法によって各年分の必要経費として配分していく手続」です。ストーブや内装に300万円を払っても、その年に300万円の経費になるわけではなく、法定耐用年数に応じて数年に分けて経費化します。お金は初年度にまとめて出ていき、経費は数年に分かれて計上される——ここで利益と現金がズレ始めます。"},{"type":"h","text":"サウナ業に関係する法定耐用年数（国税庁・耐用年数表より）"},{"type":"list","items":["<b>建物（木造・公衆浴場用のもの）：12年</b>。店舗用の22年より大幅に短いのは、湿気と熱で傷みやすい浴場建物の実態を反映したものです。","<b>建物（鉄骨鉄筋コンクリート造・鉄筋コンクリート造、公衆浴場用）：31年</b>。","<b>建物附属設備（電気設備・給排水・衛生設備・ガス設備）：15年</b>。","<b>機械・装置（洗濯業・理容業・美容業・浴場業用設備）：13年</b>。"]},{"type":"note","cool":true,"text":"あなたの施設がどの区分に当たるか（個室サウナの建物は「公衆浴場用」か「店舗用」か等）は、施設の形態によって判断が分かれます。開業時に税理士または税務署に確認してください。"},{"type":"h","text":"少額資産の3段ルール（2026年7月時点）"},{"type":"list","items":["<b>取得価額10万円未満</b>（または使用可能期間1年未満）：全額をその年の必要経費にできます。","<b>10万円以上20万円未満</b>：「一括償却資産」として3年間で均等に経費化できます。","<b>40万円未満（青色申告者の特例）</b>：年合計300万円を限度に即時に経費化できる特例があります。令和8年度税制改正で上限が30万円未満から40万円未満に引き上げられ、適用期限も令和11年（2029年）3月31日まで延長されました。ただし40万円未満が使えるのは<b>令和8年（2026年）4月1日以後に取得した資産</b>からで、それより前に取得した分は旧上限の30万円未満のままです。従業員数（400人以下等）の要件もあり、国税庁タックスアンサー等には改正前の記述が残っている場合があるため、適用可否は中小企業庁・財務省の最新資料で確認してください。"]},{"type":"h","text":"黒字倒産——利益が出ていても現金が尽きる"},{"type":"p","text":"J-Net21（中小機構）は黒字倒産を「帳簿上は利益が出ているにもかかわらず、支払いに必要な資金が不足し、倒産してしまうこと」と定義しています。減価償却費は「現金が出ないのに利益を減らす」費用、借入の元本返済は「現金が出るのに経費にならない」支出。P/Lはこの2つを写しません。だから利益とは別に、現金の帳簿——<b>資金繰り表</b>が必要なのです。"},{"type":"p","text":"目安として覚えてほしい式があります。<b>手元に残る現金＝税引後利益＋減価償却費−借入元本の返済</b>。減価償却費は現金が出ない費用なので足し戻し、元本返済は経費にならない支出なので差し引く。この式がマイナスなら、P/Lが黒字でも通帳の残高は毎月減っていきます。融資の返済計画を立てるときは、利益ではなくこの式で返せるかを見てください。"},{"type":"p","text":"中小機構の経営ハンドブックが勧める作り方は、月次試算表と預金通帳から過去の資金繰り表を作り、それを土台に3〜6ヶ月先の資金状況を予見できる表に育てることです。P/Lが「成績表」なら、資金繰り表は「燃料計」。月末にはかならず両方を見てください。"},{"type":"note","warn":true,"text":"本レッスンは一般的な情報であり、税務助言ではありません。減価償却の方法・耐用年数の適用・特例の可否は、必ず税理士または税務署にご確認ください。"}],"sources":[{"label":"国税庁｜タックスアンサー\u2028No.2100\u2028減価償却のあらまし","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2100.htm","icon":"🏛️"},{"label":"国税庁｜主な減価償却資産の耐用年数表（PDF）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/pdf/2100_01.pdf","icon":"🏛️"},{"label":"財務省｜令和8年度税制改正の大綱（少額減価償却資産特例の拡充・延長）","url":"https://www.mof.go.jp/tax_policy/tax_reform/outline/fy2026/08taikou_03.htm","icon":"🏛️"},{"label":"中小企業庁｜少額減価償却資産の特例（40万円未満・令和11年3月31日まで）","url":"https://www.chusho.meti.go.jp/zaimu/zeisei/tokurei/syougaku_shisan.html","icon":"🏛️"},{"label":"J-Net21（中小機構）｜黒字倒産とは（経営Q&A）","url":"https://j-net21.smrj.go.jp/solution/qa/financeqa/Q1045.html","icon":"🏛️"},{"label":"J-Net21（中小機構）｜資金繰り表を活用する（経営ハンドブック）","url":"https://j-net21.smrj.go.jp/solution/handbook/finance/table.html","icon":"🏛️"}]},{"title":"撤退ラインの設計——「いつ止めるか」は開業前に決める","blocks":[{"type":"p","text":"ch34の赤字回避チェックリスト、最後の項目は「撤退ラインを決めたか」でした。ゼミではその線を実際に引きます。撤退ラインとは根性の限界のことではありません。<b>数字で書かれた事前の合意</b>——追い詰められた未来のあなたを、冷静な今のあなたが守る仕組みです。"},{"type":"h","text":"3本の線を引く"},{"type":"list","items":["<b>現金残高ライン</b>：「現金が月次固定費の3ヶ月分を下回ったら、撤退の検討を開始する」。固定費55万円の店なら165万円です。これは撤退を実行する残高ではなく<b>検討を始める残高</b>。撤退自体にも原状回復費・リース解約金・在庫処分などの現金が必要だからです。","<b>連続赤字ライン</b>：「営業赤字が6ヶ月連続し、翌月に改善する根拠を数字で説明できなければ止める」。1〜2ヶ月の赤字は季節変動でも起きます。大事なのは「連続」と「改善根拠の有無」をセットで見ることです。","<b>傾きライン</b>：客数・会員数の前年同月比が3ヶ月連続で悪化したら、価格・営業時間・業態の見直しに着手する。赤字になる前に鳴る、いちばん早い警報です。"]},{"type":"h","text":"ラインに近づいたときの段階的アクション"},{"type":"list","items":["<b>第1段階（傾きラインに触れたら）</b>：価格・営業時間・メニューの実験。固定費の再交渉（家賃・保険・リース）もこの段階で始めます。","<b>第2段階（連続赤字ラインに触れたら）</b>：営業時間の集約で光熱費の基礎分を圧縮し、資金繰り表を週次に。金融機関・商工会など外部への相談もここで。","<b>第3段階（現金残高ラインに触れたら）</b>：撤退の実務検討。居抜き売却や事業譲渡も含めれば、撤退の出口はひとつではありません。現金が残っているうちほど、選べる出口は多くなります。"]},{"type":"p","text":"撤退は敗北ではなく、この業界では日常的な経営判断です。帝国データバンクの調査では2025年度だけで銭湯7件が廃業し、約6割の企業が業績悪化。ch34で見たとおり、銭湯はピーク時から約9割減りました。長く続けている人に共通するのは、致命傷になる前に立ち止まり、直し、ときに撤退する判断力です。"},{"type":"h","text":"「撤退しても退職金が出る」仕組みを開業時に仕込む"},{"type":"p","text":"中小機構の<b>小規模企業共済</b>は、個人事業主や小規模企業の経営者のための積み立てによる退職金制度です。掛金は月1,000円〜70,000円の間で500円単位で自由に設定でき、<b>全額が課税対象所得から控除</b>されます。そして退職・廃業時に共済金を受け取れます（2026年7月時点）。開業初月から加入しておけば、節税しながら「撤退したときの退職金」を自分に用意できる——撤退ラインの設計とセットで検討する価値のある制度です。"},{"type":"note","cool":true,"text":"撤退ラインは紙に書いて、配偶者や共同経営者と共有してください。口約束の撤退ラインは、赤字が続くころには必ず動かされます。<b>書いた線だけが、あなたを守ります</b>。そして判定の計器盤は、レッスン4で作った資金繰り表です。"},{"type":"note","warn":true,"text":"本レッスンは一般的な情報であり、法的・税務的助言ではありません。共済の加入資格・共済金額は中小機構の公式情報で、廃業の手続きは専門家・行政窓口に必ずご確認ください。"}],"sources":[{"label":"中小機構｜小規模企業共済\u2028制度の概要（掛金全額所得控除・廃業時共済金）","url":"https://www.smrj.go.jp/kyosai/skyosai/features/index.html","icon":"🏛️"},{"label":"帝国データバンク｜銭湯業界の動向調査（廃業・業績悪化）","url":"https://prtimes.jp/main/html/rd/p/000001313.000043465.html","icon":"📊"},{"label":"J-Net21（中小機構）｜資金繰り表を活用する（経営ハンドブック）","url":"https://j-net21.smrj.go.jp/solution/handbook/finance/table.html","icon":"🏛️"}]},{"title":"実演・3シナリオ設計——収支シミュレーターで未来に幅を持たせる","blocks":[{"type":"p","text":"このレッスンでは、実際に手を動かします。このアプリの経営ゼミにある<b>収支シミュレーター</b>は、ch34の式（損益分岐客数＝固定費÷1人あたり粗利）をそのまま計算する道具です。ここでは架空の個室サウナ（2室・予約制）を例に、悲観・普通・楽観の3シナリオを実際に作ってみます。"},{"type":"h","text":"普通シナリオ——現実的な中心値を置く"},{"type":"list","items":["入力：家賃25万円・人件費15万円・燃料光熱費10万円・その他固定費5万円（固定費計55万円）、客単価4,000円、1人あたり変動費1,000円。","結果：損益分岐点は<b>月184人（1日あたり約7人）</b>。想定来客数を月220人と置くと、月次収支は<b>約11万円の黒字</b>と表示されます。","チェックポイント：「普通」は願望ではなく、説明できる中心値に。月220人＝1日約7組は、2室で1室あたり3〜4枠の稼働です。自分の商圏・営業時間でその稼働が現実的か、必ず検証してください。"]},{"type":"h","text":"悲観シナリオ——客3割減×燃料3割高を同時に食らう"},{"type":"list","items":["入力を変える：想定来客数を154人（3割減）にし、「燃料光熱費が3割上昇したら」のチェックを入れます（帝国データバンクの試算に基づくストレステスト。固定費は58万円になります）。","結果：分岐点は<b>月194人</b>に上がり、月次収支は<b>約12万円の赤字</b>。","ここからが本番の計算です。月12万円の赤字×6ヶ月＝<b>約71万円</b>。これがch34の鉄則「悲観シナリオでも半年耐える」を数字にした、運転資金の最低ラインです。実際には撤退費用も見込んで、この1.5〜2倍を確保できると安心です。"]},{"type":"h","text":"楽観シナリオ——黒字の使い道まで決める"},{"type":"list","items":["入力：想定来客数を264人（2割増）に。結果は<b>月約24万円の黒字</b>。","楽観シナリオの目的は夢を見ることではなく、<b>余剰現金の使い道を先に決めておく</b>ことです。借入の繰上返済か、修繕積立の増額か、値付けの実験か。決めていない好調期の現金は、雑に消えていきます。"]},{"type":"p","text":"3つのシナリオを作ったら、それぞれの「分岐点との距離」を眺めてください。現実はたいてい、悲観と普通の間のどこかに着地します。数字の幅をあらかじめ見ておいた人は、初月の客数が想定を下回っても慌てません。それはもう、シナリオの中で一度経験した出来事だからです。"},{"type":"p","text":"そしてこの3シナリオは、融資の場面でも武器になります。中小機構の経営ハンドブックも、資金繰り表があると金融機関への融資申込時の交渉をスムーズに進められるとしています。「楽観だけの計画書」より「悲観でも返済できる根拠を示した計画書」のほうが、貸す側の信頼を得られるのは当然のことです。"},{"type":"note","cool":true,"text":"シミュレーターの入力値は、このゼミの全レッスンとつながっています。固定費の中身はレッスン2の分解で、燃料＋3割はレッスン2の試算で、赤字×6ヶ月の運転資金と現金残高ラインはレッスン5の撤退設計で。ばらばらに見えた数字は、ここで一枚の絵になります。"}],"sources":[{"label":"帝国データバンク｜燃料費3割上昇の影響試算（ストレステストの根拠）","url":"https://prtimes.jp/main/html/rd/p/000001313.000043465.html","icon":"📊"},{"label":"J-Net21（中小機構）｜資金繰り表を活用する（運転資金の予見）","url":"https://j-net21.smrj.go.jp/solution/handbook/finance/table.html","icon":"🏛️"}]},{"title":"個人事業の税金の基礎——開業届・青色申告・インボイスまで","blocks":[{"type":"p","text":"ここまでのレッスンで、利益と現金の設計図は手に入りました。最終関門は、開業と同時に始まる<b>税金の実務</b>です。難しく聞こえますが、個人事業の初年度にやることは「2枚の書類を出す・帳簿をつける・領収書を残す」——この3つに集約されます。"},{"type":"h","text":"開業時に出す2枚の書類——締切がまったく違う"},{"type":"list","items":["<b>個人事業の開業・廃業等届出書（開業届）</b>：納税地の税務署に出します。手数料は不要です。令和8年（2026年）1月1日以後の開業から期限が緩和され、開業した年分の<b>確定申告期限まで</b>に提出すればよいことになりました（それ以前の開業は1か月以内でした）。","<b>青色申告承認申請書</b>：こちらは待ってくれません。原則はその年の3月15日まで、その年1月16日以後の新規開業なら<b>開業日から2か月以内</b>。逃すとその年は白色申告となり、次の特典を1年分失います。開業届と同時に出すのが定石です。"]},{"type":"h","text":"青色申告の見返り——控除・赤字の繰越・家族への給与"},{"type":"list","items":["<b>青色申告特別控除</b>：複式簿記で記帳し、貸借対照表と損益計算書（レッスン1のP/Lです）を添えて期限内申告すれば最高55万円。さらにe-Taxでの申告か、仕訳帳・総勘定元帳の電子帳簿保存（一定の要件あり）で<b>最高65万円</b>。簡易な簿記なら10万円です。","<b>純損失の繰越控除</b>：赤字を翌年以後3年間繰り越して黒字と相殺できます。初期投資が重く初年度が赤字になりやすいサウナ業では、特に価値の大きい特典です。","<b>青色事業専従者給与</b>：事業に専従する家族への給与を、事前届出の範囲内で必要経費にできます。レッスン4で見た少額減価償却資産の特例も青色申告者限定です。"]},{"type":"h","text":"家事按分——自宅兼サウナの経費の分け方"},{"type":"p","text":"自宅の一部を事務所や個室サウナにする場合、家賃・水道光熱費・通信費は生活と事業が混ざった<b>家事関連費</b>になります。国税庁の考え方は明快で、必要経費にできるのは「業務の遂行上直接必要であったことが明らかに区分できる」部分の金額だけ。床面積や使用時間など第三者に説明できる基準で按分し、計算根拠を必ず書き残してください。「なんとなく半分」は、税務調査でいちばん崩れやすい経費です。"},{"type":"h","text":"消費税とインボイス——サウナ業ではこう考える"},{"type":"list","items":["<b>開業1〜2年目は原則免税</b>：消費税は前々年（基準期間）の課税売上高が1,000万円以下なら納税義務が免除されます。開業1・2年目は前々年の事業売上自体がないため原則免税です（前年上半期の売上等による「特定期間」の判定など例外があります）。","<b>インボイスは買手のための書類</b>：適格請求書（インボイス）は買手が仕入税額控除を受けるために必要なもので、発行するには登録が必要。登録すると、免税だったはずの事業者も課税事業者として申告義務を負います。","<b>客の大半が一般消費者なら急ぐ必要は薄い</b>：一般のお客さんは仕入税額控除をしないため、インボイスを求めてきません。一方、法人の貸切利用や福利厚生契約など「経費で落とす客」を狙う業態なら、登録した場合の納税額を開業前に試算しておきましょう。"]},{"type":"h","text":"帳簿と領収書——「白色なら記帳不要」は過去の話"},{"type":"p","text":"青色申告者は帳簿を7年、請求書・見積書・納品書などの書類を5年保存します。白色申告でも事業所得のある人には記帳義務と保存義務があり、収入と経費を記した法定帳簿は7年、領収書などは5年の保存が必要です。「もらう・その日のうちに記録する・月ごとに保管する」を開業初日からの習慣に。レッスン1のP/Lもレッスン4の資金繰り表も、この日々の記帳の上に立っています。"},{"type":"note","warn":true,"text":"本レッスンは2026年7月時点の一般的な情報であり、税務助言ではありません。提出期限や控除の適用可否、インボイス登録の損得は事業の実態で変わります。必ず国税庁の最新情報を確認し、税理士または税務署にご相談ください。"}],"sources":[{"label":"国税庁｜タックスアンサー\u2028No.2090\u2028新たに事業を始めたときの届出など（開業届・青色申告承認申請の期限）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2090.htm","icon":"🏛️"},{"label":"国税庁｜タックスアンサー\u2028No.2072\u2028青色申告特別控除（55万・65万・10万円の要件）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2072.htm","icon":"🏛️"},{"label":"国税庁｜タックスアンサー\u2028No.2070\u2028青色申告制度（帳簿の保存期間・純損失の繰越・専従者給与）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2070.htm","icon":"🏛️"},{"label":"国税庁｜タックスアンサー\u2028No.2210\u2028やさしい必要経費の知識（家事関連費）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2210.htm","icon":"🏛️"},{"label":"国税庁｜タックスアンサー\u2028No.6501\u2028納税義務の免除（基準期間1,000万円・特定期間）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shohi/6501.htm","icon":"🏛️"},{"label":"国税庁｜インボイス制度の概要（登録と課税事業者・仕入税額控除）","url":"https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/invoice_about.htm","icon":"🏛️"},{"label":"国税庁｜タックスアンサー\u2028No.2080\u2028白色申告者の記帳・記録保存制度（法定帳簿7年・書類5年）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2080.htm","icon":"🏛️"}]}]},{"moduleId":"kyoka","title":"許認可の実務——窓口と書類を動かす技術","icon":"⚖️","subtitle":"許認可実務ゼミ｜図面一枚が、開業日を決める","intro":"無料章で、あなたは許認可の地図——公衆浴場法・建築基準法・消防法の全体像——を手に入れました。このゼミで扱うのは、その地図を持って実際に歩く技術です。保健所へのアポの取り方と持ち物、条例の原文を自分で読む方法、消防への届出の名前と期限、検査済証のない物件の見極め方、そして物件契約から開業日までの工程表。行政の一次資料と東京の公表例に基づいて、「窓口で困らない人」になるための実務を解説します。そして第6講では、開業後も毎年くり返す法令の定期義務を、1枚の年間カレンダーに束ねます。","lessons":[{"title":"保健所事前相談の実務——アポ・持ち物・質問リスト","blocks":[{"type":"p","text":"許認可の成否は、申請書を出す日ではなく、その何か月も前の「事前相談」で決まります。保健所の事前相談は、言ってみれば無料で受けられる行政の個別コンサルティング。ここを丁寧にやった人は手戻りなく進み、飛ばした人は完成後の検査で不適合を告げられます。このレッスンでは、相談を「行くだけ」で終わらせないための段取りを解説します。"},{"type":"h","text":"いつ行くか——「契約前・着工前」の二段構え"},{"type":"p","text":"東京都多摩小平保健所は「建築確認申請前（既存建物の場合は、工事施工前）に保健所へ御相談ください」と明記しています。つまり行政の側が「工事の前に来てほしい」と言っているのです。実務ではさらに一歩早く、<b>物件を契約する前</b>に一度目の相談に行くことをお勧めします。図面がたたき台の段階なら、致命的な問題が見つかっても撤退できるからです。港区のように、設計段階で構造設備基準への適合性を相談できると案内している自治体もあります。"},{"type":"h","text":"アポの取り方と持ち物"},{"type":"list","items":["電話で管轄保健所の<b>生活衛生・環境衛生の担当係</b>につないでもらい、「公衆浴場（その他の公衆浴場）の営業許可の事前相談をしたい」と用件をはっきり伝える。港区のように<b>予約のうえでの相談を推奨</b>する自治体もある。","持ち物の核は<b>施設平面図</b>。港区も事前相談には施設平面図が必要としている。決定版でなくてよいが、寸法・男女の区分・浴槽やサウナ室の位置・給排水が読み取れるものを。","物件の所在地と建物概要がわかる資料（募集図面など）、業態をまとめた1枚メモ（想定定員・営業時間・水風呂の水源・消毒方式）も添えると、回答の精度が一気に上がる。"]},{"type":"h","text":"窓口で聞くべき質問リスト"},{"type":"list","items":["この図面のままで<b>条例の構造設備基準</b>を満たせるか。満たせないなら、どこが致命的か（動かせない壁・排水・男女区分など）。","根拠となる<b>条例・施行規則の名称と該当条文</b>はどれか。後で自分で読み返すために必ず控える。","浴槽の方式（循環式か否か）や消毒方法によって、指導内容や検査の頻度はどう変わるか。","<b>中間検査の要否</b>と、申請から許可までの標準的な日数・手数料。港区の例では申請手数料22,000円、完成検査後に書類不備等がなければ2週間程度で営業許可書を発行（2026年7月時点。自治体により異なる）。"]},{"type":"h","text":"相談は一回で終わらせない"},{"type":"p","text":"事前相談は複数回行くのが前提です。一回目は物件の致命傷チェック（契約前）、二回目は設計に指摘を反映した後の確認、三回目は申請直前の最終確認。回を重ねるごとに図面を更新して臨みます。多摩小平保健所が「施設完成後の検査から営業許可まで12日程度かかることがある」と案内しているように、後半の日程は行政のペースで進みます。前半の相談を密にして手戻りを潰しておくことが、結局いちば
