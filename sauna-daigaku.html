<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サウナ大学 | サウナのすべてが、ここで深く学べる — GOMIRACHELIN</title>
<meta name="description" content="下段（初級）から中段・上段・ストーブ前（マスター）まで4段階。資格・検定、熱の物理学、水風呂、ととのうの科学、世界のサウナ文化、サ飯、聖地巡礼、経営学まで。サウナのあらゆる知識を深く学べる無料学習教材。忖度なしのサウナメディアGOMIRACHELIN監修。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Oswald:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0f0d0a; --bg-2:#16120c; --surface:#1c1710; --surface-2:#241d13;
  --line:#38301e; --line-soft:#2a2316;
  --gold:#d4a017; --gold-bright:#edc65a; --gold-deep:#9c7410;
  --cream:#ece4d2; --cream-dim:#b8ae97; --muted:#877d66;
  --hot:#e8973f; --cold:#5fb6d9; --calm:#5cbf74; --wrong:#d9776b;
  --serif:"Shippori Mincho",serif;
  --label:"Oswald",sans-serif;
  --body:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
  --maxw:1080px;
  --r:14px; --r-lg:22px;
  --sh:0 18px 50px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--cream); font-family:var(--body);
  line-height:1.85; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; letter-spacing:.01em;
}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%}
::selection{background:var(--gold);color:#0f0d0a}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
/* ---------- background texture ---------- */
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60% 45% at 80% 0%, rgba(212,160,23,.10), transparent 60%),
   radial-gradient(55% 40% at 5% 15%, rgba(95,182,217,.055), transparent 60%),
   radial-gradient(50% 50% at 50% 100%, rgba(92,191,116,.05), transparent 60%);
}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);
  background:rgba(15,13,10,.82);border-bottom:1px solid var(--line-soft)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--gold-bright),var(--gold-deep));
  color:#12100a;font-family:var(--label);font-weight:700;font-size:19px;
  box-shadow:0 0 22px -4px rgba(212,160,23,.6)}
.brand b{font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:.06em}
.brand span{font-family:var(--label);font-size:9.5px;letter-spacing:.32em;color:var(--gold);
  text-transform:uppercase;display:block;margin-top:-3px}
.nav-links{display:flex;gap:4px}
.nav-links button{font-family:var(--body);font-weight:500;font-size:14px;color:var(--cream-dim);
  background:none;border:none;padding:9px 15px;border-radius:9px;cursor:pointer;transition:.2s;position:relative}
.nav-links button:hover{color:var(--cream)}
.nav-links button.on{color:var(--gold-bright)}
.nav-links button.on::after{content:"";position:absolute;left:15px;right:15px;bottom:2px;height:2px;
  background:linear-gradient(90deg,var(--hot),var(--gold),var(--cold));border-radius:2px}
.hdr-xp{display:flex;align-items:center;gap:9px;font-family:var(--label);font-size:13px;color:var(--gold)}
.hdr-xp .lv{background:var(--surface-2);border:1px solid var(--line);border-radius:20px;
  padding:4px 11px;letter-spacing:.05em}
/* ---------- mobile bottom tabs ---------- */
.tabbar{display:none}
/* ---------- generic ---------- */
main{position:relative;z-index:1}
.view{display:none;animation:fade .45s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--label);font-size:12px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold);display:inline-flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--gold)}
.sec-title{font-family:var(--serif);font-weight:800;font-size:clamp(26px,4.4vw,40px);line-height:1.25;margin:14px 0}
.lead{color:var(--cream-dim);font-size:16px;max-width:640px}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--body);font-weight:700;font-size:15px;
  padding:13px 26px;border-radius:40px;cursor:pointer;border:1px solid transparent;transition:.25s;line-height:1}
.btn.gold{background:linear-gradient(140deg,var(--gold-bright),var(--gold));color:#14110a;
  box-shadow:0 12px 30px -10px rgba(212,160,23,.6)}
.btn.gold:hover{transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(212,160,23,.75)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--cream)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-bright)}
.btn .ar{font-family:var(--label);font-weight:400}
/* ---------- hero ---------- */
.hero{position:relative;padding:clamp(52px,9vw,104px) 0 clamp(44px,7vw,78px);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(15,13,10,.90) 0%,rgba(15,13,10,.94) 60%,var(--bg) 100%),
  url('https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-01.jpg') center 38%/cover no-repeat}
.hero-inner{max-width:820px;position:relative;z-index:1}
.hero h1{font-family:var(--serif);font-weight:800;line-height:1.16;
  font-size:clamp(34px,7vw,68px);letter-spacing:.01em}
.hero h1 .hl{background:linear-gradient(100deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.hero p.sub{margin:26px 0 12px;font-size:clamp(15px,2.4vw,19px);color:var(--cream);max-width:620px;line-height:1.9}
.hero p.by{color:var(--muted);font-size:13.5px;max-width:600px;margin-bottom:32px}
.hero .cta-row{display:flex;gap:14px;flex-wrap:wrap}
/* temperature journey signature */
.journey{margin:46px 0 0;border:1px solid var(--line);border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--surface),var(--bg-2));padding:22px 24px 20px;box-shadow:var(--sh)}
.journey .jtitle{font-family:var(--label);font-size:11px;letter-spacing:.28em;color:var(--cream-dim);
  text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.jbar{height:14px;border-radius:10px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,var(--hot) 0%,var(--gold) 22%,#8bd0c0 48%,var(--cold) 66%,var(--calm) 100%)}
.jbar::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:translateX(-100%);animation:shimmer 4.5s ease-in-out infinite}
@keyframes shimmer{0%,55%{transform:translateX(-100%)}100%{transform:translateX(120%)}}
.jsteps{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.jstep{flex:1;text-align:center}
.jstep .n{font-family:var(--label);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.jstep .t{font-family:var(--serif);font-weight:700;font-size:15px;margin-top:2px}
.jstep small{display:block;color:var(--cream-dim);font-size:11.5px;margin-top:1px}
.jstep.s1 .t{color:var(--hot)} .jstep.s2 .t{color:var(--cold)} .jstep.s3 .t{color:var(--calm)}
/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:38px}
.stat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px 16px;text-align:center}
.stat b{font-family:var(--label);font-weight:600;font-size:30px;color:var(--gold-bright);display:block;line-height:1}
.stat span{font-size:12px;color:var(--cream-dim);letter-spacing:.05em}
/* ---------- section spacing ---------- */
.section{padding:clamp(40px,6vw,70px) 0}
.section.tight{padding:clamp(26px,4vw,44px) 0}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px;flex-wrap:wrap}
/* ---------- progress card (home) ---------- */
.dash{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:14px}
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh)}
.dash .pcard{padding:26px 28px}
.pcard .lvrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pcard .lvname{font-family:var(--serif);font-weight:800;font-size:24px}
.pcard .lvtag{font-family:var(--label);font-size:12px;letter-spacing:.16em;color:var(--gold);
  border:1px solid var(--line);border-radius:20px;padding:4px 12px}
.pcard .xpsub{color:var(--cream-dim);font-size:13px;margin-bottom:16px}
.xpbar{height:12px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line-soft);overflow:hidden}
.xpbar>i{display:block;height:100%;border-radius:8px;
  background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .8s cubic-bezier(.2,.9,.2,1)}
.streak-card{padding:24px 26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.flame{font-size:44px;line-height:1;filter:drop-shadow(0 0 14px rgba(232,151,63,.55))}
.streak-card .num{font-family:var(--label);font-weight:700;font-size:40px;color:var(--hot);line-height:1;margin-top:4px}
.streak-card .lbl{color:var(--cream-dim);font-size:13px;margin-top:2px}
.streak-card .goal{margin-top:14px;font-size:12px;color:var(--muted);width:100%}
.goaldots{display:flex;gap:5px;justify-content:center;margin-top:7px}
.goaldots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.goaldots i.done{background:var(--calm);box-shadow:0 0 8px rgba(92,191,116,.6)}
/* badges strip */
.badges{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.badge{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 15px;
  display:flex;align-items:center;gap:11px;min-width:158px;opacity:.42;transition:.3s}
.badge.got{opacity:1;border-color:var(--gold-deep);background:linear-gradient(160deg,var(--surface-2),var(--surface))}
.badge .ic{font-size:22px}
.badge .bt{font-weight:700;font-size:13px}
.badge .bd{font-size:11px;color:var(--cream-dim)}
/* ---------- chapter grid ---------- */
.chgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.chcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:24px 22px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.chcard .ccover{margin:-24px -22px 16px -22px;height:128px;position:relative;overflow:hidden;background:var(--bg-2)}
.chcard .ccover img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.82) brightness(.62)}
.chcard .ccover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(15,13,10,.05) 30%,var(--surface) 97%)}
.chcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,var(--gold))}
.chcard:hover{transform:translateY(-5px);border-color:var(--acc,var(--gold));box-shadow:var(--sh)}
.chcard .cnum{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--acc,var(--gold))}
.chcard .cic{font-size:30px;margin:6px 0 10px}
.chcard h3{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.4}
.chcard p{font-size:13px;color:var(--cream-dim);margin-top:7px;min-height:38px}
.chcard .cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;
  font-size:12px;color:var(--muted)}
.chprog{height:6px;border-radius:6px;background:var(--bg-2);overflow:hidden;flex:1;margin-right:12px}
.chprog>i{display:block;height:100%;background:var(--acc,var(--gold));transition:width .7s}
/* ---------- lesson list ---------- */
.backlink{font-family:var(--label);letter-spacing:.14em;font-size:13px;color:var(--cream-dim);
  cursor:pointer;display:inline-flex;gap:8px;align-items:center;margin-bottom:22px;text-transform:uppercase}
.backlink:hover{color:var(--gold-bright)}
.lesson-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.lrow{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.25s}
.lrow:hover{border-color:var(--gold);transform:translateX(4px)}
.lrow .lnum{width:38px;height:38px;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--label);font-weight:600;color:var(--cream-dim);flex-shrink:0}
.lrow.done .lnum{background:linear-gradient(150deg,var(--calm),#3f8f52);color:#0f0d0a;border-color:transparent}
.lrow .li-t{flex:1}
.lrow .li-t b{font-family:var(--serif);font-weight:700;font-size:16.5px}
.lrow .li-t small{display:block;color:var(--muted);font-size:12px;font-family:var(--label);letter-spacing:.08em}
.lrow .chev{color:var(--muted);font-family:var(--label)}
.lrow.locked{opacity:.45;cursor:not-allowed;pointer-events:none}
#lessonDone[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.chcard.locked{opacity:.45;pointer-events:none;position:relative}
.chcard.locked::after{content:"🔒";position:absolute;top:14px;right:16px;font-size:20px}
/* ---------- lesson reader ---------- */
.reader{max-width:760px;margin:0 auto}
.reader .r-eyebrow{font-family:var(--label);font-size:12px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.reader h2{font-family:var(--serif);font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.3;margin:10px 0 6px}
.progress-line{height:3px;background:var(--line-soft);border-radius:3px;margin:20px 0 30px;overflow:hidden}
.progress-line>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright))}
.block{margin:22px 0}
.block p{font-size:16px;line-height:1.95;color:var(--cream)}
.block h3{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--gold-bright);
  margin:30px 0 6px;display:flex;align-items:center;gap:10px}
.block h3::before{content:"";width:16px;height:2px;background:var(--gold);border-radius:2px}
.block ul{list-style:none;margin:12px 0}
.block ul li{position:relative;padding-left:24px;margin:9px 0;font-size:15.5px;color:var(--cream)}
.block ul li::before{content:"";position:absolute;left:4px;top:12px;width:7px;height:7px;border-radius:2px;
  background:var(--gold);transform:rotate(45deg)}
.note{border-left:3px solid var(--gold);background:var(--surface);border-radius:0 var(--r) var(--r) 0;
  padding:16px 20px;font-size:14.5px;color:var(--cream-dim)}
.note b{color:var(--gold-bright)}
.note.warn{border-color:var(--hot)} .note.warn b{color:var(--hot)}
.note.cool{border-color:var(--cold)} .note.cool b{color:var(--cold)}
.statbig{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0;padding:20px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface-2)}
.statbig .s{flex:1;min-width:120px}
.statbig .s b{font-family:var(--label);font-weight:700;font-size:30px;color:var(--gold-bright);display:block;line-height:1.1}
.statbig .s span{font-size:12.5px;color:var(--cream-dim)}
.quote{font-family:var(--serif);font-size:19px;font-style:italic;color:var(--cream);
  border-left:3px solid var(--cold);padding:6px 0 6px 22px;margin:22px 0;line-height:1.7}
.quote small{display:block;font-style:normal;font-family:var(--body);font-size:12.5px;color:var(--muted);margin-top:8px}
/* inline lesson quiz */
.lquiz{border:1px solid var(--gold-deep);border-radius:var(--r-lg);
  background:linear-gradient(170deg,var(--surface-2),var(--surface));padding:26px 26px 24px;margin:34px 0}
.lquiz .qtag{font-family:var(--label);letter-spacing:.2em;font-size:11px;color:var(--gold);text-transform:uppercase}
.lquiz .q{font-family:var(--serif);font-weight:700;font-size:18px;margin:8px 0 18px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1px solid var(--line);border-radius:12px;background:var(--bg-2);padding:14px 16px;cursor:pointer;
  transition:.2s;font-size:15px;display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--gold)}
.opt .k{width:26px;height:26px;border-radius:7px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--label);font-size:13px;color:var(--cream-dim);flex-shrink:0}
.opt.correct{border-color:var(--calm);background:rgba(92,191,116,.12)}
.opt.correct .k{background:var(--calm);color:#0f0d0a;border-color:transparent}
.opt.wrong{border-color:var(--wrong);background:rgba(217,119,107,.12)}
.opt.wrong .k{background:var(--wrong);color:#0f0d0a;border-color:transparent}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.explain{margin-top:16px;border-radius:12px;padding:15px 17px;font-size:14px;line-height:1.8;display:none}
.explain.show{display:block;animation:fade .3s}
.explain.ok{background:rgba(92,191,116,.1);border:1px solid rgba(92,191,116,.3)}
.explain.ng{background:rgba(217,119,107,.1);border:1px solid rgba(217,119,107,.3)}
.explain b{color:var(--gold-bright)}
/* sources */
.sources{margin:30px 0 8px}
.sources .st{font-family:var(--label);letter-spacing:.2em;font-size:11px;color:var(--muted);
  text-transform:uppercase;margin-bottom:12px}
.srccard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);padding:12px 15px;margin-bottom:9px;transition:.2s}
.srccard:hover{border-color:var(--gold);transform:translateX(3px)}
.srccard .si{width:32px;height:32px;border-radius:9px;background:var(--bg-2);display:grid;place-items:center;
  font-size:15px;flex-shrink:0}
.srccard .sx b{font-size:13.5px;display:block}
.srccard .sx span{font-size:11.5px;color:var(--muted)}
.srccard .go{margin-left:auto;font-family:var(--label);font-size:11px;letter-spacing:.1em;color:var(--gold)}
.lesson-nav{display:flex;justify-content:space-between;gap:14px;margin:36px 0 10px;align-items:center}
/* ---------- quiz hub ---------- */
.qhub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.qmode{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:26px;cursor:pointer;transition:.3s}
.qmode:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--sh)}
.qmode .qic{font-size:30px}
.qmode h3{font-family:var(--serif);font-weight:700;font-size:21px;margin:8px 0 6px}
.qmode p{font-size:13.5px;color:var(--cream-dim)}
.qmode .meta{margin-top:14px;font-family:var(--label);font-size:12px;letter-spacing:.1em;color:var(--gold)}
.weak-wrap{margin-top:20px}
.weakbar{display:flex;align-items:center;gap:14px;margin:11px 0}
.weakbar .wl{width:190px;font-size:13.5px;flex-shrink:0}
.weakbar .wt{flex:1;height:10px;border-radius:6px;background:var(--bg-2);overflow:hidden}
.weakbar .wt>i{display:block;height:100%;border-radius:6px;transition:width .8s}
.weakbar .wp{font-family:var(--label);font-size:13px;color:var(--cream-dim);width:52px;text-align:right}
/* quiz session */
.qsession{max-width:680px;margin:0 auto}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qtop .qcount{font-family:var(--label);letter-spacing:.14em;color:var(--cream-dim);font-size:13px}
.qtop .qscore{font-family:var(--label);color:var(--gold);font-size:14px}
.qprog{height:6px;border-radius:6px;background:var(--bg-2);overflow:hidden;margin-bottom:26px}
.qprog>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .5s}
.qcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:30px 28px}
.qcard .qcat{font-family:var(--label);letter-spacing:.16em;font-size:11px;color:var(--gold);text-transform:uppercase}

.result p{color:var(--cream-dim);margin-bottom:24px}
.result .rrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* ---------- AI ---------- */
.ai-wrap{max-width:820px;margin:0 auto}
.chat{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  display:flex;flex-direction:column;height:min(66vh,620px);overflow:hidden;box-shadow:var(--sh)}
.chat-head{padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
.chat-head .av{width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,var(--gold-bright),var(--gold-deep));
  display:grid;place-items:center;font-size:20px;box-shadow:0 0 18px -3px rgba(212,160,23,.6)}
.chat-head b{font-family:var(--serif);font-weight:700;font-size:16px}
.chat-head small{display:block;color:var(--muted);font-size:11.5px}
.chat-head .mode{margin-left:auto;font-family:var(--label);font-size:10.5px;letter-spacing:.12em;
  border:1px solid var(--line);border-radius:20px;padding:4px 11px;color:var(--cream-dim)}
.chat-head .mode.live{color:var(--calm);border-color:var(--calm)}
.chat-body{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:11px;max-width:88%}
.msg .b{padding:13px 16px;border-radius:16px;font-size:14.5px;line-height:1.8}
.msg.ai{align-self:flex-start}
.msg.ai .b{background:var(--surface-2);border:1px solid var(--line-soft);border-top-left-radius:5px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .b{background:linear-gradient(150deg,var(--gold),var(--gold-deep));color:#14110a;border-top-right-radius:5px}
.msg .mav{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-size:15px;
  background:var(--bg-2);border:1px solid var(--line)}
.msg.me .mav{background:var(--gold-deep);border-color:transparent}
.msg .b .src{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px}
.msg .b .src a{color:var(--gold-bright)}
.typing{display:flex;gap:5px;padding:15px 17px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--cream-dim);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.suggest{display:flex;gap:9px;flex-wrap:wrap;padding:0 20px 14px}
.chip{border:1px solid var(--line);border-radius:20px;background:var(--bg-2);padding:8px 14px;font-size:12.5px;
  cursor:pointer;transition:.2s;color:var(--cream-dim)}
.chip:hover{border-color:var(--gold);color:var(--gold-bright)}
.chat-input{border-top:1px solid var(--line-soft);padding:14px 16px;display:flex;gap:10px;align-items:flex-end}
.chat-input textarea{flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;
  color:var(--cream);font-family:var(--body);font-size:14.5px;padding:12px 14px;resize:none;max-height:120px;line-height:1.6}
.chat-input textarea:focus{outline:none;border-color:var(--gold)}
.sendbtn{width:46px;height:46px;border-radius:13px;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(150deg,var(--gold-bright),var(--gold));color:#14110a;font-size:19px;transition:.2s}
.sendbtn:hover{transform:scale(1.06)}
.sendbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.key-note{margin-top:16px;border:1px dashed var(--line);border-radius:var(--r);padding:16px 18px;font-size:13px;color:var(--cream-dim)}
.key-note b{color:var(--gold-bright)}
.key-note .krow{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.key-note input{flex:1;min-width:200px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;
  color:var(--cream);padding:10px 13px;font-family:var(--label);font-size:13px;letter-spacing:.03em}
.key-note input:focus{outline:none;border-color:var(--gold)}
.key-note .mini{padding:9px 15px;font-size:13px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--cream);cursor:pointer}
.key-note .mini:hover{border-color:var(--gold)}
.key-note .mini.g{background:var(--gold);color:#14110a;border-color:transparent}
/* ---------- glossary ---------- */
.gsearch{position:relative;margin-bottom:22px;max-width:420px}
.gsearch input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:40px;
  color:var(--cream);padding:13px 18px 13px 44px;font-family:var(--body);font-size:15px}
.gsearch input:focus{outline:none;border-color:var(--gold)}
.gsearch .gi{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gterms{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.gterm{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px 20px;transition:.25s}
.gterm:hover{border-color:var(--gold-deep)}
.gterm b{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--gold-bright)}
.gterm .rd{font-family:var(--label);font-size:11px;letter-spacing:.1em;color:var(--muted);margin-left:8px}
.gterm p{font-size:13.5px;color:var(--cream-dim);margin-top:7px;line-height:1.75}
/* ---------- blog CTA ---------- */
.blogcta{border:1px solid var(--gold-deep);border-radius:var(--r-lg);
  background:linear-gradient(120deg,var(--surface-2),var(--surface));padding:28px 30px;margin:16px 0;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.blogcta .bx{flex:1;min-width:240px}
.blogcta .beye{font-family:var(--label);letter-spacing:.24em;font-size:11px;color:var(--gold);text-transform:uppercase}
.blogcta h3{font-family:var(--serif);font-weight:800;font-size:22px;margin:8px 0 6px;line-height:1.4}
.blogcta p{font-size:14px;color:var(--cream-dim)}
/* ---------- footer ---------- */
footer{border-top:1px solid var(--line-soft);margin-top:40px;padding:40px 0 120px;background:var(--bg-2)}
.foot{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
.foot .fbrand b{font-family:var(--serif);font-weight:800;font-size:20px}
.foot .fbrand p{color:var(--muted);font-size:12.5px;margin-top:8px;max-width:340px;line-height:1.7}
.foot .fcol h4{font-family:var(--label);letter-spacing:.16em;font-size:12px;color:var(--gold);
  text-transform:uppercase;margin-bottom:12px}
.foot .fcol a,.foot .fcol span{display:block;font-size:13px;color:var(--cream-dim);margin:7px 0;cursor:pointer}
.foot .fcol a:hover{color:var(--gold-bright)}
.disc{margin-top:30px;padding-top:22px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);line-height:1.8}
/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:linear-gradient(150deg,var(--surface-2),var(--surface));border:1px solid var(--gold-deep);
  border-radius:40px;padding:13px 24px;display:flex;align-items:center;gap:11px;box-shadow:var(--sh);
  opacity:0;pointer-events:none;transition:.4s;font-size:14px;font-weight:700}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ti{font-size:20px}
/* ---------- responsive ---------- */
@media(max-width:860px){
  .dash{grid-template-columns:1fr}
  .chgrid{grid-template-columns:1fr 1fr}
  .qhub-grid,.gterms,.qterms{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
  .nav-links{display:none}
  .hdr-xp .lv{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:80;

    padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
  .tabbar button{background:none;border:none;color:var(--muted);cursor:pointer;flex:1;

  .tabbar button .tic{font-size:20px}
  .tabbar button.on{color:var(--gold-bright)}
  .chgrid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .journey{padding:18px 16px}

.tierhead{display:flex;align-items:center;gap:14px;margin:8px 0 20px}
.tierbadge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex-shrink:0;
  border:1px solid var(--line);background:var(--surface-2)}
.tierhead .tx b{font-family:var(--serif);font-weight:800;font-size:22px;display:block;line-height:1.2}

.tierhead .tx small{display:block;color:var(--cream-dim);font-size:12.5px;margin-top:2px}
.tierhead .tp{margin-left:auto;text-align:right;font-family:var(--label);font-size:12px;color:var(--cream-dim);white-space:nowrap}
.tierhead .tp b{color:var(--gold-bright);font-size:16px}
.tier-t1{--tc:var(--calm)} .tier-t2{--tc:var(--gold)} .tier-t3{--tc:var(--hot)} .tier-t4{--tc:var(--cold)}

.tierlock{opacity:.5;filter:grayscale(.4)}
.tierlock .chcard{cursor:not-allowed}
.locknote{font-size:12.5px;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:7px}
/* tier rail (home) */
.tierrail{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 6px}
.trcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 14px;text-align:center;
  cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.trcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--tc)}
.trcard:hover{transform:translateY(-3px);border-color:var(--tc)}
.trcard .ic{font-size:26px}
.trcard .nm{font-family:var(--serif);font-weight:700;font-size:15px;margin-top:4px}
.trcard .en{font-family:var(--label);font-size:9.5px;letter-spacing:.2em;color:var(--tc);text-transform:uppercase}
.trcard .pc{font-family:var(--label);font-size:12px;color:var(--cream-dim);margin-top:8px}
.trcard .mini{height:5px;border-radius:5px;background:var(--bg-2);overflow:hidden;margin-top:6px}
.trcard .mini>i{display:block;height:100%;background:var(--tc)}
/* certificate */
.cert{max-width:640px;margin:0 auto;border:2px solid var(--gold-deep);border-radius:var(--r-lg);
  background:linear-gradient(160deg,var(--surface-2),var(--bg-2));padding:40px 34px;text-align:center;position:relative;box-shadow:var(--sh)}
.cert::before,.cert::after{content:"";position:absolute;width:44px;height:44px;border:2px solid var(--gold)}
.cert::before{top:14px;left:14px;border-right:0;border-bottom:0}
.cert::after{bottom:14px;right:14px;border-left:0;border-top:0}
.cert .seal{font-size:44px;margin-bottom:8px}
.cert .cap{font-family:var(--label);letter-spacing:.3em;font-size:11px;color:var(--gold);text-transform:uppercase}
.cert h2{font-family:var(--serif);font-weight:800;font-size:26px;margin:10px 0}
.cert .grade{font-family:var(--serif);font-weight:800;font-size:34px;color:var(--gold-bright);margin:4px 0}
.cert p{color:var(--cream-dim);font-size:13.5px;margin:10px 0}
.cert .cid{font-family:var(--label);font-size:11px;color:var(--muted);letter-spacing:.12em;margin-top:14px}
/* bookshelf / affiliate */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
.book{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px 18px;transition:.25s;display:flex;flex-direction:column}
.book:hover{border-color:var(--gold);transform:translateY(-4px)}
.book .bi{font-size:28px}
.book h4{font-family:var(--serif);font-weight:700;font-size:16px;margin:8px 0 4px;line-height:1.4}
.book p{font-size:12.5px;color:var(--cream-dim);flex:1;line-height:1.7}
.book .ba{margin-top:12px;font-family:var(--body);font-weight:700;font-size:13px;color:var(--gold-bright);

.book .ba:hover{background:var(--gold);color:#14110a}
.shelf-note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.7}
@media(max-width:860px){.tierrail{grid-template-columns:1fr 1fr}.shelf{grid-template-columns:1fr}}

    {type:"p",text:"「もらえるお金」は魅力的ですが、性質を知らないと計画を壊します。補助金は原則<b>後払い（精算払い）</b>。先に自分で払い、審査と実績報告を経てから振り込まれます。"},
    {type:"h",text:"サウナ開業で候補になる制度"},
    {type:"list",items:[
     "<b>小規模事業者持続化補助金</b>：販路開拓等の経費を補助。2025年度公募では一般型（通常枠・上限50万円＋特例の上乗せあり）と、創業3年以内が対象の<b>創業型（上限200万円）</b>があった（採択率は約38〜48%という回もある）。",
     "自治体独自の創業支援・店舗改装補助が存在する場合がある（<b>自治体により異なる</b>。商工会議所・よろず支援拠点で確認）。",
     "雇用関係の助成金は従業員を雇う段階で検討。"

    {type:"p",text:"重要なのは「補助金は落ちることがある」という前提です。採択率5割前後の勝負に開業計画全体を賭けてはいけません。<b>補助金なしでも成立する計画に、採択されたら上乗せする</b>——これが正しい使い方です。"},
    {type:"note",text:"公募回ごとに枠・上限・条件が変わります。<b>必ず最新の公募要領を確認</b>し、申請書類は商工会議所等の無料相談を活用してください。"}
   ],

  },
  {

    {type:"list",items:[

/* ========== 経営学部：収支計画と赤字回避（ストーブ前） ========== */
{

 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-22.jpg", photoAlt:"積み重なった薪のクローズアップ",
 title:"収支計画と赤字回避", subtitle:"経営学部｜誰だって赤字にはしたくない",
 desc:"損益分岐点、固定費と燃料費、値付けと稼働率。「好き」を続けるための守りの数字を、順を追って身につける。",
 lessons:[
  {
   id:"l34-1", title:"損益分岐点——「何人来れば潰れないか」を知る",
   blocks:[
    {type:"p",text:"経営の恐怖は漠然とした不安から生まれます。特効薬は<b>損益分岐点</b>——「月に何人来れば赤字にならないか」をたった1つの数字にすることです。"},
    {type:"h",text:"計算はシンプル"},
    {type:"list",items:[
     "<b>固定費</b>（家賃・人件費・リース・保険など、客数ゼロでも出ていくお金）を月額で合計する。",
     "<b>1人あたり粗利</b>＝客単価−変動費（水道光熱の従量分・アメニティ・決済手数料など）。",
     "<b>損益分岐客数＝固定費÷1人あたり粗利</b>。これが「潰れないライン」。"
    ]},
    {type:"p",text:"例えば固定費60万円・客単価4,000円・1人あたり粗利3,000円なら、月200人・1日あたり約7人が分岐点。実在の公表事例（ハコサウナ：客単価4,000円・月商約140万円・利益率40%）と見比べると、数字の現実感が掴めます。"},
    {type:"note",text:"開業前に<b>「悲観・普通・楽観」の3パターン</b>で分岐点を計算し、悲観シナリオでも半年耐えられる運転資金を持つこと。これが赤字回避の第一原則です。"}
   ],
   sources:[
    {label:"J-Net21（中小機構）｜損益分岐点の考え方（起業ガイド）",url:"https://j-net21.smrj.go.jp/startup/guide/service/h006.html",icon:"🏛️"},
    {label:"ハコサウナ｜公表収支（客単価4,000円・利益率40%）",url:"https://hakosauna.com/blog/private-sauna-startup-cost",icon:"📗"}
   ],
   quiz:[
    {q:"損益分岐客数の計算式は？",choices:["固定費÷1人あたり粗利","売上×利益率","家賃×12","客単価×営業日数"],answer:0,explain:"<b>固定費÷1人あたり粗利</b>。「月に何人来れば潰れないか」を1つの数字にすることが、経営の不安を消す第一歩です。"},
    {q:"開業前の収支計画で推奨される作り方は？",choices:["楽観シナリオのみ","悲観・普通・楽観の3パターンで作り悲観でも半年耐える資金を持つ","計画は開業後に考える","競合の数字をコピーする"],answer:1,explain:"<b>3シナリオ＋悲観で半年の運転資金</b>。ブームの追い風が止まっても生き残る設計が「守り」です。"}
   ]
  },
  {
   id:"l34-2", title:"固定費と燃料費——温浴業最大の敵",
   blocks:[
    {type:"p",text:"温浴業の損益計算書で暴れるのは光熱費です。帝国データバンクの調査では、燃料費が3割上昇した場合の営業利益減少率は全産業平均約5%に対し<b>銭湯業は平均30%</b>という試算があります。桁がひとつ違う——これが熱を売る商売の宿命です。"},
    {type:"h",text:"守りの打ち手"},
    {type:"list",items:[
     "<b>熱源の選択</b>：薪・電気・ガスで費用構造が変わる。契約前に燃料高騰シナリオ（+3割）で試算する。",
     "<b>断熱への投資</b>：サウナ室の断熱品質はランニングコストに毎日効く。初期費用の節約が10年の光熱費で逆転することも。",
     "<b>設備メンテ</b>：チラー（水風呂冷却）や換気の効率低下は電気代に直結。清掃・保守は経費でなく投資。",
     "<b>営業時間の設計</b>：客が来ない時間に熱を維持するコストは大きい。予約制・時間帯集約は個室サウナの合理的戦略。"
    ]},
    {type:"p",text:"街の銭湯がピーク時の約9割減（1968年17,999軒→2022年1,865軒）まで減った背景にも、燃料費と設備更新の重さがあります。先人の撤退理由は、最高の教科書です。"},
    {type:"note",text:"物件契約前に<b>電気容量とガス・給排水の引込条件</b>を必ず確認。容量不足の増設工事は数十万〜数百万円の想定外出費になります（実例：ハコサウナの公表記録）。"}
   ],
   sources:[
    {label:"帝国データバンク｜燃料費上昇と銭湯の利益",url:"https://prtimes.jp/main/html/rd/p/000001313.000043465.html",icon:"📊"},
    {label:"東京商工リサーチ｜銭湯の減少",url:"https://www.tsr-net.co.jp/data/detail/1191268_1527.html",icon:"📊"},

   quiz:[

    {q:"物件契約前に必ず確認すべきインフラは？",choices:["最寄りのコンビニ","電気容量と給排水・ガスの引込条件","隣人の職業","眺望"],answer:1,explain:"<b>電気容量・給排水・ガス</b>。引込や増設で数十万〜数百万円の想定外出費が出た実例が公表されています。"}
   ]
  },
  {

   blocks:[
    {type:"p",text:"価格は経営者の意思表示です。個室サウナの相場は東京で60分3,500〜6,500円程度という情報がありますが、大切なのは相場ではなく<b>自分の損益分岐点と提供価値から逆算した価格</b>です。"},
    {type:"h",text:"稼働率を上げる打ち手"},
    {type:"list",items:[

     "<b>予約制</b>：個室型なら無駄な待機時間の熱コストを削れる。"

    {type:"h",text:"赤字回避チェックリスト（開業前の最終確認）"},

     "補助金なしで成立する計画か",
     "許認可（保健所・消防・建築）の費用と期間を織り込んだか",

    {type:"note",text:"最後の項目がいちばん大切です。<b>撤退ラインを先に決めた人だけが、安心して攻められる</b>。夢を守るのは、冷静な数字です。次章では集客とブランディングを学びます。"}

/* ========== 経営学部：サウナ開業の法律と許認可（ストーブ前） ========== */
{
 id:"ch30", tier:"t4", icon:"⚖️", accent:"var(--gold)",
 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-05.jpg", photoAlt:"森を望む木製サウナ室の内部",
 title:"サウナ開業の法律と許認可", subtitle:"経営学部｜夢を現実に変える法知識",
 desc:"自分のサウナを持つために避けて通れない公衆浴場法・建築基準法・消防法。行政の一次資料に基づいて、許認可の全体像を体系的に学ぶ。",
 lessons:[
  {
   id:"l30-1", title:"公衆浴場法——すべてのサウナ営業の入口",
   blocks:[
    {type:"p",text:"「いつか自分のサウナを持ちたい」——その夢の最初の関門が公衆浴場法です。公衆浴場とは「温湯、潮湯又は温泉その他を使用して、公衆を入浴させる施設」。これを業として経営するには、都道府県知事（保健所設置市・特別区では市長・区長）の許可が必要です。"},
    {type:"h",text:"「一般公衆浴場」と「その他の公衆浴場」"},
    {type:"list",items:[
     "<b>一般公衆浴場</b>：いわゆる銭湯。物価統制令で入浴料金が統制されている。",
     "<b>その他の公衆浴場</b>：サウナはこちらに明記されている。ヘルスセンターやスポーツ施設併設の浴場と同じ区分。",
     "許可の前提となる<b>構造設備基準は都道府県などの条例</b>で定められ、自治体によって内容が異なる。"
    ]},
    {type:"h",text:"個室サウナも「業」なら許可が必要"},
    {type:"p",text:"反復継続の意思をもって人を入浴させるなら、個室型でも会員制でも「業」と判断されるのが行政実務です。個室サウナブームを受けて、厚生労働省は令和6年に全国157自治体の運用を調査した報告書を公表。118自治体が基準緩和などの特例的取扱いを行っており、着衣利用を条件にした混浴規定の緩和（67自治体）などの事例が報告されています。"},
    {type:"note",text:"<b>実務の鉄則は「工事の前に保健所へ事前相談」</b>。平面図の段階で相談→申請→立入検査→許可、が一般的な流れです。※本章は一般的な情報であり法的助言ではありません。開業の際は必ず管轄保健所・専門家に確認してください。"}
   ],
   sources:[
    {label:"厚生労働省｜公衆浴場法概要",url:"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/seikatsu-eisei/seikatsu-eisei04/04.html",icon:"🏛️"},
    {label:"e-Gov法令検索｜公衆浴場法",url:"https://laws.e-gov.go.jp/law/323AC0000000139",icon:"📜"},
    {label:"厚生労働省｜サウナに係る許可等のあり方 検討会報告書（令和6年）",url:"https://www.mhlw.go.jp/content/11130500/001449392.pdf",icon:"🏛️"},
    {label:"東京都港区｜公衆浴場の手続き",url:"https://www.city.minato.tokyo.jp/kankyoueiseishidou/kuse/egyokyoka/tetsuzuki/yokujo.html",icon:"🏢"}
   ],
   quiz:[

    {type:"h",text:"サウナは消防法上の「特定防火対象物」"},
    {type:"list",items:[

    {type:"p",text:"サウナストーブそのものの位置・構造・管理は、市町村の火災予防条例が規制します（定温式感知器の設置、可燃物からの離隔距離など）。2025年度には消防庁の検討を経て基準が見直され、出力6kW以下の「簡易サウナ設備」（テントサウナ・バレルサウナ等を想定）の基準が整理されました。事業で使う場合は消防署への届出が必要です。"},
    {type:"note",text:"薪ストーブは煙突の離隔距離など追加基準があります。物件契約の<b>前に</b>、保健所と並んで<b>消防署への事前相談</b>を。この順番を間違えると「借りたのに営業できない物件」を掴むことになります。"}

    {type:"p",text:"温泉を浴用に供するには温泉法の<b>利用許可</b>が必要。許可後も登録分析機関による成分分析（10年ごと）と、成分・禁忌症の掲示義務が続きます。"},

/* ========== 文化学科：ピルティスとバーニャ（ストーブ前） ========== */

   blocks:[
    {type:"p",text:"リトアニア語で蒸気浴小屋を「ピルティス（pirtis）」と呼びます。薪ストーブの石に水をかけて蒸気を立てる点はサウナと同じ。しかし思想が違います。ピルティスは体を洗う場所である以上に、<b>心身を清める儀式の場</b>なのです。"},

    {type:"note",text:"フィンランドのサウナが「日常の聖域」なら、ピルティスは「非日常の儀式」。どちらが上ではなく、<b>熱の文化には複数の系譜がある</b>——これがこの章の出発点です。"}

    {type:"h",text:"ヴァンタの基礎知識"},
    {type:"list",items:[
     "<b>素材</b>：白樺とオークが中心。リンデン（菩提樹）、カエデ、モミなども使われ、カモミールやミントなどの薬草はハーブティーやスクラブとして併用される。",
     "<b>採取</b>：夏至前後の初夏、葉が若く丈夫な短い期間に作り、乾燥保存する。",

     "<b>作用の説明</b>：血行促進・角質除去・葉の精油成分の吸入——と説明されるのが一般的。"

    {type:"p",text:"ウィスキングを受けると、蒸気の熱が「面」で体を包み、葉の香りが呼吸に入ってきます。言語を介さずに深い体験になるのは、皮膚と嗅覚という言葉以前の感覚に直接働きかけるからです。"},
    {type:"note",text:"<b>安全上の注意</b>：高温浴一般の注意（飲酒併用の禁止、水分補給、1回15〜20分目安、めまいを感じたら退出）がそのまま当てはまります。皮膚疾患や開放創がある場合は避けること。心疾患・高血圧・妊娠中の方は事前に医師に相談を。効果の感じ方には個人差があります。"}

  {
   id:"l32-3", title:"ロシアのバーニャ——精霊バンニクと再生の思想",
   blocks:[
    {type:"p",text:"ロシアの蒸気浴「バーニャ」は、10世紀の年代記にまで文献を遡れる、ロシア文化と不可分の存在です。"},
    {type:"h",text:"バーニャの構造と作法"},
    {type:"list",items:[
     "伝統的に3室構成：脱衣・休憩室<b>プレドバンニク</b>、洗い場、そして核心の蒸気室<b>パリールカ</b>（湿度が高く90℃を超えることも）。",

    {type:"h",text:"バンニク——バーニャの精霊"},
    {type:"p",text:"民間伝承では、バーニャには「バンニク」という精霊が棲むとされました。白樺の葉をまとった小柄な老人の姿で語られ、<b>3〜4巡目の蒸気は彼のために空けておく</b>、聖像は持ち込まない——といった作法が伝えられています。キリスト教以前には、バーニャで出産が行われ、葬送の後に遺族が集う場でもあった、という記録が残ります。「バーニャで洗えば生まれ直す」という言い回しは、熱→冷→再生というサウナ体験の核心を、千年前から言い当てていました。"},

   blocks:[
    {type:"p",text:"ラトビアの「ピルツ（pirts）」も、洗う場所である以上に人生の節目の場でした。農場では住居より先にピルツを建てることもあり、ピルツを讃える民謡（ダイナ）は300曲以上残っています。誕生後まもなく母子で行う「ピルティージャス」という通過儀礼、ピルツを守る精霊「ピルツ・ガリンシュ」——という伝承もあります。"},
    {type:"h",text:"ピルトニエクス——資格を持つ浴師"},
    {type:"p",text:"現代ラトビアで儀式を導くのは「ピルトニエクス（pirtnieks）」。<b>専門学校で約1年学び試験に合格して資格を得る</b>制度が実在し、上位の「サウナマスター」にはさらに1年半程度の修学が必要とされます。ハーブをベンチに敷き、スクラブ・ウィスキング・ハーブ茶で五感全体に働きかける1対1の浄化儀式は、マッサージでもエステでもない、ラトビア固有の文化です。国家無形文化遺産リストへは申請中（2024年報道時点）。"},
    {type:"h",text:"フィンランドとの違い——3つの軸"},
    {type:"list",items:[
     "<b>温度と時間</b>：フィンランドは高温低湿で短めに、日常として。バルトは約60℃の低温多湿で3時間以上、儀式として。",
     "<b>導き手</b>：フィンランドは基本セルフ。バルトには訓練・認定を受けた浴師（ピルティニンカス／ピルトニエクス）が儀式を主導する専門職文化がある。",
     "<b>植物の使い方</b>：フィンランドにもヴィヒタはあるが、バルト・ロシアではウィスク＋ハーブ＋蜂蜜＋塩＋粘土と多彩で、植物が主役級。"
    ]},
    {type:"note",text:"ユネスコ「人類の無形文化遺産代表一覧」に登録されているのは<b>フィンランドのサウナ文化（2020年）</b>。リトアニアは国家目録に登録済み、ラトビアも2025年に自国の無形文化遺産目録への登録を実現——と正確に区別して覚えましょう（いずれもユネスコの代表一覧そのものではありません）。GOMIRACHELINの聖地巡礼章とあわせて読むと、世界の熱の地図が立体になります。"}
   ],
   sources:[
    {label:"latvia.eu（ラトビア公式）｜Pirts – the Latvian sauna",url:"https://www.latvia.eu/sauna/",icon:"🌍"},
    {label:"LSM（ラトビア公共放送）｜For the love of pirts（2024）",url:"https://eng.lsm.lv/article/features/features/24.06.2024-for-the-love-of-pirts-how-an-ancient-latvian-tradition-is-thriving-in-the-21st-century.a556422/",icon:"📰"},
    {label:"British Sauna Society｜ラトビア浴師養成の実地報告",url:"https://www.britishsaunasociety.org.uk/news/inside-latvian-pirts-a-british-sauna-masters-training-journey",icon:"📗"},
    {label:"UNESCO｜Sauna culture in Finland（2020登録）",url:"https://ich.unesco.org/en/RL/sauna-culture-in-finland-01596",icon:"🏛️"}

   quiz:[
    {q:"ユネスコ「人類の無形文化遺産代表一覧」に登録されているサウナ文化は？",choices:["リトアニアのピルティス","ラトビアのピルツ","フィンランドのサウナ文化（2020年）","ロシアのバーニャ"],answer:2,explain:"代表一覧登録は<b>フィンランド（2020年）</b>。リトアニアのピルティスは国家無形文化遺産目録に登録、ラトビアも2025年に自国の目録への登録を実現しました（いずれもユネスコの代表一覧とは別枠です）。"},
    {q:"ラトビアの浴師「ピルトニエクス」について正しいのは？",choices:["世襲制で一般人はなれない","専門学校で約1年学び試験に合格して資格を得る制度がある","資格制度は存在しない","日本の温泉ソムリエと同一資格"],answer:1,explain:"<b>約1年の修学＋試験</b>で資格を取得、上位のサウナマスターにはさらに約1年半。浴師が職業として制度化されているのがバルトの特徴です。"}

/* ========== 文化学科：ヴィム・ホフ・メソッド（ストーブ前） ========== */
{
 id:"ch35", tier:"t3", icon:"❄️", accent:"var(--cold)",
 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-23.jpg", photoAlt:"凍った海の氷穴で泳ぐ人の遠景",
 title:"ヴィム・ホフ・メソッドと冷の科学", subtitle:"文化学科｜呼吸・寒冷・そして安全",
 desc:"「アイスマン」ヴィム・ホフのメソッドを、公式の説明・査読研究・そして何より安全上の警告とともに正しく学ぶ。冷水浴とサウナ文化の交差点。",
 lessons:[
  {
   id:"l35-1", title:"3つの柱——呼吸・寒冷曝露・マインドセット",
   blocks:[
    {type:"note",warn:true,text:"<b>⚠ 最重要の安全警告：呼吸法は座位または横になった状態でのみ行ってください。水中・浴槽・水風呂・プール・運転中では絶対に行わないこと。</b>過換気は前触れなく失神を招き、水があると溺死につながります（詳細は次レッスン）。"},
    {type:"p",text:"ヴィム・ホフはオランダ出身、極寒環境での記録で知られ「アイスマン」と呼ばれる人物です。彼が体系化したヴィム・ホフ・メソッド（WHM）は、公式サイトで<b>3つの柱</b>として説明されています。"},
    {type:"list",items:[
     "<b>①呼吸法（Breathing）</b>：30〜40回の深く意図的な呼吸（過換気）のあと、息を吐いて止める——を数ラウンド繰り返す。",
     "<b>②寒冷曝露（Cold Exposure）</b>：冷水シャワーやアイスバスなど、毎日の冷刺激。",
     "<b>③マインドセット（Mindset）</b>：他の2つを支える、心のあり方という土台。"
    ]},
    {type:"p",text:"公式は「3要素の組み合わせにこそ力がある」と説明します。サウナ後の水風呂・外気浴に通じる「熱と冷のコントラスト」を、呼吸という軸で体系化したものと捉えると、サウナーには理解しやすいはずです。"},
    {type:"note",text:"本章は<b>一般的な情報であり医療的助言ではありません</b>。心疾患・てんかん・高血圧・妊娠中の方などは、実践前に必ず医師に相談してください。効果の感じ方には個人差があります。"}
   ],
   sources:[
    {label:"Wim Hof Method 公式｜Practice the Method（3本柱）",url:"https://www.wimhofmethod.com/practice-the-method",icon:"❄️"},
    {label:"Wim Hof Method 公式｜安全ガイドライン",url:"https://www.wimhofmethod.com/shallow-water-blackout",icon:"⚠️"}
   ],
   quiz:[
    {q:"ヴィム・ホフ・メソッドの3つの柱は？",choices:["食事・睡眠・運動","呼吸法・寒冷曝露・マインドセット","筋トレ・断食・瞑想のみ","サウナ・水風呂・外気浴"],answer:1,explain:"公式が挙げるのは<b>呼吸法・寒冷曝露・マインドセット</b>。3つの組み合わせに力があるとされます。"},
    {q:"WHMの呼吸法を行ってはいけない状況は？",choices:["静かに座っているとき","横になっているとき","水中・浴槽・運転中","朝起きたとき"],answer:2,explain:"<b>水中・浴槽・運転中は絶対禁止</b>。過換気は前触れなく失神を招き、水があれば溺死に直結します。座位か臥位でのみ行います。"}
   ]
  },
  {
   id:"l35-2", title:"失神の科学——なぜ水中で行ってはいけないのか",
   blocks:[
    {type:"note",warn:true,text:"<b>⚠ このレッスンは安全のための最重要知識です。</b>WHMの呼吸法に関連した溺死事故が複数記録されています。仕組みを理解して、絶対に事故を起こさないでください。"},
    {type:"h",text:"浅水失神（shallow water blackout）の仕組み"},
    {type:"p",text:"私たちが「息をしたい」と感じる合図は、酸素の不足ではなく<b>二酸化炭素（CO2）の蓄積</b>です。過換気（速く深い呼吸の繰り返し）をすると血中のCO2が過剰に低下し、「呼吸せよ」という脳の警報が遅れます。すると——酸素が失神レベルまで下がっても、苦しさを感じないまま、前触れなく意識を失うのです。"},
    {type:"list",items:[
     "陸上（座位・臥位）で失神しても、呼吸が自然に回復し大事に至りにくい。",
     "しかし<b>水中・浴槽では、意識を失った瞬間に溺れる</b>。これが浅水失神。",
     "オーストラリアの病理研究者は、この呼吸パターンと水中死との関連を指摘。米国では未成年の死亡をめぐる訴訟も報道されている。"
    ]},
    {type:"p",text:"サウナ後の水風呂は多くの人にとって日常ですが、<b>「水風呂に入る直前に過換気の呼吸法をする」のは危険な組み合わせ</b>です。呼吸法とサウナ/水風呂は、時間と場所を分けてください。"},
    {type:"note",text:"体調が優れないとき、飲酒後、単独のときは特にリスクが高まります。<b>迷ったらやらない</b>。この判断ができる人が、長くサウナを楽しめる人です。"}
   ],
   sources:[
    {label:"Wim Hof Method 公式｜What Is Shallow Water Blackout?",url:"https://www.wimhofmethod.com/shallow-water-blackout",icon:"⚠️"},
    {label:"Simply Psychology｜WHM — Hype vs. Evidence（安全批評）",url:"https://www.simplypsychology.com/articles/wim-hof-method-evidence",icon:"⚕️"},
    {label:"CNN（2024）｜冷水療法の科学は弱い",url:"https://www.cnn.com/2024/03/13/health/wim-hof-weak-science-wellness",icon:"📰"}
   ],
   quiz:[
    {q:"私たちが「息をしたい」と感じる主な合図は？",choices:["酸素の不足","二酸化炭素（CO2）の蓄積","体温の低下","心拍の上昇"],answer:1,explain:"合図は<b>CO2の蓄積</b>。過換気でCO2が下がると警報が遅れ、酸素不足でも苦しさを感じないまま失神する——これが浅水失神の恐ろしさです。"},
    {q:"呼吸法と水風呂の正しい関係は？",choices:["水風呂の中で呼吸法をすると効果的","水風呂の直前に過換気すると良い","時間と場所を分け、水の近くでは行わない","同時に行うほど安全"],answer:2,explain:"<b>時間と場所を分ける</b>。水風呂直前の過換気は浅水失神の典型的な危険パターンです。"}
   ]
  },
  {
   id:"l35-3", title:"科学が言えること・言えないこと",
   blocks:[
    {type:"p",text:"WHMには査読された研究が存在します。同時に、誇張された主張も多くあります。誠実な学び手として、両方を知りましょう。"},
    {type:"h",text:"2014年 PNAS（Radboud大学）の研究"},
    {type:"list",items:[
     "10日間WHM（瞑想・呼吸法・冷水浸漬）を訓練した群に、実験的に炎症を起こす物質を投与した。",
     "訓練群は<b>血中アドレナリンが上昇し、自然免疫の炎症反応が抑えられ、症状が軽かった</b>。",
     "「自律神経系を随意的に活性化できる」ことを示した点で画期的だった。"
    ]},
    {type:"h",text:"ただし、限界がある"},
    {type:"p",text:"この研究は<b>被験者数が少なく</b>、後年のレビューやCNN・Mayo Clinicの報道でも「回復や気分向上といった主張の多くは、質の高いエビデンスがまだ限定的」と留保されています。つまり——<b>「効く可能性を示す研究はあるが、万能薬の証明ではない」</b>のが正確な現在地です。"},
    {type:"p",text:"それでもWHMは、冷水浴（アイスバス／コールドプランジ）を世界的トレンドに押し上げました。サウナ→水風呂→外気浴という交互浴の伝統と、科学的な冷曝露研究が出会う場所に、いまのサウナ文化の熱があります。"},
    {type:"note",text:"誰かが「これで病気が治る」と断言していたら、距離を置いてください。<b>誠実な科学は、いつも慎重な言葉で語ります</b>。サウナ大学もその態度を貫きます。"}
   ],
   sources:[

    {label:"CNN（2024）｜冷水療法の科学的評価",url:"https://www.cnn.com/2024/03/13/health/wim-hof-weak-science-wellness",icon:"📰"}
   ],
   quiz:[
    {q:"2014年のPNAS研究が示したことは？",choices:["あらゆる病気が治る","自律神経系を随意的に活性化し炎症反応を抑えられる可能性","冷水は健康に無関係","呼吸法は危険なだけ"],answer:1,explain:"<b>自律神経系の随意的活性化と炎症反応の抑制</b>を示した画期的研究。ただし少人数で、万能薬の証明ではありません。"},
    {q:"WHMの効果に対する誠実な態度は？",choices:["万能薬として宣伝する","「治る」と断言する情報は信頼する","効く可能性を示す研究はあるがエビデンスは限定的、と慎重に捉える","科学は全て無視する"],answer:2,explain:"<b>慎重な言葉で語るのが誠実な科学</b>。「これで治る」という断言には距離を置きましょう。"}

/* ========== 文化学科：滝行と禊——日本の冷水文化（上段） ========== */
{
 id:"ch38", tier:"t3", icon:"⛩️", accent:"var(--cold)",
 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-30.jpg", photoAlt:"冬の湖に浸かる後ろ姿",
 title:"滝行と禊——日本の冷水文化とサウナ", subtitle:"文化学科｜日本の「水」と再生の思想",
 desc:"水風呂の気持ちよさの、はるか上流へ。神話の禊、修験道の滝行——日本人が千年以上かけて磨いてきた「冷水で心身を清める」思想を旅する章。",
 lessons:[
  {
   id:"l38-1", title:"みそぎ（禊）の起源——神話が語る水の浄化",
   blocks:[
    {type:"p",text:"サウナーが水風呂に沈むとき感じる「リセットされた」という感覚。実は日本文化には、その感覚を千年以上前から言葉にしてきた伝統があります。それが<b>禊（みそぎ）</b>——水で心身の穢（けがれ）を洗い清める神道の宗教儀礼です。"},
    {type:"h",text:"イザナギの禊——神話の原点"},
    {type:"p",text:"『古事記』にはこう記されています。伊邪那岐命（イザナギ）は、亡き妻を追って黄泉の国（死者の国）へ行き、地上へ逃げ帰ったあと、体に付いた死の穢れを祓うため、<b>筑紫の日向の橘の小戸の阿波岐原</b>で水に入り、身を洗いました。これが禊の神話的な起源とされます。"},
    {type:"list",items:[
     "禊とは、川や海の清い水に身を浸し、<b>罪や穢れを洗い清める</b>神道の儀礼。",
     "神話では、イザナギが脱ぎ棄てた衣や、体を洗う過程から<b>多くの神々が生まれた</b>と語られる。水による浄化は「終わり」ではなく「新しい誕生」の場面でもある。",
     "神社で参拝前に行う<b>手水（てみず）</b>——手と口をすすぐあの作法は、この「水に浸かって穢れを落とす」禊を簡略化したもの。"
    ]},
    {type:"p",text:"つまり日本では、冷たい水に入ることは「我慢」ではなく<b>「再生の儀式」</b>として物語られてきました。水風呂で感じるあの生まれ変わったような感覚に、神話は千年以上前から名前を与えていたのです。"},
    {type:"note",text:"神話や信仰は<b>伝承として</b>紹介しています。効果や実在を断定するものではありません。それでも、文化がなぜ冷水に意味を見いだしたかを知ると、日々のサウナが少し深くなります。"}
   ],
   sources:[
    {label:"神社本庁｜禊とは",url:"https://www.jinjahoncho.or.jp/omatsuri/misogi/",icon:"⛩️"},
    {label:"神社本庁｜手水舎について",url:"https://www.jinjahoncho.or.jp/omairi/temizuya/",icon:"⛩️"},
    {label:"國學院大學 古事記学センター｜みそぎ①（原文・解説）",url:"https://kojiki.kokugakuin.ac.jp/kojiki/みそぎ①/",icon:"🎓"},
    {label:"コトバンク｜禊",url:"https://kotobank.jp/word/%E7%A6%8A-138728",icon:"📖"}
   ],
   quiz:[
    {q:"禊の神話的な起源とされる出来事は？",choices:["天照大神の岩戸隠れ","イザナギが黄泉の国から帰り水で穢れを祓ったこと","スサノオの八岐大蛇退治","神武天皇の東征"],answer:1,explain:"『古事記』では、黄泉の国から帰った<b>イザナギが筑紫の日向の橘の小戸の阿波岐原で身を洗い、穢れを祓った</b>のが禊の原点。その過程から多くの神々が生まれたと語られます。"},
    {q:"神社の手水（てみず）と禊の関係は？",choices:["無関係の衛生習慣","禊を簡略化した作法","明治時代に作られた新しい儀式","外国から伝わった習慣"],answer:1,explain:"手水は<b>「水に浸かって穢れを落とす」禊を簡略化したもの</b>。参拝前に手と口を清めるのは、小さな禊なのです（神社本庁の解説より）。"}
   ]
  },
  {
   id:"l38-2", title:"滝行の実際——修験道と水の修行",
   blocks:[
    {type:"p",text:"禊の思想は、やがて「行（ぎょう）」として体系化されます。その代表が<b>滝行（たきぎょう）</b>——落ちてくる滝の水に打たれながら祈る修行です。"},
    {type:"h",text:"滝行の系譜"},
    {type:"list",items:[
     "神仏に祈願する際に冷水を浴びて心身を清めることを<b>水垢離（みずごり）</b>と言う。古代の禊に由来し、平安期以降に密教系の行と習合して<b>水垢離・滝行・水行</b>という修行形式に発展した。",
     "これらを各地に広めたのが<b>修験道</b>——日本古来の山岳信仰に密教・道教などが結びついて平安末期に成立した宗教。開祖は役小角（えんのおづぬ／役行者）と伝えられ、修行者は<b>山伏</b>と呼ばれる。",
     "修験道の聖地・吉野の金峯山寺は世界遺産「紀伊山地の霊場と参詣道」の一部。山の中で心身を鍛える「苦修練行」の伝統が今も続く。"
    ]},
    {type:"h",text:"現代人も体験できる"},
    {type:"p",text:"滝行は今、修行者だけのものではありません。たとえば大阪・犬鳴山の七宝瀧寺では、修験者の指導のもと行場を巡り「行者の瀧」で瀧修行を行う一日修行体験を毎月開催しています（2026年7月時点：毎月第三日曜中心・参加費8,000円・要事前予約。女性も参加でき「女人大峯」とも呼ばれます）。目的は我慢比べではなく、<b>水に打たれて雑念を手放し、精神を統一すること</b>。"},
    {type:"note",cool:true,text:"サウナ→水風呂の「熱と冷のコントラスト」と、滝行の「祈りと冷水」。方法は違っても、<b>冷たい水が心を静める</b>という発見を、日本文化は独自の形で育ててきました。体験する場合は必ず寺社の指導者のもとで行いましょう。"}

   id:"l38-3", title:"冷水に入る前に——現代の安全知識",
   blocks:[
    {type:"note",warn:true,text:"<b>⚠ 憧れだけで冬の滝や冷たい自然水域に入るのは危険です。</b>このレッスンは、禊・滝行・水風呂すべてに共通する「冷水の安全」を扱います。必ず読んでください。"},
    {type:"h",text:"冷水ショック（cold shock）"},
    {type:"list",items:[
     "冷たい水に急に入ると、反射的に<b>あえぎ呼吸・過呼吸</b>が起こる。意識障害や方向感覚の喪失を招き、<b>約2分で手足の筋肉が動かせなくなる</b>ことがある。",
     "特に<b>水温約10℃以下</b>は危険。真夏で気温が30℃を超えていても、山の滝や川の水は10℃以下のことがある——「暑い日だから大丈夫」は通用しない。",
     "サウナ施設の水風呂（多くは15〜17℃前後で短時間）と、<b>自然の滝に長時間打たれることは、負荷がまったく違う</b>。"
    ]},
    {type:"h",text:"温度差と心臓——ヒートショック"},
    {type:"list",items:[
     "急激な温度差は血圧を大きく変動させ、心臓・血管に負担をかける。<b>10℃以上の温度差</b>で心筋梗塞・脳卒中・大動脈解離のリスクが高まるとされる。",
     "<b>高齢者、高血圧・糖尿病・動脈硬化・不整脈のある人</b>は特にリスクが高い。",
     "<b>飲酒後は絶対に避ける</b>。成人の溺死の約半数にアルコールが関与しているという報告がある。"
    ]},
    {type:"p",text:"消費者庁が示す入浴事故予防の考え方——急な温度差を作らない、長時間の無理をしない、飲酒後・体調不良時は入らない、<b>一人で行わず周囲に声をかける</b>——は、滝行にも水風呂にもそのまま当てはまります。"},
    {type:"note",text:"本レッスンは<b>一般的な情報であり、医療的助言ではありません</b>。心疾患・高血圧などの持病がある方、体調に不安がある方は、冷水浴の前に必ず医師に相談してください。滝行は必ず経験ある指導者のもとで。<b>迷ったらやらない</b>——それが千年続いた水の文化への、いちばん誠実な向き合い方です。"}

   sources:[

/* ========== 文化学科：ロウリュの精霊とフィンランド神話（中段） ========== */

    {type:"p",text:"フィンランドの民間伝承には、家や建物に宿る守り精霊<b>トントゥ（tonttu）</b>が登場します。灰色の服を着た小さな老人の姿で描かれ、家のトントゥのほかに<b>納屋のトントゥ、そしてサウナのトントゥ（サウナトントゥ）</b>がいた、と伝えられます。"},

     "フィンランド国立博物館の解説では、サウナのトントゥは<b>火の使い方を見守る</b>存在。木造の国で、サウナの火事は命に関わった——精霊は防火の知恵でもあった。",
     "伝承では、騒がない・悪態をつかない・清潔に使う・<b>夜遅くまで居座らず、精霊にも蒸気を楽しませてあげる</b>——そんな作法がトントゥを機嫌よく保つとされた。",
     "クリスマスには<b>お粥を供えて</b>一年の見守りに感謝する習慣も。ちなみにサンタクロースを手伝う「クリスマスのトントゥ」のイメージは19世紀末に広まった比較的新しいものだ。"

    {type:"p",text:"フィンランド外務省が運営する公式メディアには、「母はサウナで行儀よくさせるために、サウナ精霊の話をしてくれた」という証言が載っています。<b>静かに、清潔に、感謝して使う</b>——今もフィンランドのサウナに息づく礼儀は、精霊と一緒に育ってきたのです。"},
    {type:"note",text:"精霊の話は<b>伝承として</b>紹介しています。でも「誰かが見ていると思って丁寧に使う」という知恵は、混み合う日本のサウナ施設でもそのまま役に立ちます。"}

   blocks:[
    {type:"p",text:"サウナストーンに柄杓で水をかける。ジュッという音とともに熱い蒸気が立ちのぼる——この蒸気、そしてこの行為を、フィンランド語で<b>löyly（ロウリュ）</b>と呼びます。日本のサウナで「ロウリュ」と言えばこの文化の輸入です。"},
    {type:"h",text:"言葉の奥にあるもの"},
    {type:"list",items:[
     "löylyの語源は、フィン・ウゴル祖語の<b>*lewle——「魂・精気」を意味する言葉</b>にさかのぼるとされる。同じ祖先を持つハンガリー語のlélek（レーレク）は、今も「魂」を意味する。",
     "現代フィンランド語のlöylyは「サウナの蒸気・熱」の意味。<b>「魂」は語源上の原義</b>であり、日常会話で魂を意味するわけではない——が、蒸気に「息・精気」を重ねた古い世界観が言葉の化石として残っている。",
     "ユネスコ無形文化遺産の公式説明文は、löylyを<b>「熱した石に水をかけて放たれるspirit（精）または蒸気」</b>と紹介している。"

   id:"l39-3", title:"カレワラと熱の文化——叙事詩の中のサウナ",
   blocks:[
    {type:"p",text:"フィンランドには、国の魂と呼ばれる書物があります。民族叙事詩<b>『カレワラ（Kalevala）』</b>——医師エリアス・リョンロートが、カレリア地方に歌い継がれていた古代歌謡や呪文を採集・整理して編んだもので、<b>初版1835年、増補版1849年（全50章・22,795行）</b>。ロシア支配下にあったフィンランド人に民族的自信を与え、独立運動の精神的支えとなり、シベリウスの音楽など芸術に計り知れない影響を残しました。"},
    {type:"h",text:"叙事詩に登場するサウナ"},
    {type:"list",items:[

     "フィンランドのことわざには「サウナと酒とタールで治らなければ、その病は致命的だ」というものがあると伝えられる——サウナは薬局であり、産院であり、祈りの場だった。"
    ]},
    {type:"p",text:"つまりフィンランド人にとってサウナは、単なる入浴設備ではなく、<b>誕生から死までの人生が通過する場所</b>でした。トントゥの伝承（l39-1）、「魂」を語源に持つロウリュ（l39-2）、そしてカレワラの世界——3つを重ねると、ユネスコの言う「自然の教会」の意味が立体的に見えてきます。"},
    {type:"note",text:"叙事詩や伝承の内容は<b>物語として</b>紹介しています。章・行単位の原典解釈には諸説があります。興味が湧いたら、ぜひ『カレワラ』の翻訳（岩波文庫ほか）を手に取ってみてください——サウナの見え方が変わる読書になるはずです。"}

    {type:"list",items:[
     "瞑想・マインドフルネスは<b>不安・ストレス・抑うつの軽減</b>と関連することが複数の研究で示唆されている（2018年のメタ分析では1万2千人超のデータで、不安・抑うつへの効果が認知行動療法に匹敵する場面も報告された）。",
     "マインドフルネスに基づくプログラム（MBSR）で<b>血圧の有意な低下</b>を報告したレビューもある。",
     "実践の基本は<b>呼吸などの感覚に注意を置き、心がさまよったら気づいて戻す</b>——このシンプルな繰り返し。"
    ]},
    {type:"h",text:"同じくらい大事な「限界」"},
    {type:"list",items:[
     "厚生労働省の統合医療情報サイト（eJIM）も米国NCCIHも、<b>「多くの研究は予備的で、科学的に厳密ではない」</b>という留保を明記している。",
     "瞑想は万能ではない。研究参加者の<b>約8%に不安の悪化など否定的な影響</b>が報告された例もある。",
     "<b>瞑想を病気の治療の代わりにしてはいけない</b>。あくまで補完的な方法。"
    ]},
    {type:"note",text:"本章は<b>一般的な情報であり、医療的助言ではありません</b>。心の不調が続く場合は、瞑想やサウナで自己解決しようとせず、医療機関に相談してください。"}
   ],
   sources:[
    {label:"厚生労働省eJIM｜瞑想",url:"https://www.ejim.mhlw.go.jp/public/overseas/c02/07.html",icon:"🏛️"},
    {label:"NIH/NCCIH｜Meditation and Mindfulness",url:"https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety",icon:"🔬"},
    {label:"Focus誌(2018)｜カバット・ジンの定義（PMC）",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC5870875/",icon:"🎓"}
   ],
   quiz:[
    {q:"カバット・ジンによるマインドフルネスの定義は？",choices:["無になって何も考えないこと","意図的に、今この瞬間に、評価判断せずに注意を向けること","未来の目標を強く念じること","眠りに近い状態に入ること"],answer:1,explain:"<b>「意図的に・今この瞬間に・評価判断せずに」注意を向ける</b>こと。無になるのではなく、いま起きていることを判断抜きで観察する心の使い方です。"},
    {q:"瞑想研究への誠実な態度として正しいのは？",choices:["万病に効くと考える","不安・ストレス軽減の示唆はあるが多くの研究は予備的で、治療の代替にはしない","効果は完全に否定されている","8%の人にしか効かない"],answer:1,explain:"eJIMもNCCIHも<b>「効果の示唆はあるがエビデンスには限界がある」「通常医療の代替にしない」</b>と明記。約8%に否定的影響の報告もあり、万能視は禁物です。"}
   ]
  },
  {
   id:"l42-2", title:"サウナと瞑想の接点——強制されたマインドフルネス",
   blocks:[
    {type:"p",text:"サウナ研究のレビュー論文（2018年）に、印象的な表現があります。サウナの心理的効用のメカニズム候補として挙げられた——<b>「強制されたマインドフルネス（forced mindfulness）」</b>。"},
    {type:"h",text:"なぜサウナは瞑想的になるのか"},
    {type:"list",items:[
     "<b>スマホが持ち込めない</b>。100℃の熱と湿気は電子機器の敵。現代人が通知から強制的に切断される数少ない空間だ（デバイスから離れる時間は睡眠・気分・ストレスの改善につながり得る、と大手医療機関も解説する）。",
     "<b>熱が注意を「体」に引き戻す</b>。皮膚の熱さ、心拍、汗、呼吸——強い身体感覚は「今ここ」以外を考えにくくする。カバット・ジンの言う「今この瞬間への注意」が、意志の力なしに起こる。",
     "<b>文化も静けさを支持する</b>。フィンランド政府観光局は「サウナの雰囲気は概して穏やかで静か。競争ではなく自分のペースで」と案内する。ユネスコの言う「自然の教会」（ch39）は、要するに瞑想室でもあった。"
    ]},
    {type:"h",text:"研究は何を示しているか"},
    {type:"list",items:[
     "サウナ浴は<b>リラクゼーションと精神的ウェルビーイングの促進</b>と関連し、ストレスホルモンであるコルチゾールの低下（10〜40%）を報告する研究もある。",
     "フィンランドの中年男性約2,100人を約25年追跡したコホート研究では、<b>週4〜7回サウナに入る人は精神病性障害のリスクが低い</b>という関連が報告された。",
     "ただし——これらの多くは観察研究で、<b>因果関係は未確立</b>。最近の論文も「エビデンスは限定的で、証明された治療ではなく補助的な生活習慣として扱うべき」と釘を刺している。"
    ]},
    {type:"note",cool:true,text:"「サウナで心の病気が防げる」ではなく、<b>「サウナは瞑想が自然に起こりやすい環境で、リラックスとの関連が繰り返し報告されている」</b>——ここまでが、いま科学が言えることです。それで十分に価値があると思いませんか。"}
   ],
   sources:[
    {label:"Hussain & Cohen(2018)｜サウナ浴の系統的レビュー（PMC）",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC5941775/",icon:"🎓"},
    {label:"Laukkanen et al.(2019)｜サウナ頻度と精神疾患リスク（PMC）",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC6422146/",icon:"🎓"},
    {label:"Annals of Medicine and Surgery(2026)｜サウナとメンタルヘルスの留保（PMC）",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12889280/",icon:"🎓"},
    {label:"Visit Finland｜10 sauna tips（静けさの文化）",url:"https://www.visitfinland.com/en/articles/10-sauna-tips-for-beginners/",icon:"🇫🇮"},
    {label:"Cleveland Clinic｜デジタルデトックスの利点",url:"https://health.clevelandclinic.org/digital-detox",icon:"⚕️"}
   ],
   quiz:[
    {q:"サウナ研究のレビューで心理的効用の説明に使われた表現は？",choices:["強制されたマインドフルネス（forced mindfulness）","人工的な冬眠","高温トランス","熱波ハイ"],answer:0,explain:"スマホも仕事も持ち込めず、強い身体感覚が注意を「今ここ」に引き戻す——サウナの環境が<b>半ば自動的にマインドフルネス状態を作る</b>という考え方です。"},
    {q:"サウナとメンタルヘルスの研究の現在地は？",choices:["精神疾患の治療法として確立済み","リラックスとの関連やコルチゾール低下の報告はあるが、多くは観察研究で因果は未確立","一切効果がないと証明された","フィンランドでのみ有効"],answer:1,explain:"<b>「関連の報告はあるが、証明された治療ではない」</b>が誠実な現在地。補助的な生活習慣として楽しむのが正解です。"}
   ]
  },
  {
   id:"l42-3", title:"無理なく深める実践——呼吸・水分・撤退の勇気",
   blocks:[
    {type:"p",text:"では実際に、サウナを「動く瞑想」にしてみましょう。特別な技術は要りません。<b>体調が最優先</b>——それだけが絶対のルールです。"},
    {type:"h",text:"シンプルな実践法"},
    {type:"list",items:[
     "<b>呼吸を数える</b>：鼻からゆっくり吸って、さらにゆっくり吐く。「吐く」を1と数え、10まで数えたら1に戻る。雑念が湧いたら（必ず湧きます）責めずに1へ戻るだけ。",
     "ゆっくりした呼吸（<b>毎分10回未満</b>）は副交感神経の働きを高め、心拍のゆらぎ（HRV）を増やし、リラックス感の増加と関連することが研究レビューで示されている。",
     "<b>体の感覚を順に観察する</b>：足裏の熱、背中の汗、心拍の音。「熱い」と判断せず「熱がある」と観察する——これがカバット・ジンの言う「評価判断せずに」の練習。",
     "<b>時計や我慢と競わない</b>。「12分入れた」は瞑想ではなくただの我慢比べ。"
    ]},
    {type:"h",text:"安全の型（これだけは守る）"},
    {type:"list",items:[
     "<b>水分補給が先</b>。1回のサウナ浴で300〜600mlの汗をかくが、一度に吸収できる水分は約200ml。日本サウナ・スパ協会の「ととのう2.0」は<b>「水分補給→サウナ→水風呂→休憩」</b>の順を推奨する。",
     "サウナ事故の多くは<b>立ちくらみによる転倒や体調不良</b>が原因。立ち上がるときはゆっくり。",
     "消費者庁も「体調等を踏まえて無理のない利用を」と注意喚起している。<b>めまい・動悸・気分不良を感じたら、その瞬間に退出</b>。異変時は周囲や従業員にすぐ知らせる。",
     "深呼吸といっても<b>過換気（速く激しい呼吸）は厳禁</b>。ヴィム・ホフの章（ch35）で学んだ通り、過換気と水風呂の組み合わせは失神・溺水のリスクがある。"
    ]},
    {type:"note",text:"本レッスンは<b>一般的な情報であり、医療的助言ではありません</b>。心疾患・高血圧など持病のある方、体調不良時・飲酒時はサウナに入らないでください。瞑想は椅子の上でもできます——<b>今日の体調で選ぶ</b>のが、いちばん深い「ととのい」です。"}
   ],
   sources:[
    {label:"Zaccaro et al.(2018)｜ゆっくりした呼吸の生理学レビュー（PMC）",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC6137615/",icon:"🎓"},
    {label:"厚生労働省eJIM｜リラクゼーション法",url:"https://www.ejim.mhlw.go.jp/public/overseas/c02/11.html",icon:"🏛️"},
    {label:"日本サウナ・スパ協会｜ととのう2.0",url:"https://sauna.or.jp/jsa/new-routine/",icon:"♨️"},
    {label:"消費者庁｜サウナ浴での事故に注意（2024）",url:"https://www.caa.go.jp/policies/policy/consumer_safety/caution/caution_076/",icon:"🏛️"}
   ],
   quiz:[
    {q:"サウナ瞑想の実践として適切なのは？",choices:["限界まで長く入って集中力を試す","ゆっくりした呼吸を数え、体の感覚を評価せずに観察し、異変を感じたら即退出","過換気してから水風呂に入る","時計を見て記録更新を目指す"],answer:1,explain:"<b>ゆっくり呼吸＋感覚の観察＋撤退の勇気</b>がセット。我慢比べは瞑想ではなく、過換気→水風呂は失神リスクのある危険な組み合わせです。"},
    {q:"「ととのう2.0」（日本サウナ・スパ協会）が推奨する順番は？",choices:["サウナ→水風呂→休憩→水分補給","水分補給→サウナ→水風呂→休憩","水風呂→サウナ→休憩","休憩→サウナ→水風呂"],answer:1,explain:"<b>最初に水分補給</b>。1回で300〜600ml発汗するのに一度に吸収できるのは約200ml。事故の多くは立ちくらみ・体調不良が原因です。"}
   ]
  }
 ]

   blocks:[
    {type:"note",warn:true,text:"<b>この章は「安全」から始めます。</b>テントサウナ内で薪ストーブを使うと、不完全燃焼で一酸化炭素（CO）が発生し、密閉空間では死亡に至る中毒事故が起こりえます。COは無色無臭で気づけず、症状が出た時には自力で逃げられないことがあります。"},
    {type:"h",text:"CO濃度と体への影響（目安）"},
    {type:"list",items:[
     "<b>約200ppm</b>：2〜3時間で軽い頭痛。この付近から中毒症状が出始めるとされる。",
     "<b>約600ppm</b>：激しい頭痛・吐き気・嘔吐、やがて運動能力を失う。",
     "<b>約1,000ppm以上</b>：頻脈・意識障害。短時間で昏睡に至る。"
    ]},
    {type:"p",text:"発電機や七輪を屋内で使うと短時間で高濃度に達することが公的機関から警告されています（労働安全衛生総合研究所）。テント内の薪ストーブも同じリスク構造です。"},
    {type:"h",text:"3つの生命線"},
    {type:"list",items:[
     "<b>換気の徹底</b>：吸気口を必ず開ける。セットの合間に換気タイム。<b>薪をくべる時は必ず出入り口を開ける</b>（投入時にCOが室内へ流れ込みやすい）。",
     "<b>COアラーム（一酸化炭素チェッカー）を必携</b>：被害が出やすい200ppmに達する前に鳴る製品を、頭の高さと天井付近に。",
     "<b>強風時は中止</b>：風速5m以上は排気逆流のリスクがあり使用を止める。"
    ]},
    {type:"note",warn:true,text:"COアラームは「あれば安心」ではなく<b>必携の命綱</b>です。頭痛・めまい・吐き気を感じたら、迷わず全員すぐに外へ。判断が遅れると動けなくなります。"}
   ],
   sources:[
    {label:"東京消防庁｜一酸化炭素中毒事故に注意",url:"https://www.tfd.metro.tokyo.lg.jp/lfe/nichijo/co.html",icon:"🚒"},
    {label:"労働安全衛生総合研究所｜一酸化炭素中毒（七輪・小型内燃機関）",url:"https://www.jniosh.johas.go.jp/publication/doc/issankatanso_tyudoko.pdf",icon:"🏛️"},
    {label:"SaunaCamp.｜テントサウナ安全ガイドライン",url:"https://saunacamp.net/magazine/safety-guideline1/",icon:"⛺"}

   quiz:[
    {q:"一酸化炭素（CO）の特徴として正しいのは？",choices:["刺激臭ですぐ気づく","無色無臭で気づけず、症状が出ると逃げられないことがある","目が痛くなるので分かる","煙が見える"],answer:1,explain:"<b>無色無臭</b>が最大の恐ろしさ。だからこそ換気の徹底とCOアラームの携行が命綱になります。"},
    {q:"薪をテントストーブにくべる時の鉄則は？",choices:["出入り口を閉めて熱を逃さない","必ず出入り口を開けて換気した状態で行う","素早く閉めれば問題ない","風が強い日にやる"],answer:1,explain:"薪投入時はCOが室内へ流れ込みやすいので<b>必ず開放・換気した状態</b>で。強風時（風速5m以上）は使用中止です。"}
   ]
  },
  {
   id:"l40-2", title:"やけど・火災を防ぐ——熱との距離",
   blocks:[
    {type:"p",text:"COの次に備えるのは、やけどと火災です。全力燃焼時、煙突は数百℃に達し、テント生地や周囲の木に触れれば発火します。"},
    {type:"list",items:[
     "<b>煙突の遮熱</b>：煙突がテント生地を貫通する部分には煙突ガードや遮熱シートで空間を確保する。",
     "<b>離隔距離</b>：ストーブ本体も高温。着替え・タオルなど可燃物は<b>ストーブから1m以上</b>離す。芝生の上では防炎シートを敷く。",

    {type:"p",text:"参考までに、建物向けの火災予防条例では煙突を可燃材料から15cm以上離す規定があります。テントは建物より脆いので、より慎重な離隔を心がけましょう。"},
    {type:"note",text:"「熱を楽しむ道具は、扱いを誤れば火事の道具になる」。この緊張感を忘れない人だけが、テントサウナを長く安全に楽しめます。"}

  {
   id:"l40-3", title:"道具と場所——始めるための基礎",
   blocks:[
    {type:"p",text:"安全の土台を学んだら、いよいよ道具と場所です。テントサウナの主要構成は<b>①テント本体 ②薪（または電気）ストーブ ③煙突 ④サウナストーン</b>の4つ。"},
    {type:"h",text:"選び方の目安"},
    {type:"list",items:[

     "予約時に「テントサウナ持ち込み」「川を水風呂に使いたい」を事前相談し、排水・煙対策を確認。",
     "増水・浸水しない場所を選ぶ。煙・音・入水は近隣に配慮。"
    ]},
    {type:"note",text:"経営学部で学んだ通り、<b>参加費を取って営業するなら公衆浴場法の許可が必要</b>です（文化・DIYとして自分で楽しむ範囲と、事業は分けて考えましょう）。"},
    {type:"note",text:"本章は<b>一般的な情報であり法的助言ではありません</b>。営業の可否や許可の要否は、必ず管轄保健所にご確認ください。"}

    {type:"p",text:"丸太を組んだ樽（barrel）型のサウナは、フィンランド由来のマイサウナの定番です。なぜこの形なのでしょうか。"},
    {type:"list",items:[
     "<b>熱と蒸気の循環効率</b>：円筒形はデッドスペースが少なく、ロウリュの蒸気が室内に均等に広がりやすい。暖まりも速い傾向。",

     "<b>価格の目安</b>：設置費用は100〜150万円程度が目安。国産木材で200万円超も。本体のみなら数十万円台からという事業者もある（すべて目安）。"
    ]},
    {type:"p",text:"弱点も知っておきましょう。多くのバレルサウナは<b>木材のみの構成で断熱材・防湿シートがなく</b>、外気温の影響を受けやすい。氷点下の地域では温度が上がりにくく、暖機に時間がかかります。設置環境に合った選択が大切です。"},
    {type:"note",text:"バレルサウナやストーブ、サウナストーンは、サウナ大学トップの<b>「本棚」</b>とも相性が良い分野。買い物の前にこの章で基礎を押さえると、後悔のない選択ができます。"}

   blocks:[
    {type:"note",warn:true,text:"<b>電気工事は必ず有資格の専門業者へ。</b>200Vの配線工事を無資格で行うことは法律で禁じられており、火災・感電の重大リスクがあります。DIYでできる範囲と、プロに任せる範囲を明確に分けてください。"},
    {type:"h",text:"3つの技術ポイント"},
    {type:"list",items:[
     "<b>電源</b>：小型電気ストーブ（1.6〜2kW）は100V製品もあるが、本格運用は200V推奨。200V化は電気工事が必須で、契約アンペアの見直し（目安40〜60A）や専用配線・漏電対策が必要。",
     "<b>断熱</b>：グラスウールやポリスチレンフォームが一般的（材料費の目安1〜3万円）。施工不良で熱効率が30〜50%低下することもある。",
     "<b>防水・防湿／換気</b>：防湿処理が不十分だと2〜3年でカビ・腐食のリスク。換気は快適性だけでなく<b>酸欠・CO中毒防止に直結</b>するため必須。"
    ]},
    {type:"p",text:"費用の目安は、屋内DIYで10〜40万円程度、屋外小屋タイプの完全DIYで約17〜47万円程度という情報があります（内容により大きく変動・目安）。安さだけで断熱や換気を削ると、光熱費とカビで結局高くつきます。"},
    {type:"note",text:"「自作できる部分（内装・棚・断熱の一部）」と「プロに任せる部分（電気・排水・構造）」を切り分けるのが、安全で満足度の高いDIYの鉄則です。"}

  {
   id:"l41-3", title:"長く使う——メンテナンスの習慣",
   blocks:[
    {type:"p",text:"サウナは作って終わりではありません。木とストーブは、手をかけた分だけ長持ちします。木材劣化の最大の敵は湿度です。"},
    {type:"h",text:"毎回・定期の手入れ"},

     "<b>1〜2年に1回</b>の防腐・防カビ・撥水塗装が推奨される。",
     "長期未使用時、雨季は定期換気で湿気を出す。乾燥する冬は室内に水を入れたコップを置き、木材の乾燥割れを防ぐ。",

    {type:"note",text:"メンテナンス用品（木部用塗料・ブラシ・交換用ストーンなど）も「本棚」で扱える分野です。買って終わりでなく、長く付き合う道具として紹介できます。"}

/* ========== 建築DIY学科：サウナ小屋の本格DIY（ストーブ前） ========== */
{
 id:"ch43", tier:"t4", icon:"🏠", accent:"var(--gold)",
 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-17.jpg", photoAlt:"サウナ室内から雪山を望む眺め",

 lessons:[
  {
   id:"l43-1", title:"計画と法規——「10㎡以下なら自由」は誤解",
   blocks:[
    {type:"note",warn:true,text:"<b>⚠ このレッスンは一般的な情報であり、法的助言ではありません。</b>建築規制は敷地の条件（都市計画区域・防火地域など）と自治体で大きく異なります。<b>着工前に必ず自治体の建築指導課へ相談してください</b>。無申請の建築は違反建築物として、使用禁止・撤去命令の対象になり得ます。"},
    {type:"h",text:"サウナ小屋は「建築物」である"},
    {type:"p",text:"建築基準法2条1号は、建築物を<b>「土地に定着する工作物のうち、屋根及び柱若しくは壁を有するもの」</b>と定義しています。プレハブ物置やカーポートでさえ建築物——基礎の上に建てるサウナ小屋は、まぎれもなく建築物です。"},
    {type:"h",text:"よくある誤解——「10㎡以下なら確認申請不要」"},
    {type:"list",items:[
     "確認申請を省略できる10㎡以内の特例（法6条2項）が使えるのは<b>「増築・改築・移転」だけ。新築には適用されません</b>。庭に初めてサウナ小屋を建てるのが「新築」扱いなら、面積に関係なく原則申請が必要です。",
     "さらにこの特例は<b>防火地域・準防火地域の「外」</b>であることが条件。防火・準防火地域内なら10㎡以内の増築でも申請が必要。",
     "既存の家がある敷地への「増築」（用途上不可分の離れ等）と扱えるかは、敷地・用途の条件次第。<b>ここの判断こそ自治体に聞くべきポイント</b>。",
     "<b>都市計画区域・準都市計画区域などの「外」</b>（山林・原野など）では、小規模な平屋は確認申請の対象外になる場合がある（法6条1項3号）。ただし申請不要でも<b>建蔽率や構造基準など建築基準法への適合義務は残る</b>。"
    ]},
    {type:"p",text:"2025年4月の法改正で確認申請の区分（旧「四号建築物」）が変わり、古いDIY記事の情報は当てになりません。<b>2026年7月時点では「新築は原則申請が必要。例外に当たるかは役所で確認」</b>が正しい出発点です。経営学部・法律の章（ch30）で学んだ「先に役所」の原則は、自宅サウナでも同じです。"},
    {type:"note",text:"自治体の建築指導課（建築安全課）には無料相談窓口があるのが普通です。<b>図面の落書きレベルでいいので、建てる前に持って行く</b>——これが最強の失敗回避術です。"}

    {q:"サウナ小屋を建てる前の正しい行動は？",choices:["SNSの作例を真似てすぐ着工","自治体の建築指導課に事前相談する","完成後に報告すればよい","10㎡以下に設計すれば何もしなくてよい"],answer:1,explain:"<b>着工前に自治体の建築指導課へ相談</b>。多くの自治体が無料相談窓口を設けており、敷地条件ごとの申請要否を確認できます。無申請は撤去命令のリスクも。"}

  {
   id:"l43-2", title:"基礎と構造——小屋は足元から腐る",
   blocks:[
    {type:"p",text:"サウナ小屋の寿命を決めるのは、見えない部分——<b>基礎と壁の中</b>です。DIY小屋の基礎には主に3つの選択肢があります。"},
    {type:"h",text:"基礎の3類型"},
    {type:"list",items:[
     "<b>束石（独立基礎）</b>：点で支える最も手軽な方式。目安として約1.2m間隔で配置し、転圧した砕石＋捨てコンクリートの上に据える。小規模な小屋のDIY定番。",
     "<b>コンクリートブロック基礎</b>：最安（工事なら15㎡で7〜10万円目安）だが、耐震性・防湿性に劣り、重い建物には不向き。",
     "<b>ベタ基礎</b>：底面全体を鉄筋コンクリートにする方式。耐震・防湿とも最良だが高コスト（15㎡で18〜20万円目安）。ストーブや水回りを本格的に据えるなら検討価値あり。"
    ]},
    {type:"h",text:"サウナ特有の敵——壁内結露"},
    {type:"p",text:"サウナ室は「100℃近い熱気と大量の蒸気」を毎回発生させる特殊環境。断熱材が湿気を吸うと性能が落ち、壁の中でカビと腐朽が進みます。だからサウナの壁は<b>「断熱材＋室内側の防湿層」のセット</b>が鉄則です。"},
    {type:"list",items:[
     "断熱材はグラスウールかロックウールが定番。日本のサウナ室の標準的仕様は<b>厚さ25mm以上・密度24kg/m³以上</b>とされる。耐熱・耐湿で選ぶなら<b>ロックウール</b>（融点約1,177℃）が有力。",
     "室内側に<b>アルミ箔系の防湿シート（サウナ用アルミバリアなどと呼ばれる）</b>を張り、蒸気を壁内に入れない。市販のサウナ用パネルも「内装材＋断熱材25mm＋アルミ防湿シート＋合板」という層構成になっている。",
     "<b>ストーブ周りの壁・天井はケイカル板・タイル・レンガ等の不燃材仕上げ</b>に。木の温もりは大事だが、火の近くは別ルール。"
    ]},
    {type:"note",text:"断熱・気密は「快適さ」のためだけではありません。熱が逃げる小屋はストーブが過労働になり、<b>薪代・電気代と昇温時間が跳ね上がります</b>。壁の中への投資は、毎回のサウナ体験への投資です。"}
   ],
   sources:[

    {label:"DIY TIMES｜小屋の基礎（束石）の作り方",url:"https://www.diy-times.com/kiso.html",icon:"🔨"},

   id:"l43-3", title:"ストーブと安全——消防・煙突・CO",
   blocks:[
    {type:"note",warn:true,text:"<b>⚠ 薪ストーブは「置くだけ」では済みません。</b>火災予防条例の届出、離隔距離、煙突の設計、一酸化炭素（CO）対策——テントサウナの章（ch40）で学んだCOの怖さは、小屋でも変わりません。<b>CO警報器の設置を強く推奨します</b>。"},
    {type:"h",text:"消防への届出"},
    {type:"list",items:[
     "薪ストーブなど火を使用する設備の設置は、<b>市町村の火災予防条例に基づく届出の対象</b>になり得る。例えば東京消防庁では<b>設置の7日前までに届出</b>し、使用開始前に検査を受ける。",
     "東京消防庁の届出対象リストには<b>「サウナ設備」が明記されている</b>。サウナストーブはまさに対象設備。",
     "届出要否・基準は自治体で異なる。<b>所轄の消防署への事前確認は必須</b>。"
    ]},
    {type:"h",text:"離隔距離と煙突——数字で守る"},
    {type:"list",items:[
     "可燃物からの離隔距離の例（広島県北広島町の条例基準）：<b>上方1.5m・前方1.5m・側方1m・後方1m</b>。数値は自治体・機器で異なるため、条例とメーカー施工基準の両方を確認。",
     "煙突は建築物の可燃部分から<b>15cm以上</b>離す。壁を貫通させる部分は<b>めがね石など厚さ10cm以上の不燃材料（金属以外）</b>で被覆する。",
     "屋外の煙突は<b>断熱二重煙突</b>が原則。シングル煙突は外気で排気が冷え、上昇気流（ドラフト）が弱まって不完全燃焼や煙の逆流を招く。天井裏・小屋裏の中で煙突を接続しないこと。",
     "木材は長期間熱を受け続けると<b>約100〜150℃でも発火し得る（低温着火）</b>。「触って熱くないから大丈夫」は通用しない。"
    ]},
    {type:"p",text:"そして煙突は<b>年1〜2回の煤・タール清掃</b>を。煙突内のタールに引火する「煙突火災」は、手入れ不足の薪ストーブの典型事故です。"},
    {type:"note",text:"本レッスンは一般的な情報です。具体的な設置計画は<b>所轄消防署とメーカー（または施工店）に必ず確認</b>してください。火のあるDIYは、プロの目を入れるほど安くつきます。"}
   ],
   sources:[
    {label:"東京消防庁｜火を使用する設備等の設置届出",url:"https://www.tfd.metro.tokyo.lg.jp/drs/ss_04/003.html",icon:"🚒"},
    {label:"北広島町｜薪ストーブ等の設置に関する火災予防条例",url:"https://www.town.kitahiroshima.lg.jp/site/fire/2829.html",icon:"🏛️"},
    {label:"丹波篠山市消防本部｜煙突・貫通部の基準",url:"https://www.city.tambasasayama.lg.jp/soshikikarasagasu/shobouhombu/yobouka/1350.html",icon:"🚒"},
    {label:"ダッチウエストジャパン｜煙突の基礎知識",url:"https://www.dutchwest.co.jp/howto/pipe/",icon:"🏭"},
    {label:"totonoü｜薪ストーブの一酸化炭素・火災Q&A",url:"https://totonou.co/blogs/sauna-knowledge/trouble",icon:"🔥"}
   ],
   quiz:[
    {q:"薪ストーブ設置と消防の関係で正しいのは？",choices:["個人宅なら消防は無関係","火災予防条例に基づく届出の対象になり得る（東京消防庁は設置7日前までに届出）","事後報告でよい","電気ストーブより規制が緩い"],answer:1,explain:"火を使用する設備は<b>市町村の火災予防条例による届出対象</b>になり得ます。東京消防庁の対象リストには<b>サウナ設備も明記</b>。所轄消防署への事前確認が必須です。"},
    {q:"屋外の煙突に断熱二重煙突を使う理由は？",choices:["見た目が高級だから","排気を高温に保ちドラフト（上昇気流）を維持して、不完全燃焼や煙の逆流を防ぐため","軽いから","法律で色が決まっているから"],answer:1,explain:"シングル煙突は外気で排気が冷えて<b>ドラフトが弱まり、不完全燃焼＝CO発生や煙の逆流</b>につながります。屋外は断熱二重煙突が原則です。"}
   ]
  },
  {
   id:"l43-4", title:"木材と内装——ベンチは「ヤニなし・熱くなりにくい」",
   blocks:[
    {type:"p",text:"最後は木材選び。サウナの内装材は「好きな木」ではなく、<b>熱と湿気と素肌</b>という条件から逆算して選びます。"},
    {type:"h",text:"適材適所の基本"},
    {type:"list",items:[
     "<b>壁・天井の定番はスプルースやパイン</b>——フィンランドのサウナで最もよく使われる軽軟な針葉樹。",
     "<b>ベンチ材の条件は2つ：ヤニ（樹脂）を出さないこと、熱くなりにくいこと</b>（密度が低く熱伝導が小さい木）。素肌が直接触れる場所だから。",
     "ベンチの定番は<b>アバチ</b>。熱くなりにくく無臭で、国内大手サウナメーカーのメトスも「比較的熱を持ちにくい」としてベンチに採用している。<b>アスペン</b>も表面が熱くなりにくくベンチ向き。",
     "<b>パインは安価だがヤニが出やすいグレードがあり、ベンチなど高温部への使用は注意</b>。節（ふし）はヤニ壺になりやすく、内装・ベンチには節のない「無節」材を使うのが慣行。",
     "<b>レッドシダー</b>は防腐・耐湿性が高く香りも良いが、香りが強めで高価。<b>ヒノキ</b>は水湿に強い日本の良材で、和のサウナに好相性。"
    ]},
    {type:"p",text:"なぜ「熱くなりにくい木」なのか。100℃のサウナで金属に触れば火傷しますが、木のベンチに座れるのは<b>木の熱伝導率が低い</b>から。同じ理屈で、密度の高い広葉樹より、軽い針葉樹・軟材のほうが肌あたりが優しいのです。"},
    {type:"note",cool:true,text:"ここまでで建築DIY学科は修了です。テント（ch40）→バレル（ch41）→小屋（ch43）と学んだあなたは、もう「なんとなく」でサウナを作らない人。<b>火と法律に敬意を払うビルダー</b>こそ、いちばん長くサウナを楽しめます。"}
   ],
   sources:[
    {label:"メトス公式｜プライベートサウナ（ベンチにアバチ採用）",url:"https://metos.co.jp/pages/home-sauna",icon:"🏭"},
    {label:"キモティ｜サウナに最適な木材7選",url:"https://kimoty.com/contents/home-indoor/wood/",icon:"🪵"},
    {label:"Saunology｜サウナと木材",url:"https://saunology.hatenablog.com/entry/sauna-making01",icon:"📚"}
   ],
   quiz:[
    {q:"サウナのベンチ材に求められる条件は？",choices:["硬くて重い高級木材","ヤニを出さず、熱くなりにくい（低密度・低熱伝導）","香りが強いほど良い","金属より熱を伝えること"],answer:1,explain:"素肌が触れるベンチは<b>ヤニなし・熱くなりにくい</b>が絶対条件。定番はアバチやアスペン。パインはヤニが出るグレードがあり高温部には注意です。"},
    {q:"フィンランドのサウナで壁材の定番とされるのは？",choices:["オークとチーク","スプルースとパイン","マホガニーと黒檀","竹と杉のみ"],answer:1,explain:"<b>スプルースやパイン</b>という軽軟な針葉樹が壁・天井の定番。ベンチには熱くなりにくいアバチやアスペンを使い分けます。"}
   ]
  }
 ]
},
/* ========== はじめてのサウナ 完全ガイド（初級） ========== */
{
 id:"ch16", tier:"t1", icon:"🚪", accent:"var(--calm)",
 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-13.jpg", photoAlt:"暖色照明の無人サウナ室内",
 title:"はじめてのサウナ 完全ガイド", subtitle:"デビュー前に読む3レッスン",
 desc:"受付から退館までの流れ、熱さ・水風呂の壁の越え方、最初の一軒の選び方。",
 lessons:[
  {
   id:"l16-1", title:"受付から退館まで——当日の流れ",
   blocks:[
    {type:"p",text:"初めてのサウナ施設は、勝手がわからないだけで緊張するもの。でも流れさえ知っていれば、何も怖くありません。一般的なサウナ施設の1日をシミュレーションしましょう。"},
    {type:"h",text:"当日の流れ"},
    {type:"list",items:[
     "<b>①受付</b>：料金を払い、ロッカーキーやタオルセットを受け取る。館内着があるスパ型と、ないシンプル型がある。",
     "<b>②脱衣所</b>：服も貴重品もロッカーへ。スマホの浴場持ち込みは基本NG。",
     "<b>③体を洗う</b>：サウナの前に必ず全身を洗う。これは絶対のマナー。",
     "<b>④サウナ→水風呂→外気浴</b>：第3章で学ぶ基本の3ステップを2〜3セット。",
     "<b>⑤水分補給→退館</b>：脱水した体に水分を。湯冷めに注意して帰宅。"
    ]},
    {type:"h",text:"持ち物は意外と少ない"},
    {type:"p",text:"必須なのはタオルだけ（施設でレンタルできる場合がほとんど）。慣れてきたらサウナハットやマイマットを足せばOK。手ぶらで行ける施設が多いのも、サウナの良いところです。"},
    {type:"note",text:"<b>体を拭いてから水風呂・サウナ室へ</b>。汗を流さず水風呂に入る「汗カット」は最も嫌われるマナー違反。逆にこれさえ守れば、初心者が白い目で見られることはまずありません。"}
   ],
   sources:[
    {label:"るるぶ｜サウナの入り方の基本",url:"https://rurubu.jp/andmore/article/24191",icon:"📘"},
    {label:"ハートウェル｜サウナのマナーとアイテム",url:"https://hartwell.co.jp/blogs/hartwell_voice/0095",icon:"🧴"}
   ],
   quiz:[
    {q:"サウナ室に入る前に必ずすべきことは？",choices:["準備運動","全身を洗う","サウナハット購入","飲酒"],answer:1,explain:"<b>体を洗う</b>のが絶対のマナー。清潔な状態でサウナへ入りましょう。"},
    {q:"初めてのサウナで最低限必要な持ち物は？",choices:["サウナハット一式","タオル（レンタル可の施設も多い）","水着","サンダル"],answer:1,explain:"<b>タオルだけ</b>で十分。多くの施設でレンタルもでき、手ぶらデビューも可能です。"}
   ]
  },
  {
   id:"l16-2", title:"「熱い」「冷たい」の壁の越え方",
   blocks:[
    {type:"p",text:"サウナ挫折の二大原因は「熱すぎて無理」と「水風呂が怖い」。どちらも、正しい攻略法があります。"},
    {type:"h",text:"熱さの壁——下段から始めよう"},
    {type:"list",items:[
     "サウナ室は<b>上段ほど熱く、下段ほどマイルド</b>（温かい空気は上に昇るため）。初心者は迷わず下段へ。",
     "時間は5〜6分からでOK。「12分計を1周」は上級者の話。",
     "背中の真ん中が温まったら出る合図。我慢大会ではありません。",
     "どうしても熱が苦手なら、低温のミストサウナや塩サウナから始める手も。"
    ]},
    {type:"h",text:"水風呂の壁——羽衣を信じる"},
    {type:"list",items:[
     "かけ湯・かけ水で体を慣らしてから、<b>息を吐きながら</b>ゆっくり入る。",
     "入ったら動かない。数十秒で体温で温まった水の膜「羽衣」ができて、ふっと楽になります。",
     "最初は10〜20秒でも十分。「冷たい」が「気持ちいい」に変わる日が必ず来ます。",
     "心臓や血圧に不安があれば、水風呂を省いて外気浴だけでもOK（加藤医師も容認しています）。"
    ]},
    {type:"note",cool:true,text:"合言葉は<b>「無理をしない人が、いちばん上手にととのう」</b>。つらさに耐えるほど効果が上がる、という科学的根拠はありません。"}
   ],
   sources:[
    {label:"加藤容崇『医者が教えるサウナの教科書』（Amazon）",url:"https://www.amazon.co.jp/dp/447811031X?tag=gomirachelin-22",icon:"📕"},
    {label:"るるぶ｜サウナの入り方と注意点",url:"https://rurubu.jp/andmore/article/24191",icon:"📘"}
   ],
   quiz:[
    {q:"熱さが苦手な初心者がサウナ室で座るべき場所は？",choices:["最上段","ストーブの真横","下段","立って入る"],answer:2,explain:"温かい空気は上に昇るので<b>下段がいちばんマイルド</b>。初心者の定位置です。"},
    {q:"水風呂で「羽衣」を作るコツは？",choices:["激しく泳ぐ","入ったら動かずじっとする","顔から入る","目を閉じない"],answer:1,explain:"<b>動かずじっとする</b>と体温で温まった水の膜ができ、冷たさがやわらぎます。"}
   ]
  },
  {
   id:"l16-3", title:"最初の一軒の選び方",
   blocks:[
    {type:"p",text:"デビュー戦の施設選びは大事です。いきなり100℃超の玄人向け施設に行くと、サウナ嫌いになって帰ってくることも。段階を踏みましょう。"},
    {type:"h",text:"おすすめのステップアップ"},
    {type:"list",items:[
     "<b>STEP1 銭湯サウナ</b>：東京なら入浴550円＋サウナ料金で計1,000円前後。コンパクトで気軽、地元の雰囲気も味わえる。",
     "<b>STEP2 スーパー銭湯</b>：750〜1,500円前後。休憩スペースや食事処が充実していて、初心者や家族連れに最適。",
     "<b>STEP3 サウナ専用施設</b>：1,500〜3,700円程度。ロウリュ・アウフグースなど本格体験へ。",
     "<b>番外編 個室サウナ</b>：1時間4,000円前後〜。人目が気になる人はここからデビューする手も。"
    ]},
    {type:"h",text:"行く前のチェックポイント"},
    {type:"list",items:[
     "<b>男性専用施設に注意</b>：老舗サウナ施設には男性専用が多い。女性は公式サイトで要確認。",
     "<b>混雑時間</b>：平日昼や開店直後が狙い目。週末夜はどこも混みます。",
     "<b>タトゥーの可否</b>や年齢制限も施設ごとに違います。"
    ]},
    {type:"note",text:"迷ったら<b>「家か職場から近い施設」</b>を。サウナ総研の調査でも、施設リピートの理由1位は9年連続で「距離」（38%）。近さは正義です。"}
   ],
   sources:[
    {label:"東京都浴場組合｜入浴料金のお知らせ",url:"https://www.1010.or.jp/mag-topic-240722/",icon:"♨️"},
    {label:"日本サウナ総研｜日本のサウナ実態調査2026",url:"https://kyodonewsprwire.jp/release/202603065228",icon:"📊"}
   ],
   quiz:[
    {q:"サウナデビューに最も手頃な価格帯の施設は？",choices:["高級ホテルサウナ","銭湯サウナ（計1,000円前後）","会員制サウナ","貸切アウトドアサウナ"],answer:1,explain:"<b>銭湯サウナ</b>なら東京で計1,000円前後。気軽さナンバーワンです。"},
    {q:"サウナ総研の調査で、施設をリピートする理由の9年連続1位は？",choices:["料金","有名人が来る","家・職場からの距離","サウナ室の広さ"],answer:2,explain:"<b>距離</b>（38%）。結局、人は近いサウナに通うのです。"}
   ]
  }
 ]

/* ========== 第1章 サウナのはじまり ========== */
{
 id:"ch1", tier:"t1", num:"01", icon:"🔥", accent:"var(--gold)",
 photo:"https://sauna-cospa.com/wp-content/uploads/2026/07/sauna-univ-03.jpg", photoAlt:"雪深い松林に建つ赤い丸太小屋の薄暮",
 title:"サウナのはじまり", subtitle:"歴史と文化",
 desc:"フィンランド発祥からユネスコ無形文化遺産、日本の3度のブームまで。",
 lessons:[
  {
   id:"l1-1", title:"サウナ発祥の地・フィンランド",
   blocks:[
    {type:"p",text:"サウナの発祥はフィンランド。その起源は諸説ありますが、約2,000〜6,000年前までさかのぼるとされます。もともとは食料を貯蔵したり燻製をつくる部屋だったものが、体を清める沐浴の場へと変わっていったという説が有力です。"},
    {type:"h",text:"世界一のサウナ大国"},
    {type:"p",text:"フィンランドは、人口に対するサウナの数が世界で最も多い国です。ユネスコの登録記載によれば、人口約550万人の国に約330万個のサウナがあるとされ、ほぼすべての人が日常的にサウナへアクセスできる環境にあります。家庭のアパートにも個人用サウナがあるのが当たり前という、まさに“国民の文化”です。"},
    {type:"statbig",items:[{b:"約550万人",s:"フィンランドの人口"},{b:"約330万個",s:"国内のサウナの数"},{b:"2,000年+",s:"サウナの歴史"}]},
    {type:"note",text:"<b>原型はスモークサウナ</b>。煙突を持たず、薪を燃やして室内に煙を充満させ、煙を出してから入る伝統的なサウナが最も古い形とされます。"}
   ],
   sources:[
    {label:"UNESCO 無形文化遺産（Sauna culture in Finland, No.01596）",url:"https://ich.unesco.org/en/RL/sauna-culture-in-finland-01596",icon:"🌍"},
    {label:"ニフティ温泉｜フィンランド式サウナの魅力",url:"https://onsen.nifty.com/onsen-matome/230624719883/",icon:"♨️"}
   ],
   quiz:[
    {q:"サウナ発祥の地はどこ？",choices:["ロシア","フィンランド","ドイツ","日本"],answer:1,explain:"サウナの発祥地は<b>フィンランド</b>。約2,000〜6,000年前が起源とされています。"},
    {q:"フィンランドのサウナの数として、ユネスコ記載に近いのは？",choices:["約33万個","約330万個","約3,300万個","約3,300個"],answer:1,explain:"人口約550万人に対し、<b>約330万個</b>のサウナがあるとされます。ほぼ2人に1個以上の計算です。"}
   ]
  },
  {
   id:"l1-2", title:"世界遺産になったサウナ文化",
   blocks:[
    {type:"p",text:"2020年12月17日、フィンランドのサウナ文化がユネスコの無形文化遺産（人類の無形文化遺産の代表的な一覧表）に登録されました。フィンランドにとって初めての無形文化遺産の登録です。"},
    {type:"p",text:"ユネスコは、サウナを単に体を洗う場所ではなく「体と心を清め、内なる安らぎを得るための場」と評価しました。サウナは、家族や友人と過ごし、対話し、静けさを味わう“暮らしの中心”として位置づけられているのです。"},
    {type:"quote",text:"サウナは体を洗うだけの場所ではなく、心身を清め、内なる平穏を得る場所である。",small:"— ユネスコの評価より（要約）"},
    {type:"note",cool:true,text:"<b>登録名は「Sauna culture in Finland」</b>。パリで開かれた第15回の政府間委員会（決議 15.COM 8.b.27）で決定されました。"}
   ],

    {q:"ユネスコがサウナを評価したポイントに最も近いのは？",choices:["世界最古の入浴施設だから","体と心を清め安らぎを得る場だから","観光収入が大きいから","建築技術が高度だから"],answer:1,explain:"「体と心を清め、内なる安らぎを得る場」という文化的価値が評価されました。"}

  {

   blocks:[
    {type:"p",text:"日本にサウナが本格的に伝わったのは、1964年の東京オリンピック。フィンランド選手団が選手村にサウナを持ち込んだことがきっかけで注目を集め、これが「第一次サウナブーム」となりました。それ以前、1951年に東京・銀座で開業した「東京温泉」には、1956年、日本初とされる本格的な乾式サウナが導入されていました。"},
    {type:"h",text:"3度のブームの流れ"},
    {type:"list",items:[
     "<b>第一次（1964年〜）</b>：東京五輪でフィンランド式サウナが伝来。高度経済成長とともに広がる。当時は“サウナ＝おじさん”のイメージ。",
     "<b>第二次（1990年代）</b>：スーパー銭湯・健康ランドが全国に登場。サウナが身近なレジャーに。",
     "<b>第三次（2019年〜）</b>：タナカカツキの漫画『サ道』のドラマ化と「ととのう」の流行で、若者・女性にも一気に浸透。"

   sources:[

    {q:"第三次サウナブーム（2019年〜）の火付け役となった作品は？",choices:["『テルマエ・ロマエ』","『サ道』","『孤独のグルメ』","『水曜どうでしょう』"],answer:1,explain:"タナカカツキの漫画『<b>サ道</b>』のドラマ化と「ととのう」ブームが第三次を牽引しました。"}

/* ========== 第3章 サウナの入り方と作法 ========== */
{

 lessons:[
  {

   blocks:[
    {type:"p",text:"サウナの基本は「サウナ室 → 水風呂 → 外気浴（休憩）」の3ステップを1セットとし、これを2〜3セット繰り返すこと。この順番と“休憩”こそが、ととのうための土台です。"},

    {type:"list",items:[

    {type:"note",warn:true,text:"<b>水風呂の前には必ずかけ湯・シャワー</b>を。汗を流すマナーであると同時に、急な温度変化（ヒートショック）を防ぐ大切な準備です。"}

    {q:"水風呂に入る“直前”にすべきことは？",choices:["水を大量に飲む","かけ湯・シャワーで汗を流す","激しく体を動かす","5分間じっとする"],answer:1,explain:"マナーであり、ヒートショック予防にもなる<b>かけ湯・シャワー</b>が必須です。"}

  },
  {
   id:"l3-2", title:"サウナハット・マット・水分補給",
   blocks:[
    {type:"p",text:"快適で安全なサウナのために、押さえておきたい道具と習慣があります。"},
    {type:"h",text:"サウナハットの役割"},
    {type:"p",text:"サウナハットは、高温と乾燥から頭皮や髪を守り、のぼせを防ぎます。髪のタンパク質は熱に弱いため、頭部の保護は理にかなっています。専用の帽子がなくても、濡らしたタオルを頭に巻くだけで代用できます。"},
    {type:"h",text:"水分補給がいちばん大事"},
    {type:"list",items:[
     "入浴前にコップ1〜2杯（300〜500ml）の水を。",
     "セットの合間・終了後もこまめに補給する。",
     "コーヒー・アルコールは利尿作用で脱水を招くため避ける。"
    ]},
    {type:"note",text:"<b>サウナマット</b>は、直接ベンチに座らず衛生を保つための敷物。施設に置いてある場合も、マイマットを持参する人も増えています。"}
   ],
   sources:[

   quiz:[
    {q:"サウナハットの主な役割は？",choices:["おしゃれのため","頭皮・髪を熱から守りのぼせを防ぐ","汗を吸うため","水風呂で浮くため"],answer:1,explain:"高温・乾燥から<b>頭皮と髪を守り、のぼせを防ぐ</b>のが目的。濡れタオルでも代用できます。"},
    {q:"サウナ中の水分補給で避けたほうがよい飲み物は？",choices:["水","スポーツドリンク","コーヒー・アルコール","麦茶"],answer:2,explain:"<b>コーヒーやアルコール</b>は利尿作用で脱水を招くため避けましょう。"}
   ]
  },
  {
   id:"l3-3", title:"マナーと安全（入ってはいけない人）",
   blocks:[
    {type:"p",text:"サウナは健康法である一方、体に強い負荷をかける行為でもあります。安全に楽しむための知識は必須です。"},
    {type:"h",text:"サウナを避けるべき状況・人"},
    {type:"list",items:[
     "<b>飲酒後</b>：利尿作用で脱水しやすく危険。",
     "<b>食後すぐ</b>：消化に血液が必要なため、1〜2時間ほど空ける。",
     "<b>体調不良時</b>、持病のある方、妊娠中の方、10歳以下の子どもは利用を控える（要相談）。"

    {type:"h",text:"基本のマナー"},
    {type:"list",items:[

     "サウナ室では静かに。スマホの持ち込みは基本的に禁止。",
     "我慢比べをしない。自分の体と対話する。"

    {q:"サウナを避けるべきなのは次のうちどれ？",choices:["水分補給をした後","飲酒後","運動前","起床後"],answer:1,explain:"<b>飲酒後</b>は脱水のリスクが高く危険。食後すぐも1〜2時間空けましょう。"},
    {q:"サウナ中に「クラクラする」と感じたら？",choices:["ととのいの合図なので続ける","我慢比べを続ける","すぐに中止して休む","水風呂に飛び込む"],answer:2,explain:"危険なサインです。<b>すぐに中止</b>を。つらい“フラフラ”はととのいではありません。"}
