んの時間短縮です。"},{"type":"h","text":"相談メモは「次回持参する」ために書く"},{"type":"p","text":"相談のたびに、日付・担当者名・質問と回答・宿題を1枚に記録してください。目的は備忘ではなく、<b>次回の相談に同じメモを持参する</b>ことです。行政の担当者は異動します。前回までの経緯を紙で示せれば、担当が代わっても話が最初に戻りません。「言った・言わない」を防ぐ、いちばん安上がりな保険でもあります。"},{"type":"note","warn":true,"text":"事前相談で得た回答は<b>その時点の図面に対する見解</b>であり、営業許可を保証するものではありません。図面を変えたら再相談が原則です。※本講義は一般的な情報であり、法的助言ではありません。実際の判断は必ず管轄保健所・専門家にご確認ください。"}],"sources":[{"label":"東京都港区｜公衆浴場の手続き","url":"https://www.city.minato.tokyo.jp/kankyoueiseishidou/kuse/egyokyoka/tetsuzuki/yokujo.html","icon":"🏢"},{"label":"東京都多摩小平保健所｜公衆浴場","url":"https://www.hokeniryo.metro.tokyo.lg.jp/shisetsu/jigyosyo/hokenjyo/tamakodaira/kankyou/seikatunoeisei/koushuyokujyou","icon":"🏢"},{"label":"厚生労働省｜公衆浴場法概要","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/seikatsu-eisei/seikatsu-eisei04/04.html","icon":"🏛️"}]},{"title":"条例を自分で読む——例規集の歩き方","blocks":[{"type":"p","text":"無料章で学んだ通り、構造設備の基準は都道府県などの条例で決まります。ここで一段上に行きましょう。保健所に「教えてもらう」だけでなく、根拠の条文を<b>自分で読める</b>ようになると、設計者や施工業者との会話の質が変わります。条文は、あなたが思っているよりずっと読めます。"},{"type":"h","text":"検索の型——「例規集」というデータベース"},{"type":"list","items":["自治体は、条例・規則を集めた<b>「例規集」</b>をウェブで公開している。「（自治体名）　公衆浴場　条例」や「（自治体名）　例規集」で検索するのが基本形。","注意点がひとつ。条例名に「構造設備」という言葉が入っているとは限らない。東京都の条例の正式名称は<b>「公衆浴場の設置場所の配置及び衛生措置等の基準に関する条例」</b>（昭和39年条例第184号）で、名前だけでは構造の基準だと分からない。","都道府県の条例ではなく、<b>保健所を設置する市や特別区の条例・規則</b>で基準を定めている場合もある。自分の物件にどの条例が適用されるかは、事前相談で最初に確認する。"]},{"type":"h","text":"読む順番は「条例→施行規則→要綱」"},{"type":"list","items":["<b>条例</b>：基準の本体。まず全体を流し読みし、自分の業態（その他の公衆浴場）に該当する条文だけを精読する。","<b>施行規則</b>：条例が「規則で定める」と委任した細目や申請様式。図面に落とし込む具体的な内容はこちらにあることが多い。","<b>要綱・指導基準</b>：条例・規則を運用するための内規。ウェブに出ていないこともあるので、窓口で「要綱や指導基準はありますか」と聞いてしまうのが早い。"]},{"type":"h","text":"東京都条例を実際に開いてみる"},{"type":"p","text":"東京都の条例は、浴場を「普通公衆浴場」と「その他の公衆浴場」に分けて基準を定めています。サウナが属する「その他の公衆浴場」の一般的な施設については、脱衣室・浴室・便所といった基本設備の基準に加え、蒸し機等の<b>熱気による入浴設備には適当な位置に熱気の温度を明示するための温度計</b>を、<b>脱衣室・浴室には換気のための開口部または換気に必要な機械設備</b>を設けることを求めています。ここで気づいてほしいのは、温度計の号にある「適当な位置」という言葉です。条文はしばしばこういう抽象的な書き方をします。その具体的な解釈——温度計はどの高さ・どの場所に付ければ「適当」なのか——こそ、事前相談で保健所に確認すべき核心です。条文を読んでから聞く人と、読まずに聞く人では、得られる答えの深さが違います。"},{"type":"h","text":"読んだ条文は、印刷して窓口へ"},{"type":"p","text":"仕上げの技をひとつ。読んだ条文を印刷し、疑問のある箇所に線を引いて事前相談に持参してください。「第○条の『適当な位置』とは、この図面ではどこを指しますか」——条文番号で質問できる相談者に対して、窓口の回答は具体的になります。公衆浴場法が基準を条例に委任し、条例が細目を規則に委任する。この「委任の連鎖」を一度たどっておけば、あなたはもう、根拠を確かめずに伝聞で動く経営者ではありません。"},{"type":"note","cool":true,"text":"例規集は、改正から反映までに時間差があることがあります。条文を根拠に大きな判断をする前に、最新の内容かどうかを保健所で確認してください。※本講義は一般的な情報であり、法的助言ではありません。"}],"sources":[{"label":"東京都例規集｜公衆浴場の設置場所の配置及び衛生措置等の基準に関する条例","url":"https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00000879.html","icon":"📜"},{"label":"東京都多摩小平保健所｜公衆浴場","url":"https://www.hokeniryo.metro.tokyo.lg.jp/shisetsu/jigyosyo/hokenjyo/tamakodaira/kankyou/seikatunoeisei/koushuyokujyou","icon":"🏢"},{"label":"厚生労働省｜公衆浴場法概要","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/seikatsu-eisei/seikatsu-eisei04/04.html","icon":"🏛️"}]},{"title":"消防手続きの流れ——届出の名前と期限を頭に入れる","blocks":[{"type":"p","text":"消防の手続きが保健所と違うのは、<b>期限が日数で決まっている</b>ことです。「そのうち相談しよう」が通用しません。ここでは東京消防庁の公表している運用を例に、あなたが出すことになる届出の名前と提出タイミングを整理します。届出の正式名称を知っているだけで、内装業者との打ち合わせも消防署への電話も、驚くほどスムーズになります。"},{"type":"h","text":"工事の前——防火対象物工事等計画届出書"},{"type":"p","text":"建物やその一部について、建築・修繕・模様替え・用途変更に係る工事等を行うときは、東京消防庁管内では<b>工事等を始める7日前まで</b>に、管轄の消防署へ「防火対象物工事等計画届出書」を届け出ます。空き室に飲食店を開く場合や、室内の間仕切り壁の変更、避難経路の変更も対象として例示されており、サウナの内装工事はまさにこれに当たります。"},{"type":"h","text":"使用の前——防火対象物使用開始届出書"},{"type":"p","text":"工事が終わって建物（またはその一部）を使い始めるときは、<b>使用開始の7日前まで</b>に「防火対象物使用開始届出書」を管轄の消防署へ届け出ます。東京消防庁では窓口への持参・郵送のほか電子申請にも対応しています。この2つはセットで覚えてください。<b>着工の7日前と、使用開始の7日前</b>——工程表に最初に書き込むべき日付です。"},{"type":"h","text":"サウナストーブの規制は市町村条例が本丸"},{"type":"list","items":["消防法第9条は、火を使用する設備等の位置・構造・管理の基準を<b>市町村条例</b>に委ねている。つまりサウナ設備の規制の実体は、あなたの市町村の火災予防条例にある。","国が示す「火災予防条例（例）」第7条の2は、サウナ室の放熱設備に<b>可燃物からの離隔距離の確保</b>と、<b>温度が異常に上昇した場合に直ちに熱源を遮断できる手動及び自動の装置</b>を求めている。ストーブ選定の段階で、この装置の有無をメーカー仕様書で確認する。","サウナ設備には炉の基準（同条例（例）第3条）も準用される。<b>可燃物が落下・接触するおそれのない位置</b>に設ける、<b>階段・避難口等の付近で避難の支障となる位置に設けない</b>、有効な換気ができる位置に設ける、地震等で容易に転倒・破損しない構造とする——ストーブの置き場所を決めるときは、この目線で図面を見る。","電気サウナ・ガスサウナの具体的な設置方法等は<b>「サウナ設備設置基準」（平成15年火災予防技術情報第27号）</b>として通知されており、対流型放熱器の離隔距離や周辺の仕上げの基準例が示されている。消防庁資料では、日本サウナ・スパ協会の基準として電気サウナ設備の最大消費電力は30kW、ガスサウナ設備の最大ガス消費量は50kWとされていることも紹介されている。","可搬式サウナ用の薪ストーブ等は「対象火気器具等」として、燃料の種別やバーナーの構造ごとに離隔距離の基準の対象になる。テントサウナやバレルサウナを事業で使うなら、ここも管轄消防署への確認事項。"]},{"type":"h","text":"図面の段階で予防担当へ"},{"type":"p","text":"相談先は管轄消防署の<b>予防担当（予防課）</b>です。保健所と同じく、図面がたたき台の段階で一度見せておくと、感知器の位置からストーブの離隔距離、防火管理者の要否（無料章で学んだ収容人員30人以上の基準）まで含めて指摘をもらえます。なお消防法第8条は、防火管理者を定めたときは<b>遅滞なく所轄の消防長または消防署長へ届け出る</b>ことも求めています。選任して終わり、ではありません。"},{"type":"note","warn":true,"text":"「7日前」という期限や届出様式は<b>東京消防庁管内の運用例</b>です。消防の届出は市町村（消防本部）ごとに火災予防条例・運用が異なります。必ず管轄の消防署に確認してください。※本講義は一般的な情報であり、法的助言ではありません。"}],"sources":[{"label":"東京消防庁｜防火対象物の工事等計画の届け出をしよう","url":"https://www.tfd.metro.tokyo.lg.jp/lfe/office_adv/bouka.html","icon":"🚒"},{"label":"東京消防庁｜防火対象物の使用開始の届出をしよう","url":"https://www.tfd.metro.tokyo.lg.jp/lfe/office_adv/bouka02.html","icon":"🚒"},{"label":"東京消防庁｜申請様式・防火対象物使用開始届出書","url":"https://www.tfd.metro.tokyo.lg.jp/drs/ss_03/001.html","icon":"🚒"},{"label":"総務省消防庁｜サウナ設備に係る消防法の関係規定","url":"https://www.fdma.go.jp/singi_kento/kento/items/post-154/01/shiryou4.pdf","icon":"🚒"}]},{"title":"用途変更と検査済証——建築士と組んで物件を見極める","blocks":[{"type":"p","text":"建築基準法の実務は、正直に言えば独学で突破できる領域ではありません。このレッスンで学ぶのは自分で申請する方法ではなく、<b>建築士に何を頼み、契約前に何を確認すべきか</b>という発注者の技術です。この知識があるかどうかで、かかる費用も、掴んでしまうリスクも大きく変わります。"},{"type":"h","text":"200㎡ラインを実務に翻訳する"},{"type":"list","items":["用途変更する部分が<b>200㎡を超えるなら、用途変更の建築確認手続き</b>が必要。設計と申請は建築士に依頼するのが現実的で、既存の図面が残っているかどうかで費用も工期も大きく変わる。","200㎡以下なら手続きは不要。ただし国土交通省のリーフレットは「建築基準法や消防法等への適合は手続きの要否とは関係なく、引き続き求められます」とし、<b>「必要に応じて、自治体の建築部局や消防部局に相談されることをお勧めします」</b>と明記している。手続き不要は、相談不要という意味ではない。","用途変更の後は<b>維持保全</b>が求められる。点検する人と頻度をあらかじめ決め、廊下・階段に物を置かず、防火設備を点検する。定期報告の対象建築物なら、定められた報告も行う。"]},{"type":"h","text":"「検査済証」の有無を契約前に確認する"},{"type":"p","text":"検査済証とは、建物の完成時に建築基準法令への適合が確認されたことを示す書類です。中古物件、特に古いビルや倉庫では、これが<b>存在しない</b>ことが珍しくありません。検査済証がないと、用途変更の確認申請などの場面で法適合の確認に大きな手間がかかり、計画そのものが止まることがあります。内見の段階で、所有者や仲介会社に検査済証の有無を必ず確認してください。「サウナに良さそうな渋い倉庫」ほど、この地雷が埋まっています。"},{"type":"h","text":"検査済証がない場合の公式ルート"},{"type":"p","text":"国土交通省は平成26年に「検査済証のない建築物に係る指定確認検査機関を活用した建築基準法適合状況調査のためのガイドライン」を公表し、この仕組みは<b>2025年4月1日に「既存建築物の現況調査ガイドライン」へ統合・一本化</b>されました。建築士が建築基準法令への適合状況を調査するための手順・方法が示されており、検査済証がなくても活用の道が閉ざされているわけではありません。ただし調査には費用と時間がかかり、不適合の箇所が見つかれば是正工事も必要になります。<b>「検査済証なしの物件は、調査と是正のコストを上乗せして判断する」</b>——これが発注者としての正しい構えです。"},{"type":"h","text":"「済証を紛失しただけ」なら記録で裏が取れる"},{"type":"list","items":["確認済証・検査済証は<b>再発行されない</b>。ただし東京都では、台帳に記録が残っていれば<b>「台帳記載事項証明書」</b>で交付年月日・番号などを証明してもらえる。同様の仕組みを持つ自治体は多い。","内見で「済証は失くしたが検査は受けたはず」と言われたら、この証明で裏を取る。<b>検査の状況によって台帳に記載がない場合や、台帳が現存せず証明書を発行できない場合もある</b>——記載がなければ「済証なし物件」として扱う。","確認先は物件所在地の自治体の建築部局（東京都の場合は都市整備局の案内を参照）。口頭の「大丈夫なはず」を、書面の記録に置き換えるのが発注者の仕事。"]},{"type":"note","cool":true,"text":"建築時は適法だったのに法改正で現行基準に合わなくなった「既存不適格」の建物には、一定の範囲内の増築等や用途変更であれば従前の規定の扱いを引き継げる仕組みもあります。該当しそうな物件は、自己判断せず建築士と自治体の建築部局に相談を。※本講義は一般的な情報であり、法的助言ではありません。"}],"sources":[{"label":"国土交通省｜用途変更200㎡基準リーフレット","url":"https://www.mlit.go.jp/common/001299734.pdf","icon":"🏛️"},{"label":"国土交通省｜既存建築物の活用の促進について","url":"https://www.mlit.go.jp/jutakukentiku/jutakukentiku_house_fr_000061.html","icon":"🏛️"},{"label":"東京都都市整備局｜台帳記載事項証明書の発行","url":"https://www.toshiseibi.metro.tokyo.lg.jp/kenchiku_kaihatsu/kenchiku_gyosei/gyosei/kijun/kn_k01/tetudu_8","icon":"🏢"}]},{"title":"開業までの工程表——すべてを一本の時間軸に載せる","blocks":[{"type":"p","text":"最後に、ここまでの手続きを一本の時間軸に載せます。許認可で失敗する人の多くは、個々の手続きを知らなかったのではありません。<b>順番と所要日数を甘く見て、家賃だけが出ていく空白期間</b>を作ってしまった人です。"},{"type":"h","text":"標準工程（東京での公表例をもとにしたモデル）"},{"type":"list","items":["<b>①物件候補の選定</b>：内見の段階で、検査済証の有無・用途変更の要否（200㎡）・給排水や電気容量を確認する。","<b>②契約前の三者事前相談</b>：たたき台の図面を持って、保健所・消防署（予防担当）・（用途変更や増改築があるなら）建築部局へ。致命傷がないことを確かめてから契約する。","<b>③物件契約・設計確定</b>：事前相談の指摘を反映して図面を固める。必要なら用途変更の確認申請を建築士に依頼。","<b>④着工前</b>：「防火対象物工事等計画届出書」を<b>工事開始の7日前まで</b>に管轄消防署へ（東京消防庁の例）。","<b>⑤工事中</b>：営業許可申請の書類を保健所へ。港区の例では正副2部で、営業許可申請書・構造設備の概要・建物の図面（配置図・平面図・正面図等）・換気設備と給排水設備の図面など。必要に応じて<b>中間検査</b>——壁を閉じたら見えなくなる配管などを確認してもらう。","<b>⑥使用開始前</b>：「防火対象物使用開始届出書」を<b>使用開始の7日前まで</b>に管轄消防署へ（同）。","<b>⑦完成後</b>：保健所の<b>完成検査</b>。多摩小平保健所は「施設完成後の検査から営業許可まで12日程度かかることがある」、港区は「完成検査後、書類不備等がなければ2週間程度で営業許可書を発行」と案内している（いずれも2026年7月時点）。","<b>⑧許可書の交付を受けてから開業</b>。"]},{"type":"h","text":"逆算とバッファの置き方"},{"type":"p","text":"工程表は開業日からの逆算で作ります。最大の要注意区間は、<b>「工事完成」から「許可書交付」までの2〜3週間</b>です。この間、家賃も人件費も発生するのに売上はゼロ。完成検査で不適合が出れば、手直しと再検査でさらに延びます。開業日をSNSで告知するのは、完成検査の目処が立ってからでも遅くありません。"},{"type":"h","text":"工程表そのものの作り方"},{"type":"p","text":"体裁は何でも構いませんが、行を「保健所」「消防」「建築・工事」の3本に分けることを勧めます。手続きの主体が違えば、進む速度も止まる理由も違うからです。①〜⑧を3本の行に振り分け、<b>着工7日前・使用開始7日前・完成検査日</b>の3つを固定点として書き込む。内装業者との定例打ち合わせでこの表を毎回更新すれば、「気づいたら届出期限を過ぎていた」は起こりません。"},{"type":"h","text":"つまずきの典型3つ"},{"type":"list","items":["<b>「業者がやってくれているはず」問題</b>：消防への届出や許可申請の名義・責任は、業者ではなくあなたの側にある。内装業者と「どの届出を誰がいつ出すか」の分担表を最初に作る。","<b>図面と現況の不一致</b>：工事中の小さな変更が図面に反映されず、完成検査の場で発覚する。変更のたびに、保健所・消防に伝わっているかを確認する。","<b>自治体差の見落とし</b>：手数料・検査の日数・必要書類・条例の基準は、すべて自治体によって異なる。この講義に出てきた数字は、あくまで東京都内の公表例にすぎない。"]},{"type":"note","warn":true,"text":"本講義の手続き名・日数・手数料は、2026年7月時点で東京都内の行政機関が公表している例です。制度と運用は自治体により異なり、今後変わり得ます。実際の計画は必ず管轄の保健所・消防署・建築部局と専門家にご確認ください。※本講義は一般的な情報であり、法的助言ではありません。"}],"sources":[{"label":"東京都港区｜公衆浴場の手続き","url":"https://www.city.minato.tokyo.jp/kankyoueiseishidou/kuse/egyokyoka/tetsuzuki/yokujo.html","icon":"🏢"},{"label":"東京都多摩小平保健所｜公衆浴場","url":"https://www.hokeniryo.metro.tokyo.lg.jp/shisetsu/jigyosyo/hokenjyo/tamakodaira/kankyou/seikatunoeisei/koushuyokujyou","icon":"🏢"},{"label":"東京消防庁｜防火対象物の工事等計画の届け出をしよう","url":"https://www.tfd.metro.tokyo.lg.jp/lfe/office_adv/bouka.html","icon":"🚒"},{"label":"国土交通省｜用途変更200㎡基準リーフレット","url":"https://www.mlit.go.jp/common/001299734.pdf","icon":"🏛️"}]},{"title":"開業後の法令運用カレンダー——毎年・毎月くり返す義務を1枚に束ねる","blocks":[{"type":"p","text":"開業日はゴールではなくスタートラインです。許可を取った翌日から、法令はあなたに「毎年くり返す宿題」を課します。第3講で見た消防への2つの届出は開業前の一回きりの手続きでしたが、この講で束ねるのは、営業を続けるかぎり終わらない<b>定期義務</b>です。水質・換水・点検報告・再講習・労働保険——1枚の年間カレンダーにまとめなければ、必ず抜けます。"},{"type":"h","text":"毎日・毎週の「水まわり」——衛生管理の土台"},{"type":"p","text":"厚生労働省の「公衆浴場における衛生等管理要領」は、日々の頻度まで具体的に定めています。浴槽は<b>毎日完全に換水して清掃</b>が原則、これにより難い場合でも<b>1週間に1回以上</b>は完全換水。循環式ならろ過器と循環配管を<b>1週間に1回以上</b>逆洗浄して生物膜を除去・消毒し、集毛器は毎日清掃・消毒します。遊離残留塩素は頻繁に測定し、その<b>測定結果は検査の日から3年間</b>保管します。"},{"type":"h","text":"月次・半期の点検——見えないところを回す"},{"type":"list","items":["サウナ室・サウナ設備：毎日清掃・洗浄のうえ<b>1か月に1回以上</b>の消毒と点検。<b>1か月に1回以上</b>保守点検し、室温・湿度を定期測定して記録を<b>3年以上保存</b>。","ねずみ・衛生害虫の点検：脱衣室・浴室・便所・排水設備は<b>1か月に1回以上</b>、その他の設備は<b>6か月に1回以上</b>。シャワーヘッドとホースは6か月に1回以上点検し、汚れとスケールを1年に1回以上洗浄・消毒。"]},{"type":"h","text":"年に一度の「締め切り仕事」"},{"type":"list","items":["<b>水質検査</b>：浴槽水・原水・原湯などを1年に1度以上検査し、結果を<b>検査の日から3年間</b>保管。塩素以外の消毒（オゾン等）を使う施設は、レジオネラ属菌検査で消毒効果を検証すること。","<b>給水・給湯設備</b>：1年に1回以上の保守点検。飲用水を供給する受水槽・高置水槽は1年に1回以上清掃。","<b>労働保険の年度更新</b>：<b>毎年6月1日〜7月10日</b>。前年度の確定保険料と当年度の概算保険料を併せて申告・納付。","<b>定期健康診断</b>：常時使用する従業者には<b>1年以内ごとに1回</b>の実施が事業者の義務（労働安全衛生規則第44条）。採用時には雇入時健診（同第43条）も必要。管理要領も従業者が健診を「1年に1回以上受けることが望ましい」としている。常時50人以上を使用する場合は、結果を労働基準監督署長へ報告するところまでが義務。"]},{"type":"h","text":"消防の点検報告——「点検頻度」と「報告周期」は別物"},{"type":"p","text":"開業後にいちばん忘れられがちなのが消防用設備等の点検報告です。<b>点検する頻度</b>と<b>報告する周期</b>を分けて覚えましょう。東京消防庁によれば、点検は<b>機器点検が6か月に1回</b>、<b>総合点検が1年に1回</b>。報告の周期は対象物の種類で変わります。"},{"type":"list","items":["サウナは消防法施行令別表第一の「<b>（9）項イ\u2028公衆浴場のうち、蒸気浴場、熱気浴場その他これらに類するもの</b>」にあたり、これは<b>特定防火対象物なので報告は1年に1回</b>が基本。サウナ設備のない一般浴場（（9）項ロ）は非特定で3年に1回。雑居ビルの一角なら（16）項イ（複合用途）として扱われることもあるため、自分の建物がどの区分かは管轄消防署に確認する。","報告を怠ると消防法第44条第11号で<b>30万円以下の罰金又は拘留</b>の対象になり得る。「点検はしたが報告を出し忘れた」が典型的な失敗。"]},{"type":"h","text":"防火管理者の再講習——選任して終わりではない"},{"type":"p","text":"第3講で扱った防火管理者の選任には、開業後の続きがあります。<b>甲種防火管理者には再講習</b>の制度があり、受講が義務付けられるのは<b>特定防火対象物で収容人員300人以上</b>の建物の防火管理者です（消防法施行規則第2条の3第1項）。単独店舗で300人未満なら義務は生じないのが基本ですが、管理権原が分かれている雑居ビルでは選任部分の用途・人員で判定が変わるため、管轄消防署に確認を。対象になれば周期は要注意です。平成16年消防庁告示第2号によれば、選任日の4年前までに講習を修了していた人は<b>選任日から1年以内</b>、それ以外は<b>講習修了日以後における最初の4月1日から5年以内</b>に再講習を修了。以後も、直近の再講習修了日以後における最初の4月1日から5年以内ごとに受講をくり返します。"},{"type":"h","text":"保存年限だけ抜き出しておく"},{"type":"p","text":"いちばん抜けるのは頻度ではなく<b>記録を捨ててしまうこと</b>です。点検しても記録がなければ、「やっていない」のと同じ扱いになりかねません。塩素・水質の測定結果は<b>検査の日から3年間</b>、サウナ室の温湿度記録は<b>3年以上</b>。保存年限を記録簿の表紙に貼っておきましょう。"},{"type":"h","text":"あなたの施設カレンダーの作り方"},{"type":"p","text":"仕上げは1枚の年間カレンダーです。縦軸に頻度（毎日／毎週／毎月／半期／年1回）、横軸に系統（衛生・消防・労務）を置く。<b>6月〜7月10日の年度更新</b>、<b>総合点検・機器点検の月</b>、<b>水質検査の月</b>を固定点として先に書き込みます。外注しても「いつ・誰が・何を」の最終責任はあなた。担当者名まで書けば、「業者がやってくれているはず」の空白は生まれません。"},{"type":"note","warn":true,"text":"本講の頻度・周期・期限は2026年7月時点で厚労省・消防庁・東京消防庁・大阪市等が公表する法令・運用例です。水質管理の細目や消防の用途判定・報告周期は<b>自治体・管轄消防署により異なります</b>。実際の運用は必ず管轄の保健所・消防署や社会保険労務士等の専門家にご確認ください。※本講義は一般的な情報であり、個別の法的・労務的助言ではありません。"}],"sources":[{"label":"厚生労働省｜公衆浴場における衛生等管理要領（本文）","url":"https://www.mhlw.go.jp/content/11130500/001171614.pdf","icon":"🏛️"},{"label":"厚生労働省｜公衆浴場における衛生等管理要領等の改正について","url":"https://www.mhlw.go.jp/topics/bukyoku/kenkou/legionella/030214-1a.html","icon":"🏛️"},{"label":"東京消防庁｜消防用設備等点検報告制度（消防法第17条の3の3）","url":"https://www.tfd.metro.tokyo.lg.jp/lfe/office_adv/tenken_houkoku.html","icon":"🚒"},{"label":"東京消防庁｜甲種防火管理再講習・防災管理再講習","url":"https://www.tfd.metro.tokyo.lg.jp/lfe/office_adv/jissen/p11.html","icon":"🚒"},{"label":"総務省消防庁｜甲種防火管理再講習について定める件（平成16年消防庁告示第2号）","url":"https://www.fdma.go.jp/laws/kokuji/post28/","icon":"🚒"},{"label":"大阪市消防局｜甲種防火管理再講習の受講義務・消防法施行令別表第1（抜粋）","url":"https://www.city.osaka.lg.jp/shobo/cmsfiles/contents/0000260/260243/3.pdf","icon":"🚒"},{"label":"厚生労働省｜労働保険の年度更新とは","url":"https://www.mhlw.go.jp/bunya/roudoukijun/roudouhoken01/kousin.html","icon":"🏛️"},{"label":"厚生労働省｜労働安全衛生法に基づく健康診断を実施しましょう（リーフレット）","url":"https://www.mhlw.go.jp/content/001696789.pdf","icon":"🏛️"}]}]},{"moduleId":"kyakuzuke","title":"開業マーケの実務","icon":"📣","subtitle":"開業マーケゼミ｜「検索したら出てくる店」を、開業前につくる","intro":"無料章「集客とブランディング」では、サウナイキタイとMEOという2つの入口、そしてリピーターという考え方を学びました。このゼミはその一歩先、「実際に手を動かす手順」に踏み込みます。開業前90日の逆算ロードマップ、サウナイキタイとGoogleビジネスプロフィールの運用実務、ステマ規制時代の口コミ作法、地方メディアに届くプレスリリース、回数券に潜む資金決済法、開業後の月次レビュー、そして閑散期とリピート率の実務。広告費はほぼゼロで構いません。順番を間違えなければ、オープン初日に「検索したら出てくる店」は作れます。あなたの開業日から逆算しながら読んでください。","lessons":[{"title":"開業前90日——「知られてから開ける」逆算ロードマップ","blocks":[{"type":"p","text":"オープン初日に賑わう店と、静かに始まって静かに苦しむ店。その差は当日の運ではなく、90日前からの準備の差です。中小機構の起業支援サイトJ-Net21は、開業のタイミングを「メディアからも、知人・友人、近隣の方たちからも注目されやすい時」であり、集客販促の絶好のチャンスだと指摘しています。この「開業の注目」は一度きりで、後からは二度と使えない資産です。90日を3つの期間に分けて、逆算で設計しましょう。"},{"type":"h","text":"90〜60日前：検索の「入口」を先に作る"},{"type":"p","text":"工事が始まる頃には、もう検索の受け皿を用意します。なぜ最初かというと、この後のすべての施策——SNSもプレスリリースも内覧会も——を見た人が、必ず店名で検索するからです。受け皿がなければ、せっかくの注目が着地せずに消えていきます。"},{"type":"list","items":["<b>Googleビジネスプロフィールを作成する</b>。Googleアカウントでログインし、ビジネス名と業種を入力、住所・電話番号を登録して<b>オーナー確認</b>まで済ませます。作成は無料です。","<b>サウナイキタイに施設登録する</b>。ユーザー登録すれば施設側も自分で登録・編集できます。設備・料金・営業時間を、開業前でも決まっている範囲で正確に。","屋号のSNSアカウントを開設し、プロフィールと最初の数投稿を整えて「無人のアカウント」状態を脱しておく。"]},{"type":"h","text":"60〜30日前：工事中こそ発信のネタになる"},{"type":"p","text":"J-Net21は、SNSで<b>開店までのストーリーを発信することが店への愛着形成につながる</b>としています。ストーブの搬入、サウナ室の板張り、水風呂の初注水——完成した施設より、できていく過程のほうが人は応援したくなるものです。ここで効くのが、同サイトの言う顧客ターゲットの3面での具体化——<b>地理的・人的・心理的</b>にどんな人か。「車で30分圏内の、週1でサウナに通う、静かに入りたい30〜40代」。ここまで絞って初めて、投稿の言葉づかいも、載せるべき写真も決まります。"},{"type":"h","text":"30日前〜前日：人を招き、来店のハードルを下げる"},{"type":"list","items":["<b>近隣への挨拶と、知人・友人への連絡</b>。J-Net21も開業前の基本として挙げる、最も原始的で確実な一手です。開業の注目を最初に地域へ運んでくれるのはこの人たちです。","<b>内覧会（プレオープン）を開くなら、この時期に</b>。近隣・知人・地域のメディア関係者を招き、実際にサウナを体験してもらう場にします。本番前の設備・オペレーションの予行演習も兼ねられます。","<b>プレスリリースを地元メディアへ送る</b>（書き方は本ゼミの後のレッスンで詳しく）。","<b>オープン記念特典を設計する</b>。J-Net21は特典やキャンペーンで来店のハードルを下げること、そしてクーポン等で効果を測定し、費用対効果の良い方法に絞り込んでいくことを勧めています。"]},{"type":"note","cool":true,"text":"90日という日数はあくまで目安です。大事なのは順番——<b>「検索の入口→ストーリー→招待と特典」の順で積む</b>こと。オープン後に慌ててGoogleビジネスプロフィールを作る店と、初日から検索に出る店では、最初の3か月の集客がまるで違います。"}],"sources":[{"label":"中小機構\u2028J-Net21｜開業前にやっておきたい集客販促","url":"https://j-net21.smrj.go.jp/startup/manual/list7/7-1-1.html","icon":"🏛️"},{"label":"Google｜ビジネスプロフィールの登録・オーナー確認","url":"https://support.google.com/business/answer/10514137?hl=ja","icon":"📗"},{"label":"Google｜ビジネスプロフィール（無料で作成）","url":"https://business.google.com/jp/business-profile/","icon":"📗"},{"label":"サウナイキタイ｜施設運営者向けガイドライン","url":"https://sauna-ikitai.com/guideline/sauna","icon":"🔥"}]},{"title":"サウナイキタイ運用の実務——削除できない口コミとの付き合い方","blocks":[{"type":"p","text":"無料章で、サウナイキタイが「広告費で順位を操作しない設計」だと学びました。つまりこのプラットフォームで存在感を出す方法はただ一つ、<b>正確な情報と良い体験を積み上げること</b>だけです。では施設側には具体的に何ができて、何をしてはいけないのか。公式の「施設運営者向けガイドライン」から、実務に直結するポイントを拾います。"},{"type":"h","text":"施設側が「できること」"},{"type":"list","items":["<b>施設情報の登録・編集</b>：施設側もユーザー登録すれば自由に編集できます。開業前に自分の手で登録し、サウナ室・水風呂・アメニティといった設備欄と営業情報を常に最新に保つのは、あなたの仕事です。","<b>連絡先メールアドレスの登録</b>：運営に登録しておくと施設向けの情報案内を受けられます。公式情報を登録できる<b>施設向けダッシュボードも開発予定</b>とされています。","「水曜サ活」などの公式企画への参加。ユーザーがあなたの店でサ活を投稿する理由を増やせます。"]},{"type":"h","text":"やってはいけないこと"},{"type":"list","items":["<b>施設名への宣伝文句の追加、施設写真へのキャンペーン画像の挿入、備考欄へのキャンペーン情報の記載</b>。いずれもガイドラインで明確にNGとされています。施設ページは広告枠ではなく、サウナーのための事実のデータベースです。","<b>イキタイ数の不正な操作</b>。発見され次第、過去に遡ってすべて無効にすると明言されています。スタッフや知人に頼んで押してもらうような小細工はやめましょう。"]},{"type":"h","text":"ネガティブなサ活が付いたら——ここが最重要"},{"type":"p","text":"ガイドラインにはこうあります。<b>「ネガティブなことを書かれているサ活であっても基本的に削除は受け付けていません」</b>。誹謗中傷など規約違反にあたる場合のみ「運営に報告する」から連絡できますが、対応が約束されるわけではありません。つまり、低評価のサ活を消す手段は最初から存在しないのです。できることは一つだけ——<b>指摘が事実なら直し、次に来た人のサ活で上書きしてもらう</b>こと。「水風呂がぬるかった」と書かれたら、反論ではなくチラーの設定を見直す。「サ室がざわつく」と書かれたら、私語への案内掲示を検討する。サ活は敵ではなく、毎日届く無料の巡回点検レポートです。"},{"type":"note","cool":true,"text":"削除できない仕組みは、裏を返せば<b>あなたの店に付いた良いサ活も誰にも消せない</b>ということ。開業直後の丁寧な運営で積んだ最初の50件、100件のサ活は、何年も検索され続ける資産になります。開業直後こそ、一人ひとりの体験に手を抜かないでください。"}],"sources":[{"label":"サウナイキタイ｜施設運営者向けガイドライン","url":"https://sauna-ikitai.com/guideline/sauna","icon":"🔥"}]},{"title":"Googleビジネスプロフィールと口コミ——登録・写真・返信・規制の線","blocks":[{"type":"p","text":"無料章では「小規模店が最初に着手すべき無料施策」とだけ伝えました。ここでは登録から口コミ対応まで、手を動かす順に見ていきます。Googleが公式に「無料で作成できます」と明言している通り、必要なのは費用ではなく、時間と根気だけです。"},{"type":"h","text":"登録とオーナー確認——すべてはここから"},{"type":"list","items":["Googleアカウントでログインし、「プロフィールの作成」からビジネス名と業種を入力します。","実店舗の有無を選び、住所・電話番号・ウェブサイトを登録します。","最後に<b>オーナー確認</b>を実施。これを済ませないと、口コミへの返信などオーナー向け機能が使えません。開業前に必ず完了させましょう。"]},{"type":"h","text":"順位は買えない——ローカル検索の3要素"},{"type":"p","text":"Googleはローカル検索の順位を<b>関連性（検索語句との合致度）・距離・知名度</b>の3要素で決めていると公表し、「ランキングを上げるためのリクエストや金銭の受け取りには一切応じておりません」と明言しています。では何が効くのか。Googleが公式に挙げる改善策は、拍子抜けするほど地味です。情報を完全かつ正確に入力する、営業時間を定期的に更新する、写真や動画を追加する、口コミに返信する。つまり<b>プロフィールの日々の手入れそのものが、最強のMEO施策</b>なのです。"},{"type":"h","text":"写真の揃え方——来店前の不安を消す順に"},{"type":"list","items":["<b>外観（昼・夜）</b>：初来店の人が迷わないための写真。地図で見た店構えと実物が一致するだけで安心感が生まれます。","<b>サウナ室・水風呂</b>：あなたの店の主役で、いちばん見られる写真。温度計が写っていると情報量が上がります。","<b>脱衣所・休憩スペース・料金表</b>：「きれい？」「いくら？」「タオルは？」という来店前の三大不安を、写真で先回りして消します。","撮影は営業時間外に行い、利用客が写り込む写真は使わないこと。"]},{"type":"h","text":"増やし方——対価を付けた瞬間に違反になる"},{"type":"p","text":"2023年10月1日、景品表示法の<b>ステルスマーケティング規制</b>が施行されました。規制されるのは「広告であるにもかかわらず、広告であることを隠すこと」。事業者が第三者に依頼・指示して、広告と判別できない形でSNS投稿やレビューを書かせる行為が該当し、SNSに限らずあらゆる表示が対象です。そして重要なのは、<b>措置命令の対象は投稿した客やインフルエンサーではなく、依頼した事業者——つまりあなた</b>だということです。"},{"type":"list","items":["Googleのポリシーはさらに一歩厳しく、<b>金銭・割引・無料の商品やサービスと引き換えに口コミ投稿を依頼する行為そのものを禁止</b>しています。「口コミを書いてくれたらドリンク1杯無料」は、善意のつもりでも明確な違反です。","否定的な口コミの修正・削除と引き換えに見返りを提供することも禁止。実体験に基づかない投稿の勧誘や、従業員など利害関係者による投稿も禁止です。","違反コンテンツは削除され、アカウントの一時停止から停止までの措置があり得ます。積み上げた口コミごと失うリスクです。"]},{"type":"p","text":"安全で、実は最も積み上がるのは<b>対価を付けない正直な依頼</b>です。無料章で学んだ「ととのった直後・退館時」に、「よかったら口コミで感想を聞かせてください」と一言添える。下駄箱やレジ横にQRコードを掲示する。実際に来た客への、見返りのないお願いは、どの規制にも触れません。地味ですが、この差が1年後に「消されない資産」の差になります。"},{"type":"h","text":"返信——未来の客への公開文書"},{"type":"p","text":"口コミへの返信は<b>オーナー確認済みのプロフィールでのみ</b>可能です。返信はGoogleのポリシーに基づいて審査され、通常は10分以内に承認・公開されますが、最長30日かかる場合もあります。返信に担当者の個人名は表示されず、公開されると投稿者に通知が届きます。ここで発想を切り替えてください。返信は投稿者への私信ではなく、<b>これから店を選ぶ「未来の客」への公開文書</b>です。誰に向けて書くかが変われば、書くべき内容も自然と変わります。"},{"type":"list","items":["文例の型は<b>①感謝\u2028→\u2028②具体的に拾う\u2028→\u2028③情報を足す\u2028→\u2028④再訪への一言</b>の4部構成。「外気浴を気に入っていただけて嬉しいです。秋からは毛布のご用意も予定しています」——口コミの中身を一つだけ具体的に拾うと、定型文の匂いが消えます。","低評価には、まず事実確認から。指摘が事実なら簡潔に謝罪し、改善の予定を書く。事実と異なる場合も、反論ではなく事実の説明を淡々と。","感情的な応酬と、投稿者の特定につながる記述（来店日時や利用内容の詳細など）は絶対にしないこと。"]},{"type":"note","warn":true,"text":"本レッスンは一般的な情報であり、法的助言ではありません。ステマ規制の適用は個別の事案ごとに判断されます。口コミやSNSを使ったキャンペーンを設計する際は、消費者庁の公表資料を確認し、判断に迷う場合は専門家・行政窓口に相談してください。手順・仕様は2026年7月時点の公式情報に基づきます。"}],"sources":[{"label":"Google｜ビジネスプロフィールの登録方法","url":"https://support.google.com/business/answer/10514137?hl=ja","icon":"📗"},{"label":"Google｜ローカル検索結果のランキングを改善する","url":"https://support.google.com/business/answer/7091?hl=ja","icon":"📗"},{"label":"Google｜クチコミに返信する","url":"https://support.google.com/business/answer/3474050?hl=ja","icon":"📗"},{"label":"消費者庁｜ステルスマーケティング規制（景品表示法）","url":"https://www.caa.go.jp/policies/policy/representation/fair_labeling/stealth_marketing/","icon":"🏛️"},{"label":"Google\u2028マップ｜禁止または制限されているコンテンツ","url":"https://support.google.com/contributionpolicy/answer/7400114?hl=ja","icon":"📗"},{"label":"Google｜ビジネスプロフィール（無料で作成）","url":"https://business.google.com/jp/business-profile/","icon":"📗"}]},{"title":"プレスリリース——地方メディアは「地元の新店」を探している","blocks":[{"type":"p","text":"サウナ施設の開業は、地方紙や地域ウェブメディアにとって立派なニュース候補です。中小機構のJ-Net21は、広告と広報の違いをこう整理しています。広告は費用を払って自社のメッセージをそのまま載せるもの。<b>広報（プレスリリース）は記者が自主的に取材・編集して記事にするもので、読者には客観的で信頼性が高いと受け取られ、掲載費もかからない</b>。開業の注目度が最も高いこの時期に、無料の広報を使わない手はありません。"},{"type":"h","text":"J-Net21が挙げる、リリース作成の基本"},{"type":"list","items":["<b>タイトルは伝えたいことを1つに絞る</b>。「〇〇市に薪ストーブのサウナが開業」。欲張って2つ入れると、どちらも伝わりません。","<b>本文は5W1H</b>——誰が・何を・何の目的で・いつ・どうしたか。記者が事実確認しやすい構成で、正確に書きます。","<b>専門用語は極力使わない</b>。「ロウリュ」「外気浴」はサウナ好きの言葉です。「熱した石に水をかけて蒸気を発生させるサービス」と言い換える勇気を持ちましょう。","<b>問い合わせ先を明記する</b>。担当者名・電話・メール。記者は締切に追われています。すぐ連絡がつくことが、取材の前提条件です。"]},{"type":"h","text":"記事になる「角度」を用意する"},{"type":"p","text":"事実の羅列だけでは記事になりません。記者が探しているのは<b>地域の文脈</b>です。「市内初の個室サウナ」「廃業した銭湯を改装」「地元の木材でサウナ室を造作」「Uターンして開業」。あなたの開業までの物語の中から、地域と接続する一点を見つけて、それをタイトルに据えます。取材が来たときに話せるよう、開業の経緯・こだわり・地域への思いをあらかじめ整理しておくと、記事に厚みが出ます。"},{"type":"h","text":"送り先と送り方"},{"type":"list","items":["J-Net21は、自社に合った媒体を選ぶこと、送付はFAXや郵送が一般的であること、そして<b>自社ホームページへの同時掲載</b>を勧めています。","候補は、地方紙の地域面、地域のウェブメディアやフリーペーパー、テレビ局の情報番組。全国メディアより、まず地元からです。","送って終わりにせず、リリース本文はホームページとSNSにも載せる。記者は取材の前に必ず検索します。検索して情報が出てくることが、信頼の入口です。"]},{"type":"note","cool":true,"text":"掲載されるかどうかは媒体側の判断で、確約はありません。ただしプレスリリースは無料で、失うもののない施策です。開業時だけでなく、1周年・新設備の導入・イベント開催——「ニュースの種」ができるたびに送る定期便と考えてください。"}],"sources":[{"label":"中小機構\u2028J-Net21｜プレスリリースを行う方法","url":"https://j-net21.smrj.go.jp/solution/qa/pr/Q1139.html","icon":"🏛️"},{"label":"中小機構\u2028J-Net21｜開業前にやっておきたい集客販促","url":"https://j-net21.smrj.go.jp/startup/manual/list7/7-1-1.html","icon":"🏛️"}]},{"title":"回数券・会員制度の設計——「前払い」には法律が付いてくる","blocks":[{"type":"p","text":"無料章で、会員・回数券・サブスクは「通う理由を作る」仕組みだと学びました。売上の前受けは資金繰りも助けます。ただしここには、多くの開業者が名前も知らない法律が待っています。<b>資金決済法</b>です。"},{"type":"h","text":"回数券は「前払式支払手段」という規制の対象"},{"type":"p","text":"客から先にお金を受け取り、後からサービスを提供する回数券やプリペイドカードは、資金決済法上の<b>前払式支払手段</b>の典型例です。自分の店だけで使えるものは<b>自家型</b>と呼ばれ、主に次のルールの対象になります。"},{"type":"list","items":["<b>基準日残高1,000万円の壁</b>：毎年3月末・9月末（基準日）時点の未使用残高が1,000万円を超えると、財務局への<b>届出</b>が必要になり、<b>未使用残高の2分の1以上の額を法務局に供託</b>する（または金融機関等と保全契約を結ぶ）義務が生じます。手続きの期限は基準日の翌日から2か月以内です。","<b>原則、払戻しは禁止</b>：資金決済法の適用を受ける前払式支払手段は、業務の廃止時など限られた場合を除き、原則として払戻しが禁止されています。「いつでも現金で返金します」という運用はできません。","<b>表示義務</b>：発行者名・利用可能金額・使用期間・苦情相談窓口などを、券面や自社サイトで利用者に情報提供する義務があります。"]},{"type":"h","text":"6か月ルール——小さく始めるなら"},{"type":"p","text":"一方で、有効期間が発行から<b>6か月内</b>と明記されているものは、資金決済法の適用除外とされています。開業直後で管理体制がまだ薄いうちは、回数券の有効期限を6か月内に設定するのが、最もシンプルで安全な設計です。ただし要注意——<b>期限が切れた後も実質的に使わせていると、適用除外とは認められません</b>。「常連さんだから期限切れでも使っていいよ」という優しさが、法律上はあなたの首を絞めます。期限を延ばしたいなら、基準日ごとに未使用残高を集計して1,000万円との距離を確認する管理と、必ずセットにしてください。"},{"type":"h","text":"特典設計の考え方"},{"type":"list","items":["回数券の特典は、1回あたりの値引きより<b>「10回分の料金で11回入れる」型</b>のほうが単価を守りやすい設計です。値引き型は、通常料金への信頼をじわじわ削ります。","月額会員は「混まない時間に来てもらう」設計と相性が良い（平日昼限定会員など）。満員の土曜をさらに混ませるのではなく、稼働の谷を埋める道具として使います。","特典は、後から増やすのは簡単ですが、減らすと必ず不満が出ます。<b>開業時は控えめに始める</b>のが鉄則です。"]},{"type":"note","warn":true,"text":"本レッスンは一般的な情報であり、法的・税務的助言ではありません。前払式支払手段への該当や届出の要否は、発行の形態・規模により判断が異なります。回数券・会員制度を実際に設計する際は、管轄の財務局や専門家に必ず確認してください（2026年7月時点の制度に基づきます）。"}],"sources":[{"label":"関東財務局｜前払式支払手段（商品券・プリペイドカード等）関係","url":"https://lfb.mof.go.jp/kantou/kinyuu/pagekthp00400036.html","icon":"🏛️"},{"label":"日本資金決済業協会｜前払式支払手段発行業の概要","url":"https://www.s-kessai.jp/businesses/prepaid/prepaid_means_overview/","icon":"📜"},{"label":"日本資金決済業協会｜前払式支払手段Q&A（6か月内の適用除外）","url":"https://www.s-kessai.jp/businesses/prepaid/q_and_a/","icon":"📜"}]},{"title":"開業後の月次レビュー——数字3つと、すべての口コミ","blocks":[{"type":"p","text":"開業したら、マーケティングは「打つ」から「回す」に変わります。感覚ではなく、月に一度、決まった型で数字と声を振り返る。これだけで、開業後の意思決定の質がまるで変わります。道具はすべて無料で揃います。"},{"type":"h","text":"Googleビジネスプロフィールの「パフォーマンス」を開く"},{"type":"p","text":"オーナー確認済みのプロフィールでは、<b>パフォーマンス指標</b>を無料で確認できます。プロフィールの閲覧数、通話ボタンのクリック数、ルート検索した人数、ウェブサイトのクリック数、予約数——そして最も価値が高いのが<b>検索語句</b>です。あなたの店は「地域名＋サウナ」で見つかっているのか、それとも「個室サウナ\u2028〇〇市」なのか。客が実際に使った言葉が分かれば、プロフィールの説明文や投稿に使うべき言葉も決まります。期間を指定して集計できるので、月に一度、前月と見比べてください。"},{"type":"h","text":"ウェブサイトがあるならGA4を"},{"type":"p","text":"自前のサイトや予約ページを持つなら、<b>Googleアナリティクス（GA4）</b>を入れましょう。これも無料です。アナリティクスの画面でプロパティを作成し、発行される測定IDをWordPressなどのCMSに入力するか、サイトのheadタグにGoogleタグを貼れば計測が始まります（データ収集の開始まで最長30分ほど）。最初から全部を理解する必要はありません。「どのページが見られているか」「どこから来たか」——この2つだけ見れば十分です。"},{"type":"h","text":"月次レビューの型——30分で終わらせる"},{"type":"list","items":["<b>数字は3つだけ</b>に固定する：①入口（プロフィールの閲覧数と検索語句）、②来店（客数・回数券の消化率）、③声（口コミ・サ活の件数と内容）。指標を増やすほど、レビューは続かなくなります。","<b>その月の口コミとサ活を全部読む</b>。褒められた点は次の発信のネタに、指摘は改善リストへ。読み切れない量になったら、それは繁盛の証です。","<b>翌月のアクションを1つだけ決める</b>。「外観写真を撮り直す」「検索語句に『朝ウナ』が増えたので朝営業を告知する」。1つに絞るから、確実に実行されます。"]},{"type":"quote","text":"数字は嘘をつきません。ただし、見に行かない数字は、何も教えてくれません。"},{"type":"note","cool":true,"text":"パフォーマンス画面やGA4の指標名・画面構成は更新されることがあります（2026年7月時点）。名前が変わっても、見るべきものは変わりません——<b>入口・来店・声</b>。この3つを毎月同じ日に見る習慣が、あなたの店の羅針盤になります。"}],"sources":[{"label":"Google｜ビジネスプロフィールのパフォーマンス指標","url":"https://support.google.com/business/answer/9918094?hl=ja","icon":"📗"},{"label":"Google｜アナリティクスのセットアップ","url":"https://support.google.com/analytics/answer/9304153?hl=ja","icon":"📗"}]},{"title":"閑散期とリピート率——「年1回の客」を「月1回」に変える実務","blocks":[{"type":"p","text":"開業して1年もたつと、売上の波が見えてきます。日本政策金融公庫の景気動向等調査（2026年1〜3月期）によると、公衆浴場業の経営上の問題点で最多は<b>「店舗施設の狭隘・老朽化」の59.1％</b>。次いで、仕入価格や人件費の上昇分を価格に転嫁できない悩み（45.5％）と、すぐには動かせない問題が上位を占めます。一方、<b>「顧客数の減少」を挙げた浴場は27.3％</b>——全業種計（43.0％）より低いとはいえ、約4軒に1軒です。建物は明日には変えられませんが、客数は今日の仕込みで動かせます。このレッスンでは、閑散期に客足をどう保つか、一度来た客をどう再訪させるか——2つの実務に踏み込みます。"},{"type":"h","text":"閑散期の正体——「夏枯れ」を思い込みで語らない"},{"type":"p","text":"総務省統計局は家計調査から、温泉・銭湯入浴料への支出の季節性を分析しています。月別支出（2008〜2010年平均・二人以上の世帯）は<b>1月が278円で最多</b>、月平均195円の約1.4倍。支出が増えるのは「気温が低い月、休日が多い月」で、8月も休日の多さで1月に次いで多く、<b>最少は梅雨どきの6月（142円）</b>——1月のほぼ半分です。「夏は暇」と一括りにすると、打ち手を置く月を間違えます。データが古い点も踏まえ、レッスン6の月次レビューで<b>自店の谷</b>を特定してください。谷は立地と客層で必ずずれます。"},{"type":"h","text":"谷と平日昼を埋める——イベントは「小さく、定期で」"},{"type":"p","text":"厚生労働省は公衆浴場業向けの収益力向上マニュアルで、<b>「季節のイベント湯・変わり湯」はどこの銭湯でもすぐ始められる</b>打ち手だと勧めています。掲載された実例から、設計の型を拾いましょう。"},{"type":"list","items":["大阪・昭和湯は<b>毎週土曜の朝風呂</b>を始め、朝風呂だけの利用者が付きました。サウナなら、谷の月や平日昼に定例のロウリュ・熱波の時間を置く発想です。単発の大花火より「毎週この時間にある」ことが習慣を作ります。","東京・はすぬま温泉は京急電鉄とのコラボ「京急に乗って銭湯に行こう！スタンプラリー」など地域イベントに積極参加。<b>コラボは相手の客に自店を知らせる仕組み</b>で、広告費ゼロの新規接点です。地元の飲食店やランニングチームも候補です。","営業前・休業日の館内での有料イベント（寄席・コンサート等）も紹介されています。稼働ゼロの時間帯の収益化ですが、<b>興行場法など他法令の適用があり得る</b>との注記付きです（下のnote参照）。","イベントはレッスン4のプレスリリースの「ニュースの種」にもなります。谷の月に合わせて仕込めば一石二鳥です。"]},{"type":"h","text":"値引きしない勇気——安さより「今月行く理由」"},{"type":"p","text":"同じ公庫調査に、心強い現場の声があります。鳥取県の浴場は<b>「入浴料金を上げたが客足に影響はなく、売上が増加した」</b>。実際、公衆浴場業の客単価DIは2025年以降の5四半期すべてプラスで、経営上の問題点に「客単価の低下」を挙げた浴場は<b>わずか4.5％</b>（全業種計16.1％）。業界は値段を守れています。閑散期を安売りで埋めたくなりますが、値引きは繁忙期の支払意欲まで下げ、元に戻すときに必ず反発を生みます。作るべきは安さではなく<b>「今月行く理由」</b>。変わり湯・イベント・限定サービスで理由を用意し、料金は守る。回数券で単価を守る設計はレッスン5で見た通りです。"},{"type":"h","text":"リピート率——「年1回の客」を「月1回」へ"},{"type":"p","text":"中小機構J-Net21の消費者調査（2021年）では、スーパー銭湯の利用頻度は<b>「年1回以下」が62％で最多</b>。2017年版の調査も「リピート率の低さが課題」と指摘しています。裏を返せば、再訪率をわずかに上げるだけで、新規獲得よりはるかに安く売上が動くということ。目標は厚労省マニュアルの言葉そのままです——<b>「入浴体験を年1回が月1回に、そして週1回となるよう導こう」</b>。"},{"type":"list","items":["名古屋・平田温泉は、ロビーを地域の人の作品展示に無料で貸し出し、今では<b>日程の空きがなくなるほど</b>。常連が「客」から「参加者」に変わると、店は代替の利かない居場所になります。","厚労省マニュアルが挙げる常連向け企画は、応募型の写真・作品展示、オリジナル手ぬぐいや記念品など。<b>割引ではなく「関わりしろ」を配る</b>のが共通点です。","公庫調査には「常連客は高齢化しており減少が見込まれる」という神奈川県の浴場の声もあります。常連は放置すれば自然に減ります。新しい常連を育て続ける仕組みこそが、コミュニティづくりの本体です。"]},{"type":"note","warn":true,"text":"イベント開催や館内の貸出しには、内容により興行場法・食品衛生法など入浴以外の法令や条例が適用されることがあり、要否は自治体により異なります。実施前に保健所等の窓口へ確認してください。本レッスンは一般的な情報であり、法的助言ではありません。統計・調査結果は各公表時点のものです（2026年7月時点で確認）。"},{"type":"quote","text":"閑散期は、待てば過ぎます。ただし、何も仕込まなかった閑散期は、ただの赤字の月として過ぎていきます。"}],"sources":[{"label":"総務省統計局｜家計ミニトピックス「温泉・銭湯入浴料への支出」","url":"https://www.stat.go.jp/data/kakei/tsushin/pdf/24_1.pdf","icon":"📊"},{"label":"厚生労働省｜今日から実践！収益力の向上に向けた取組みのヒント（公衆浴場業編）","url":"https://www.mhlw.go.jp/content/000505173.pdf","icon":"🏛️"},{"label":"日本政策金融公庫｜生活衛生関係営業の景気動向等調査結果（2026年1〜3月期）","url":"https://www.jfc.go.jp/n/findings/pdf/seikatsu2026_0428a.pdf","icon":"🏦"},{"label":"中小機構\u2028J-Net21｜市場調査データ\u2028スーパー銭湯（2021年版）","url":"https://j-net21.smrj.go.jp/report/research/service/cons-supersento2.html","icon":"🏛️"},{"label":"中小機構\u2028J-Net21｜スーパー銭湯（2017年版）","url":"https://j-net21.smrj.go.jp/report/research/service/cons-supersento.html","icon":"🏛️"}]}]},{"moduleId":"risk","title":"安全運営ゼミ","icon":"🛟","subtitle":"安全運営ゼミ｜最悪を想定する者が、店と客の命を守る","intro":"無料章では入浴事故の実態・衛生の基準・保険の存在を学びました。この有料ゼミが扱うのは、その「先」です。人が倒れた瞬間に誰が119番を押すのか。レジオネラを毎日どう潰すのか。保険の見積りで何を伝えるのか。スタッフに何を教える法的義務があるのか。カスハラからどう従業員を守るのか。すべてを行政の一次資料に当たり、現場が回せる「仕組み」に落とし込みます。楽しい場所ほど、備えが問われます。","lessons":[{"title":"事故対応フローを「紙」に落とす——119番の判断とチームの動き方","blocks":[{"type":"p","text":"無料章では入浴事故の予防を学びました。ここからは、<b>予防をすり抜けて実際に人が倒れた瞬間</b>の話です。パニックのなかで冷静に動ける店は、例外なく「やることが紙に書いてある」店です。頭で覚えるのではなく、レジ裏や事務所の壁に貼っておく。まずは、判断の基準を行政の資料から引きます。"},{"type":"h","text":"ためらわず119番を呼ぶ——消防庁の判断基準"},{"type":"p","text":"消防庁のリーフレット「救急車を上手に使いましょう」は、大人が<b>突然こうなったらすぐ119番</b>という症状を具体的に挙げています。このうち、サウナの現場で起こりうるものを抜き出すと、判断がぶれません。"},{"type":"list","items":["意識の障害——<b>意識がない（返事がない）、またはもうろうとしている、ぐったりしている</b>","けいれん——けいれんが止まらない／止まっても意識が戻らない","胸や背中——急な息切れ・呼吸困難、胸の中央が締め付けられる痛みが2〜3分続く","強い吐き気——冷や汗を伴うような強い吐き気（熱中症でしばしば出る）","頭——突然の激しい頭痛、突然の高熱、支えなしで立てないほど急にふらつく","けが・やけど——大量の出血を伴うけが、広範囲のやけど","事故——水風呂などで<b>おぼれている</b>、転倒・転落で強い衝撃を受けた"]},{"type":"p","text":"消防庁は最後に「<b>その他、いつもと違う場合、様子がおかしい場合</b>」も対象だと明記しています。迷う症状こそ、これに当てはめてください。判断に迷ったら救急相談窓口<b>♯7119</b>（救急安心センター事業。医師・看護師・救急救命士が対応し、緊急なら119番へ転送・かけ直しを要請）や、消防庁の全国版救急受診アプリ「Q助」も使えます。ただし<b>♯7119は未実施の地域があります（実施状況は自治体により異なる）</b>。自店の地域で使えるかを開業準備の段階で確認し、使えない地域なら地域の救急相談窓口を対応フローに書き込んでおきましょう。本筋は、迷う“間”を作らない設計です。"},{"type":"h","text":"119番で伝える5つ（順番が決まっている）"},{"type":"list","items":["①「<b>救急です</b>」と最初に伝える","②\u2028来てほしい住所を<b>市町村名から</b>（分からなければ近くの大きな建物・交差点など目印を）","③\u2028誰が、どうなったかを簡潔に。<b>分かる範囲で意識・呼吸の有無</b>を伝える","④\u2028具合の悪い方の年齢（分からなければ「60代」などおおよそで可）","⑤\u2028通報者の名前と、通報後も連絡が取れる電話番号"]},{"type":"p","text":"緊急性が高いと判断されれば、指令員は<b>すべて聞き終える前に救急車を出動</b>させます。あわてず、順番に答えれば大丈夫です。"},{"type":"h","text":"救急車が来るまでの「役割分担」を決めておく"},{"type":"list","items":["<b>通報係</b>：119番。指令員の口頭指導で応急手当を進める","<b>応急手当・胸骨圧迫係</b>：反応と呼吸を確認し、必要なら心肺蘇生","<b>AED係</b>：AEDを取りに走る（設置場所を全員が知っていること）","<b>誘導係</b>：救急車の音が近づいたら入口へ。案内・誘導すると<b>到着が早まる</b>","<b>客の動線を仕切る係</b>と<b>記録係</b>：何時に何が起きたかを書き留める"]},{"type":"note","cool":true,"text":"応急手当は119番の通信指令員が電話口で口頭指導してくれます。<b>AEDの設置場所</b>と、スタッフの<b>心肺蘇生・AED講習</b>（最寄りの消防署で受講できます）はセットで用意を。ワンオペの時間帯こそ、「最初の一人がまず何をして、次に誰を呼ぶか」を紙に落とすことが命綱になります。"},{"type":"note","warn":true,"text":"本講義は一般的な情報であり、医療的・法的助言ではありません。実際の救急対応・症状の判断は、119番・♯7119・医療機関の指示に必ず従ってください。"}],"sources":[{"label":"総務省消防庁｜救急車利用マニュアル（救急お役立ちポータル）","url":"https://www.fdma.go.jp/publication/portal/post2.html","icon":"🚒"},{"label":"消防庁｜救急車を上手に使いましょう（令和7年10月発行リーフレット）","url":"https://www.fdma.go.jp/publication/portal/items/portal002_japanese.pdf","icon":"🚒"},{"label":"消防庁｜救急安心センター事業（♯7119）ってナニ？","url":"https://www.fdma.go.jp/mission/enrichment/appropriate/appropriate007.html","icon":"🚒"}]},{"title":"火災と避難——「特定防火対象物」だからこそ訓練義務がある","blocks":[{"type":"p","text":"サウナは、<b>火・高温・薄着の客</b>が同居する空間です。許認可（無料章の消防法の話）の一歩先にあるのが、開店後にずっと続く「避難訓練の義務」。ここを知らずに営業している店は、実は少なくありません。"},{"type":"h","text":"サウナは消防法上の「特定防火対象物」"},{"type":"p","text":"サウナ（蒸気浴場・熱気浴場）は、消防法施行令別表第一の<b>(9)項イ</b>「蒸気浴場、熱気浴場その他これらに類するもの」に分類されます。不特定多数が出入りする<b>特定用途防火対象物</b>であり、銭湯（(9)項ロ）より一段厳しく扱われます。この「特定用途」であることが、訓練の回数に直結します。"},{"type":"h","text":"消火訓練・避難訓練は「年2回以上」"},{"type":"list","items":["特定用途防火対象物は、<b>消火訓練および避難訓練を年2回以上</b>実施する義務がある（消防法第8条、消防法施行規則第3条第10項）","訓練を行う前には、あらかじめ<b>消防署へ通報</b>する（電子申請または「自衛消防訓練通知書」の提出。同規則第3条第11項）","訓練は<b>通報訓練・消火訓練・避難訓練</b>の部分訓練と、これらを一連で行う総合訓練に分かれる","訓練は思いつきでやるものではなく、選任した防火管理者が作成する<b>消防計画</b>に基づいて実施する"]},{"type":"h","text":"サウナ特有の避難導線を織り込む"},{"type":"list","items":["客は<b>裸・薄着で逃げる</b>——避難口・館内着・タオル・毛布の位置を動線に組み込む","蒸気・熱気で<b>視界が悪い</b>——誘導灯・非常灯、停電時の懐中電灯を確認","高温で<b>判断力が落ちた客</b>がいる前提で、声かけと誘導の役割を決める","サウナストーブ・薪・電気ヒーターの<b>火元管理</b>と、消火器の位置・使い方を全員が把握"]},{"type":"note","cool":true,"text":"訓練は「やった記録」を残すことに意味があります。消防計画・訓練の通知書・実施記録は、消防の立入検査（査察）でも確認される書類です。年2回を“こなす”のではなく、スタッフが体で動けるようになるまで繰り返すのが本来の目的です。"},{"type":"note","warn":true,"text":"本講義は一般的な情報であり、法的助言ではありません。訓練回数・防火管理者の要否・消防計画の細部は、消防法令および各自治体の火災予防条例で異なります。必ず管轄の消防署にご確認ください。"}],"sources":[{"label":"総務省消防庁｜サウナ設備に係る消防法の関係規定（別表第一(9)項イ）","url":"https://www.fdma.go.jp/singi_kento/kento/items/post-154/01/shiryou4.pdf","icon":"🚒"},{"label":"東京消防庁｜自衛消防訓練を実施しましょう（消防法第8条・施行規則第3条）","url":"https://www.tfd.metro.tokyo.lg.jp/fs/marunouti/jiei.html","icon":"🚒"}]},{"title":"衛生管理を「毎日・毎週・毎月」の作業表にする","blocks":[{"type":"p","text":"レジオネラも大腸菌も、事故と同じで「日々の作業の積み重ね」でしか防げません。無料章で学んだ水質<b>基準</b>を、現場が回せる<b>作業表</b>に落とすのがこの講です。厚労省の「公衆浴場における衛生等管理要領」と「入浴施設の衛生管理の手引き」に、頻度まで具体的に書かれています。"},{"type":"h","text":"清掃・消毒の頻度（衛生等管理要領の別表）"},{"type":"list","items":["脱衣室・浴室の<b>人が直接触れる所</b>（床・壁・洗い桶・腰掛など）→\u2028毎日清掃、<b>1か月に1回以上消毒</b>","浴槽\u2028→\u2028<b>毎日完全に換水して清掃</b>。難しい場合でも<b>1週間に1回以上</b>は完全換水して清掃","ろ過器・循環配管\u2028→\u2028<b>1週間に1回以上</b>、十分に逆洗浄して汚れを排出し、生物膜を除去・消毒","集毛器\u2028→\u2028毎日清掃・消毒。シャワーヘッドとホース\u2028→\u20286か月に1回以上点検、<b>年1回以上洗浄・消毒</b>","貯湯槽\u2028→\u2028湯の補給口・底部まで<b>60℃以上</b>（最大使用時でも55℃以上）に保つ"]},{"type":"h","text":"遊離残留塩素は「1〜2時間ごと」に測る"},{"type":"list","items":["浴槽水の遊離残留塩素は<b>通常0.4mg/L程度</b>を保ち、<b>最大1mg/Lを超えない</b>よう努める（結合塩素のモノクロラミンの場合は3mg/L程度）","手引きは、注入や溢水・入浴者数で濃度が容易に変わるため、<b>1時間毎あるいは2時間毎など頻繁に測定</b>することを推奨","測定結果は<b>検査の日から3年間保管</b>する"]},{"type":"h","text":"水質検査の頻度（浴槽の型で変わる）"},{"type":"list","items":["ろ過器を使っていない浴槽・毎日完全換水する浴槽\u2028→\u2028<b>1年に1回以上</b>","連日使用している（循環式）浴槽\u2028→\u2028<b>1年に2回以上</b>（塩素消毒でない場合は1年に4回以上）","浴槽水の基準\u2028→\u2028<b>濁度5度以下／大腸菌群1個/mL以下／レジオネラ属菌は不検出（10cfu/100mL未満）</b>。結果は3年間保管"]},{"type":"h","text":"基準を外れたときの初動（手引きの例）"},{"type":"p","text":"手引きは、たとえば残留塩素が0.4mg/Lを下回ったときの流れをこう示します。<b>担当責任者に直ちに報告\u2028→\u2028記録簿でいつから下回っていたかを確認\u2028→\u2028測定方法・状況を確認\u2028→\u2028消毒装置を点検・修理\u2028→\u2028必要なら高濃度塩素消毒\u2028→\u2028必要ならレジオネラ検査\u2028→\u2028対応を記録</b>。レジオネラは<b>生物膜に守られて消毒剤が効きにくい</b>ため、「消毒するだけ」では不十分で、生物膜そのものを除去することが決定的です。記録簿は、異常を早く見つける道具であり、同時にあなたを守る証拠になります。"},{"type":"note","warn":true,"text":"本講義は一般的な情報であり、専門的助言ではありません。水質基準・検査頻度・記録は、各自治体の条例・要綱で項目や頻度が上乗せされることがあります。実際の運用は必ず管轄の保健所にご確認ください。"}],"sources":[{"label":"厚生労働省｜公衆浴場における衛生等管理要領（別添1・別添2）","url":"https://www.mhlw.go.jp/content/11130500/001171614.pdf","icon":"🏛️"},{"label":"厚生労働省｜入浴施設の衛生管理の手引き","url":"https://www.mhlw.go.jp/content/11130500/001401967.pdf","icon":"🏛️"}]},{"title":"保険は「掛け捨て」ではなく事業の設計——何を、どう見積もるか","blocks":[{"type":"p","text":"無料章では施設賠償責任保険の存在を学びました。実務で大事なのは、<b>どのリスクに、どの保険を当てるか</b>という地図を持つことです。まず全体像を、業界横断の公式資料から整理します。"},{"type":"h","text":"温浴業の「6つのリスク」と対応する保険"},{"type":"p","text":"日本損害保険協会「企業のための保険ナビ」は、企業が直面するリスクを6つに整理しています。サウナ経営に引き当てると、優先順位が見えてきます。"},{"type":"list","items":["<b>企業財産のリスク</b>（火災・自然災害で建物や設備が損害）→\u2028企業向け火災保険・動産総合保険","<b>事業中断・利益減少のリスク</b>（火災で営業休止）→\u2028休業補償保険","<b>賠償責任のリスク</b>（客にケガをさせた・情報漏えい）→\u2028施設賠償責任保険・サイバー保険","<b>従業員のリスク</b>（労働災害）→\u2028労働災害総合保険（政府労災の上乗せ）","<b>経営者・役員のリスク</b>／<b>社用車のリスク</b>\u2028→\u2028会社役員賠償責任保険・企業向け自動車保険"]},{"type":"h","text":"施設賠償責任保険が払う「損害の種類」"},{"type":"p","text":"施設賠償責任保険（施設所有・管理者賠償責任保険）は、施設の構造上の欠陥や管理の不備、業務活動中のミスで他人をケガさせたり物を壊したりして<b>法律上の賠償責任</b>を負ったときに備えます。保険会社の商品説明では、支払われる損害は次のように分かれます。"},{"type":"list","items":["<b>損害賠償金</b>（治療費・修理費など。相手への遅延損害金を含む）","<b>損害防止費用・権利保全行使費用</b>","<b>緊急措置費用</b>（事故時に被害者へ行った応急手当などの費用）","<b>争訟費用</b>（訴訟費用・弁護士報酬等）——転倒でのケガ、看板の落下、業務中の不注意などが対象例"]},{"type":"h","text":"見積りのとき「何を伝えるか」"},{"type":"p","text":"保険料は、施設の種類・仕事の内容に加えて、<b>面積・入場者数・延べ利用人数・売上高</b>などの見込み数値に対する割合で決まることが多く、実績が確定した後に精算する契約もあります。だから見積り依頼時は、次を整理して複数社に当たると精度が上がります。"},{"type":"list","items":["延床面積／年間の見込み売上高／想定客数（延べ利用人数）","提供サービス（ロウリュ・アウフグース・アカスリ・飲食併設・宿泊併設の有無など）","希望する<b>支払限度額</b>と免責金額（自己負担額）"]},{"type":"note","cool":true,"text":"支払限度額の設定例（身体障害：1名あたり◯円・1事故あたり◯円、財物損壊：1事故あたり◯円）は保険会社が提示します。数字は施設規模で大きく変わるので、ネット上の「相場」を鵜呑みにせず、自店の条件で見積りを取ることが基本です。"},{"type":"note","warn":true,"text":"本講義は一般的な情報であり、保険募集や税務・法的助言ではありません。補償内容・約款・特約は保険会社ごとに異なります。加入判断は必ず保険会社・代理店にご確認ください。"}],"sources":[{"label":"日本損害保険協会｜企業のための保険ナビ（企業の6大リスクと保険）","url":"https://www.sonpo.or.jp/sme_insurance/","icon":"🏦"},{"label":"三井住友海上｜施設所有（管理）者賠償責任保険\u2028パンフレット","url":"https://www.ms-ins.com/pdf/business/indemnity/shisetsu.pdf","icon":"🏦"}]},{"title":"スタッフの安全教育は「法律で決まった義務」","blocks":[{"type":"p","text":"人を一人でも雇った瞬間、あなたには安全教育の<b>法的義務</b>が生じます。「見て覚えて」で済ませていると、事故が起きたときに従業員も店も守れません。ここは労働基準監督署も実地調査でよく指摘する、盲点になりがちな領域です。"},{"type":"h","text":"雇入れ時の安全衛生教育（安衛法59条・安衛則35条）"},{"type":"p","text":"労働者を雇い入れたら、<b>遅滞なく</b>その業務に関する安全衛生教育を行う義務があります（労働安全衛生法第59条、労働安全衛生規則第35条）。対象は正社員だけでなく、<b>パート・アルバイト・短時間労働者も含む全労働者</b>。労基署は「短時間労働者に実施していない事業場が多い」と注意喚起しています。"},{"type":"h","text":"教育すべき8項目（2024年4月から全業種で必須）"},{"type":"list","items":["①\u2028機械・原材料等の危険性・有害性とこれらの取扱い方法","②\u2028安全装置・保護具の性能とこれらの取扱い方法","③\u2028作業手順に関すること","④\u2028作業開始時の点検に関すること","⑤\u2028業務で発生するおそれのある疾病の原因と予防","⑥\u2028整理・整頓・清潔の保持","⑦\u2028事故時等における応急措置と退避","⑧\u2028その他、その業務の安全衛生に必要な事項"]},{"type":"p","text":"従来は一部の業種で①〜④を省略できましたが、<b>2024年4月の改正</b>で省略規定が廃止され、全業種に適用されるようになりました（無料章・集客とブランディングの労務レッスンでも触れた通りです）。つまり現在は<b>全業種・全雇用形態で8項目すべてが必須</b>。サウナ店も当然、対象です。"},{"type":"h","text":"サウナ店に「翻訳」した教育メニュー例"},{"type":"list","items":["ストーブ・熱源のやけど／火災リスクと消火器の使い方（①②⑦）","ロウリュ・アウフグースの安全な所作と、客への声かけ手順（③）","開店前の温度計・湿度・水質・遊離残留塩素・設備の点検（④）","熱中症・ヒートショックの兆候と対応、飲酒客・体調不良客への対応（⑤）","清掃・消毒の手順とレジオネラ対策、生物膜の除去（⑤⑥）","客が倒れたときの119番と役割分担（⑦。第1講の事故対応フローと接続する）"]},{"type":"p","text":"あわせて、<b>雇入れ時の健康診断</b>（安衛則第43条）も忘れずに。「常時使用する労働者」を雇い入れるときは11項目の健診を行い、費用は<b>事業者負担が原則</b>です。"},{"type":"note","warn":true,"text":"本講義は一般的な情報であり、法的・社会保険労務上の助言ではありません。労働法・社会保険の適用は雇用形態や労働時間で異なります。実際の運用は社会保険労務士・労働基準監督署にご確認ください。"}],"sources":[{"label":"厚生労働省\u2028職場のあんぜんサイト｜安全衛生教育","url":"https://anzeninfo.mhlw.go.jp/yougo/yougo68_1.html","icon":"🏛️"},{"label":"東京労働局｜安全衛生教育（雇入れ時の教育・特別教育・職長教育）","url":"https://jsite.mhlw.go.jp/tokyo-roudoukyoku/hourei_seido_tetsuzuki/anzen_eisei/a-kyoiku.html","icon":"🏛️"}]},{"title":"クレームとカスハラ——「線引き」と初動、そしてSNS炎上","blocks":[{"type":"p","text":"客商売である以上、クレームはゼロにできません。大事なのは、<b>正当なクレーム</b>と<b>カスタマーハラスメント</b>を線引きし、後者から従業員を守る仕組みを持つことです。厚生労働省が企業向けマニュアルを公表しており、しかもこの分野は法律が動きました。"},{"type":"h","text":"カスハラは「クレーム全部」ではない"},{"type":"p","text":"厚労省のマニュアルは、顧客等からのクレームには<b>商品・サービスの改善を求める正当なもの</b>がある一方で、<b>過剰な要求や、不当な言いがかりをつける悪質なもの</b>＝カスタマーハラスメントがある、と整理します。すべてのクレームを敵視するのではなく、悪質なものから従業員を守る対応が求められる、という考え方です。"},{"type":"h","text":"2026年10月、カスハラ対策が「義務」になる"},{"type":"p","text":"2025年6月に成立した<b>改正労働施策総合推進法</b>により、<b>2026年（令和8年）10月1日</b>から、事業主にはカスタマーハラスメント防止のため雇用管理上必要な措置を講じることが<b>義務化</b>されます。対象は従業員を1人でも雇うすべての企業。国は指針も策定済みです。小さなサウナ店も例外ではなく、準備は今から始めるのが得策です。"},{"type":"h","text":"現場で回す初動（複数人・記録・エスカレーション）"},{"type":"list","items":["<b>対応者を一人にしない</b>。組織として対応する体制をあらかじめ決めておく","事実を落ち着いて聞き取り、<b>線引き基準</b>に照らして、対応の主導権を個人から店に移す","<b>記録項目をテンプレ化</b>（日時・相手・言動の内容・対応者・経緯）し、録音のルールも決めておく","「殺されたいのか」等の脅迫的発言、反社会的勢力とのつながりをほのめかす、異常に接近する——こうした行為には毅然と。悪質なら<b>弁護士・警察</b>へ"]},{"type":"h","text":"SNS炎上・誹謗中傷の初動"},{"type":"list","items":["「SNSにあげる」「口コミで悪く評価する」といった<b>威圧もカスハラの一類型</b>。ブランドイメージを盾に取る要求に屈しない","掲示板・SNS上で名誉を毀損する投稿は、まず<b>掲載先の運営者（管理人）に削除</b>を求める","損害賠償や<b>発信者情報の開示</b>を請求したい場合は、必要に応じて弁護士に相談。名誉毀損として投稿者の処罰を望む場合は弁護士・警察へ","削除の求め方が分からないときは、<b>法務局</b>や<b>違法・有害情報相談センター</b>、<b>誹謗中傷ホットライン（セーファーインターネット協会）</b>に相談できる"]},{"type":"note","cool":true,"text":"線引き基準・初動フロー・記録テンプレ・相談先リストを1枚にまとめて、レジ裏に貼っておく。第1講の事故対応フローと同じで、<b>「その場で考えない」仕組み</b>が、対応する従業員の心を守ります。"},{"type":"note","warn":true,"text":"本講義は一般的な情報であり、法的助言ではありません。個別の対応の適否やSNS投稿への法的措置は事案によって異なります。実際の判断は弁護士・警察・行政の相談窓口に必ずご確認ください。"}],"sources":[{"label":"厚生労働省｜カスタマーハラスメント対策企業マニュアル","url":"https://www.mhlw.go.jp/content/11900000/000915233.pdf","icon":"🏛️"},{"label":"厚生労働省｜令和7年労働施策総合推進法等の一部改正について（カスハラ対策義務化）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyoukintou/zaitaku/index_00003.html","icon":"🏛️"}]},{"title":"災害と設備故障に備える——小さな店の事業継続計画（ジギョケイ）","blocks":[{"type":"p","text":"第1講では人が倒れた瞬間を、第2講では火災を扱いました。この講のテーマは、<b>店そのものが止まる日</b>です。地震、台風、停電、断水、そしてストーブやチラーの故障。小さな店に代わりの店舗はありません。「止まった日に何をするか」を平時のうちに紙にする——その型を、国が用意しています。"},{"type":"h","text":"営業判断は「警戒レベル」で事前に決めておく"},{"type":"p","text":"台風や大雨の日に「開けるか、閉めるか」を直感で決めるのは危険です。気象庁は防災気象情報を5段階の<b>警戒レベル</b>に整理しています。レベル3は<b>高齢者等は危険な場所から避難</b>し、ほかの人も普段の行動を見合わせたり避難準備を始めたりする段階。レベル4は<b>避難指示が出ていなくても自ら避難を判断</b>する段階。レベル5は、すでに災害が発生している可能性が極めて高く<b>直ちに身の安全を確保</b>する段階です。雨の危険度は地図で色分けされる「キキクル」でも確認できます。自店のルールに落とすと、たとえば——"},{"type":"list","items":["<b>レベル3の発表で新規受付を止めて閉店準備</b>——客とスタッフに帰宅手段があるうちに帰ってもらう","<b>レベル4までに全員退店・施錠・退避</b>。レベル4以降の営業継続や「様子見出勤」はしない","台風は進路予報の段階で<b>前日までに休業を告知</b>し、当日の判断を残さない","地震では、まず第2講の避難導線で客を誘導。<b>熱源の停止と館内の安全確認</b>が済むまで再入場させない"]},{"type":"h","text":"停電・断水・設備故障——「モノ」の弱点を先に洗う"},{"type":"p","text":"サウナは<b>電気・水・熱の塊</b>です。停電すればろ過も塩素注入も止まり、断水すれば洗体も清掃もできません。ライフラインが戻っても第3講の水質基準を満たすまでは開けられない——<b>再開は完全換水と清掃・消毒から</b>という前提で段取りを組みます。設備故障は、災害がなくても突然来ます。"},{"type":"list","items":["ストーブ・チラー・ろ過器ごとに<b>メーカーと保守業者の緊急連絡先</b>を一覧にして事務所に掲示する","保守契約は<b>駆けつけまでの時間・交換部品の保有・代替機の有無</b>の3点を確認して選ぶ","チラー停止時に<b>水風呂なしで営業するか、休業するか</b>を事前に決めておく——当日の思いつきで決めない","部品交換・点検はメーカー指示に従い、<b>記録を残す</b>（第3講の記録簿と同じ思想です）"]},{"type":"h","text":"休業の告知は「初動対応」の一部"},{"type":"p","text":"次に紹介するジギョケイの手引きでは、発災直後の初動対応として<b>顧客への対応方法</b>（避難場所の周知・誘導体制）を、続いて<b>被害状況の把握と、復旧の見通しを含む関係者への報告・対外的な情報発信</b>を計画に書き込みます。小さな店に翻訳すれば、予約客への連絡手段（予約システム・SNS・店頭掲示）と告知文の型——<b>何が起きたか・いつまで休むか・予約はどうなるか・再開はどこで知らせるか</b>——を平時に用意しておくこと。早く正確に告知できる店は、再開時にも信頼されます。"},{"type":"h","text":"国の認定制度「ジギョケイ」で1枚の計画に束ねる"},{"type":"p","text":"ここまでの備えを束ねる型が、中小企業庁の<b>事業継続力強化計画（通称ジギョケイ）</b>です。中小企業の防災・減災の事前対策の計画を経済産業大臣が認定する制度で、<b>「中小企業のための取り組みやすいBCP」</b>と位置づけられ、申請は電子申請で完結します。"},{"type":"list","items":["作る内容は5ステップ——<b>①目的\u2028②ハザードマップでリスクを確認し「ヒト・モノ・カネ・情報」への影響を想定\u2028③発災時の初動対応\u2028④事前対策\u2028⑤年1回以上の訓練と見直し</b>","認定のメリットは<b>税制措置・金融支援・補助金の加点</b>など。認定ロゴマークを広報に使える","税制措置（中小企業防災・減災投資促進税制）は、認定日から1年以内に計画記載の対象設備を取得して事業に使うと<b>特別償却16%</b>（2026年7月時点。認定は2027年3月31日まで・要件あり）","社内に知見がなければ、<b>中小機構の専門家派遣</b>やポータルサイトの策定支援を使える"]},{"type":"note","cool":true,"text":"まずは国土交通省の<b>ハザードマップポータルサイト</b>で自店の浸水・土砂リスクを見るところから。ジギョケイは特別な計画ではありません。第1講の事故フロー、第2講の避難訓練、第3講の記録簿、第4講で見た休業補償や財産の保険——このゼミでやってきたことを、災害という切り口で1枚に束ねる作業です。"},{"type":"note","warn":true,"text":"本講義は一般的な情報であり、法的・税務上の助言ではありません。税制・支援策は2026年7月時点の内容で、年度改正等で変わります。適用は経済産業局・税理士等にご確認ください。警戒レベルの運用や避難情報の発令は自治体により異なります。避難の判断は自治体・気象庁の最新情報に従ってください。"}],"sources":[{"label":"気象庁｜防災気象情報と警戒レベルの対応について","url":"https://www.jma.go.jp/jma/kishou/know/bosai/alertlevel.html","icon":"🏛️"},{"label":"中小企業庁｜事業継続力強化計画（認定制度・防災減災投資促進税制）","url":"https://www.chusho.meti.go.jp/keiei/antei/bousai/keizokuryoku.html","icon":"🏛️"},{"label":"中小企業庁｜事業継続力強化計画\u2028策定の手引き（令和8年2月18日版）","url":"https://www.chusho.meti.go.jp/keiei/antei/bousai/download/keizokuryoku/tebiki_tandoku.pdf","icon":"🏛️"}]}]}];
function zemiLectureHTML(mid){
  const m=ZEMI_LECTURES.find(x=>x.moduleId===mid);
  if(!m)return "<p>講義が見つかりません。</p>";
  const lessons=m.lessons.map((L,i)=>{
    const blocks=L.blocks.map(renderBlock).join("");
    const srcs=L.sources&&L.sources.length?`<div class="sources">
    <div class="st">◆ 出典・参考リンク</div>
    ${L.sources.map(s=>`<a class="srccard" href="${s.url}" target="_blank" rel="noopener">
      <div class="si">${s.icon||'🔗'}</div>
      <div class="sx"><b>${esc(s.label)}</b><span>${(()=>{try{return new URL(s.url).hostname;}catch(e){return s.url;}})()}</span></div>
      <div class="go">開く ↗</div></a>`).join("")}
  </div>`:"";
    const ck=!!(S.zemiChecklist&&S.zemiChecklist[zemiLecKey(m.moduleId,i)]);
    return `<div class="zlec-lesson" id="zlec_${m.moduleId}_${i}">
      <div class="zlec-num">第${i+1}講</div>
      <h3 class="zlec-title">${esc(L.title)}</h3>
      ${blocks}${srcs}
      <div class="zchk-list" style="margin:20px 0 0"><div class="zchk-item${ck?' done':''}" onclick="zemiLecCheck('${m.moduleId}',${i})">
        <input type="checkbox" ${ck?'checked':''} onclick="event.stopPropagation();zemiLecCheck('${m.moduleId}',${i})">
        <div><div class="zc-t">✔ 第${i+1}講を理解した</div><div class="zc-sub">チェックはこの端末に保存され、講義の理解度に反映されます</div></div>
      </div></div>
    </div>`;
  }).join("");
  const lecDone=zemiLecDoneCount(m);
  const lecPct=m.lessons.length?Math.round(lecDone/m.lessons.length*100):0;
  const toc=m.lessons.map((L,i)=>{
    const ck=!!(S.zemiChecklist&&S.zemiChecklist[zemiLecKey(m.moduleId,i)]);
    return `<div class="ztoc-row${ck?' done':''}" onclick="const el=document.getElementById('zlec_${m.moduleId}_${i}');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})">
      <span class="ztoc-n">${ck?'✓':(i+1)}</span><span class="ztoc-t">${esc(L.title)}</span>
    </div>`;
  }).join("");
  return `<div class="zemi-hero" style="padding:24px 26px;margin-bottom:6px">
    <div class="badge">${m.icon} ${esc(m.subtitle)}</div>
    <h2 style="font-family:var(--serif);font-weight:800;font-size:clamp(20px,3.2vw,26px);margin:0 0 10px;line-height:1.5">${esc(m.title)}</h2>
    <p style="color:var(--cream-dim);font-size:14.5px;margin:0;line-height:1.9">${m.intro}</p>
    <div style="margin:16px 0 0;display:flex;align-items:center;gap:14px">
      <div class="chprog" style="height:9px;flex:1"><i style="width:${lecPct}%"></i></div>
      <span style="font-family:var(--label);color:var(--cream-dim);font-size:12.5px;white-space:nowrap">理解度 ${lecDone}/${m.lessons.length}講</span>
    </div>
  </div>
  <div class="ztoc"><div class="ztoc-head">この講義の目次</div>${toc}</div>
  ${lessons}
  <div class="block"><div class="note cool">本講義録は2026年7月時点の情報に基づく一般的な情報であり、法的・税務的・医療的助言ではありません。制度・金額は変わります。実際の判断は必ず各出典・行政窓口・専門家にご確認ください。</div></div>`;
}
const ZEMI_CODE = "SAUNAOWNER2026";

const ZEMI_NOTE_URL = "https://note.com/"; /* TODO: 実際のnote商品URLに差し替え */
let ZEMI_TOOL = "lec_gyotai";
const ZEMI_FORM = {}; /* ツール切替時の入力値退避 */
const zNum = id => Math.max(0, +document.getElementById(id).value || 0);
function zemiEligible(){return S.done.length>=totalLessons();}
function zemiFunnelHTML(){
  if(S.zemiUnlocked)return `<div class="note cool" style="margin-top:26px">🎓 この章の"実務の続き"は<b>経営ゼミ</b>の講義録で深掘りできます。<button class="btn ghost" style="margin-left:10px;padding:7px 14px;font-size:12.5px" onclick="go('zemi')">ゼミを開く</button></div>`;
  return `<div class="note" style="margin-top:26px">🎓 この章の"実務の続き"——創業計画書の書き方、保健所相談の実務、立地と商圏の読み方——は<b>経営ゼミ</b>（全6ゼミ40講・約5.2万字＋実践ツール6種、¥3,000税込）で。<b>全カリキュラムを修了した人だけ</b>が入校できます。<button class="btn ghost" style="margin-left:10px;padding:7px 14px;font-size:12.5px" onclick="go('zemi')">詳しく見る</button></div>`;
}
function zemiLecKey(mid,i){return "lec_"+mid+"_"+i;}
function zemiLecDoneCount(m){let n=0;for(let i=0;i<m.lessons.length;i++){if(S.zemiChecklist&&S.zemiChecklist[zemiLecKey(m.moduleId,i)])n++;}return n;}
function zemiLecCheck(mid,i){
  if(!S.zemiChecklist)S.zemiChecklist={};
  const k=zemiLecKey(mid,i);
  S.zemiChecklist[k]=!S.zemiChecklist[k];
  save();
  const m=ZEMI_LECTURES.find(x=>x.moduleId===mid);
  if(m&&S.zemiChecklist[k]&&zemiLecDoneCount(m)===m.lessons.length){
    setTimeout(()=>{toast("🎓","「"+m.subtitle.split("｜")[0]+"」全講を理解しました！");celebrate();},200);
  }
  renderZemi(ZEMI_TOOL);
}
function zemiGateHTML(){
  const total=totalLessons();

    <div style="margin:18px 0 8px;display:flex;align-items:center;gap:14px">
      <div class="chprog" style="height:10px;flex:1"><i style="width:${pct}%"></i></div>
      <span style="font-family:var(--label);color:var(--cream-dim);font-size:13px;white-space:nowrap">${done}/${total} レッスン修了</span>
    </div>
    <p style="font-size:13px;color:var(--muted);margin:0 0 14px">入校まで、あと${total-done}レッスン。</p>
    <button class="btn gold" onclick="go('learn')">📚 カリキュラムを続ける</button>`;
  }
  const buy=ZEMI_ON_SALE
    ?`<a class="btn gold" href="${ZEMI_NOTE_URL}" target="_blank" rel="noopener">🎓 noteで購入する（¥3,000・税込）</a>`
    :`<div class="block" style="margin:0"><div class="note"><b>🔜 近日公開予定</b><br>準備が整い次第、このページから¥3,000（税込）で購入できるようになります。今しばらくお待ちください。</div></div>`;
  return `<div class="block" style="margin:0"><div class="note cool"><b>🏅 入校資格 取得済み</b><br>全${total}レッスン修了——サウナ大学を卒業したあなたには、経営ゼミへの入校資格があります。おめでとうございます。</div></div>
  ${buy}
  <div class="zemi-unlock">
    <input type="text" id="zemiCodeInput" placeholder="アクセスコードをお持ちの方はこちら" onkeydown="if(event.key==='Enter')submitZemiCode()">
    <button class="btn ghost" onclick="submitZemiCode()">解放する</button>
  </div>
  <p style="font-size:11.5px;color:var(--muted);margin-top:12px">※コードはこの端末に保存されます。別の端末でも使う場合は、その端末でも同じコードを入力してください。ブラウザのデータ削除や、しばらくアクセスしなかった場合（iPhoneのSafari等）には再入力が必要になることがあります。コードは大切に保管してください。</p>`;
}
function zemiLearnCardHTML(){
  const total=totalLessons();
  const eligible=zemiEligible();
  const lead=(S.zemiUnlocked||eligible)
    ?`6つの実践ツールと、開業実務を出典つきで深掘りする全40講・約5.2万字の講義録——無料の経営学部6章の5倍超（本文文字数の実測比）。買い切り¥3,000（税込）${(!ZEMI_ON_SALE&&!S.zemiUnlocked)?'（近日公開予定）':''}。`

function zemiKeitaiRun(){
  const budget=+document.getElementById("zk_budget").value;
  const place=+document.getElementById("zk_place").value;
  const style=+document.getElementById("zk_style").value;
  const score={facility:0,private:0,tent:0,barrel:0};
  if(budget===1){score.tent+=3;score.barrel+=1;}
  else if(budget===2){score.private+=2;score.barrel+=2;score.tent+=1;}
  else if(budget===3){score.private+=3;score.facility+=1;}
  else {score.facility+=3;score.private+=1;}
  if(place===1){score.tent+=2;score.barrel+=2;}
  else if(place===2){score.private+=3;score.facility+=1;}
  else if(place===3){score.tent+=3;score.barrel+=2;}
  else {score.private+=1;score.tent+=1;}
  if(style===1){score.private+=2;score.tent+=2;}
  else if(style===2){score.facility+=2;score.private+=1;}
  else {score.tent+=3;score.barrel+=2;}
  const labels={
    facility:["🏢","施設型（大型温浴）","建設費3億〜6億円規模。個人の最初の一歩としては大きいが、将来のロールモデルとして知っておく価値がある業態。"],
    private:["🚪","個室・プライベートサウナ","総額1,000万〜5,000万円程度が目安。近年の開業ラッシュの主役で、賃貸物件からのスタートとも相性がよい。"],
    tent:["⛺","テントサウナ事業","基本セット一式50万〜150万円程度からと、最も小さく始められる業態。イベント的な運営や自己所有地・アウトドア施設との相性が良い。"],
    barrel:["🛢️","バレルサウナ設置型","本体100万円前後〜、設置込み総額200万〜500万円程度が目安。グランピング施設等への設置型の集客装置として導入が進む。"]
  };
  if(budget===1){score.facility=-99;score.private=-99;} /* 〜300万円では施設型・個室は初期投資が届かないため診断対象から外す */
  const zOrder=["tent","barrel","private","facility"]; /* 同点時は初期投資が小さい業態を優先 */
  const top=zOrder.reduce((a,b)=>score[b]>score[a]?b:a);
  const pick=labels[top];
  document.getElementById("zk_result").innerHTML=`<div class="zresult ok">
    <div class="zr-lab">診断結果</div>
    <div class="zr-num">${pick[0]} ${pick[1]}</div>
    <p style="margin-top:10px;color:var(--cream-dim);font-size:14px">${pick[2]}</p>
    <p style="margin-top:10px;font-size:12.5px;color:var(--muted)">※これは経営学部ch31の相場観に基づく簡易診断です。実際の選択は、収支シミュレーターや専門家への相談と合わせて判断してください。</p>
  </div>`;
}

function zemiShuushiRun(){
  const rent=zNum("zh_rent");
  const labor=zNum("zh_labor");
  let fuel=zNum("zh_fuel");
  const other=zNum("zh_other");
  const price=zNum("zh_price");
  const vcost=zNum("zh_var");
  const guest=zNum("zh_guest");
  const stress=document.getElementById("zh_stress").checked;
  if(price<=0){toast("✍️","客単価を入力してください");return;}
  if(stress)fuel=fuel*1.3;
  const fixedTotal=Math.round((rent+labor+fuel+other)*10000);
  const margin=price-vcost;
  if(margin<=0){
    document.getElementById("zh_result").innerHTML=`<div class="zresult bad"><div class="zr-lab">計算できません</div><p style="color:var(--cream-dim);margin-top:8px">客単価が1人あたり変動費を下回っています。この価格設定では、来客が増えるほど赤字が拡大します。</p></div>`;
    return;
  }
  const breakEvenMonth=Math.ceil(fixedTotal/margin);
  const breakEvenDay=Math.ceil(breakEvenMonth/30);
  let verdict="",resultClass="";
  if(guest>0){
    const monthlyProfit=guest*margin-fixedTotal;
    resultClass=monthlyProfit>=0?"ok":"bad";
    verdict=monthlyProfit>=0
      ?`想定来客数（${guest.toLocaleString()}人／月）なら、月次収支は<b style="color:var(--calm)">約${Math.round(monthlyProfit/10000).toLocaleString()}万円の黒字</b>です。`
      :`想定来客数（${guest.toLocaleString()}人／月）では、月次収支は<b style="color:var(--wrong)">約${Math.round(Math.abs(monthlyProfit)/10000).toLocaleString()}万円の赤字</b>です。分岐点まであと${Math.max(0,breakEvenMonth-guest).toLocaleString()}人／月、必要です。`;
  }
  const barMax=Math.max(breakEvenMonth,guest,1);
  const bars=`
    <div class="zbar-row"><div class="zb-lab">損益分岐</div><div class="zbar-track"><div class="zbar-fill" style="width:${Math.round(breakEvenMonth/barMax*100)}%;background:var(--gold)"></div></div><b style="font-family:var(--label);font-variant-numeric:tabular-nums">${breakEvenMonth.toLocaleString()}人</b></div>
    ${guest>0?`<div class="zbar-row"><div class="zb-lab">想定来客数</div><div class="zbar-track"><div class="zbar-fill" style="width:${Math.round(guest/barMax*100)}%;background:${guest>=breakEvenMonth?'var(--calm)':'var(--wrong)'}"></div></div><b style="font-family:var(--label);font-variant-numeric:tabular-nums">${guest.toLocaleString()}人</b></div>`:""}
  `;
  document.getElementById("zh_result").innerHTML=`<div class="zresult ${resultClass}">
    <div class="zr-lab">損益分岐来客数${stress?"（燃料費+30%シナリオ）":""}</div>
    <div class="zr-num">${breakEvenMonth.toLocaleString()}<small style="font-size:16px">人／月　（1日あたり約${breakEvenDay}人）</small></div>
    ${bars}
    ${verdict?`<p style="margin-top:16px;font-size:14px;color:var(--cream-dim)">${verdict}</p>`:""}
    <p style="margin-top:14px;font-size:11.5px;color:var(--muted)">計算式：固定費合計（${(Math.round(fixedTotal/1000)/10).toLocaleString()}万円／月）÷ 1人あたり粗利（${margin.toLocaleString()}円）＝損益分岐来客数。ch34の考え方と同じです。</p>
  </div>
  <div class="block"><div class="note">開業前は「悲観・普通・楽観」の3パターンで試算し、悲観シナリオでも半年耐えられる運転資金を持つのが鉄則です（ch34）。客単価や来客数の想定を変えて、何度でも試してみてください。</div></div>`;
}

let QSESSION=null;
function startSession(mode){
  let pool=[...QUIZ_BANK];
  if(mode==="random10"){pool=shuffle(pool).slice(0,10);}
  else if(mode==="exam25"){pool=shuffle(pool).slice(0,25);}
  else if(mode&&mode.indexOf("tier:")===0){const t=mode.slice(5);pool=shuffle(pool.filter(q=>q.tier===t));}
  else if(mode==="weak"){pool=pool.filter(q=>S.wrong&&S.wrong.includes(q.uid));if(!pool.length)pool=shuffle([...QUIZ_BANK]).slice(0,10);}
  QSESSION={pool,idx:0,correct:0,mode,total:pool.length};
  renderQuestion();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderQuestion(){
  if(!QSESSION)return;
  const {pool,idx,correct,total}=QSESSION;
  if(idx>=total){renderResult();return;}
  const q=pool[idx];
  const pct=Math.round(idx/total*100);
  const opts=q.choices.map((c,ci)=>`
    <div class="opt" data-ci="${ci}" onclick="answerQ(${ci})">
      <div class="k">${String.fromCharCode(65+ci)}</div><div>${esc(c)}</div>
    </div>`).join("");
  document.getElementById("view-session").innerHTML=`<section class="section"><div class="wrap qsession">
    <div class="qtop">
      <div class="qcount">${idx+1} / ${total}</div>
      <div class="qscore">正解 ${correct} / ${idx}</div>
    </div>
    <div class="qprog"><i style="width:${pct}%"></i></div>
    <div class="qcard">
      <div class="qcat">${tierMeta(q.tier).icon} ${esc(q.chTitle)}</div>
      <div class="qq">${esc(q.q)}</div>
      <div class="opts" id="qopts">${opts}</div>
      <div class="explain" id="qexp"></div>
      <div class="qnext" id="qnext">
        <button class="btn gold" onclick="nextQ()">${idx+1<total?'次の問題 →':'結果を見る →'}</button>
      </div>
    </div>
    <div style="margin-top:18px;text-align:center">
      <button class="btn ghost" style="font-size:13px" onclick="go('quiz')">← 問題選択に戻る</button>
    </div>
  </div></section>`;
}
function answerQ(ci){
  if(!QSESSION)return;
  const q=QSESSION.pool[QSESSION.idx];
  const ok=(ci===q.answer);
  if(ok){QSESSION.correct++;S.correctTotal++;if(S.correctTotal>=50)award("quiz50");if(S.correctTotal>=150)award("quiz150");}
  if(!ok){if(!S.wrong)S.wrong=[];if(!S.wrong.includes(q.uid))S.wrong.push(q.uid);}
  else if(S.wrong){S.wrong=S.wrong.filter(u=>u!==q.uid);}
  save();
  document.querySelectorAll("#qopts .opt").forEach(o=>{
    const c=+o.dataset.ci; o.setAttribute("disabled","");
    if(c===q.answer)o.classList.add("correct");
    else if(c===ci)o.classList.add("wrong");
    else o.classList.add("dim");
  });
  const exp=document.getElementById("qexp");
  exp.className=`explain show ${ok?"ok":"ng"}`;
  exp.innerHTML=(ok?"✅ 正解！":"❌ 不正解。")+`<br>${q.explain}`;
  document.getElementById("qnext").classList.add("show");
  touchStreak(); addXp(ok?10:3);
}
function nextQ(){
  if(!QSESSION)return;
  QSESSION.idx++;
  if(QSESSION.idx>=QSESSION.total)renderResult();
  else renderQuestion();
}
function renderResult(){
  if(!QSESSION)return;
  const {correct,total,mode}=QSESSION;
  const pct=Math.round(correct/total*100);
  const isExam=mode==="exam25";
  const passed=isExam&&pct>=80;
  if(passed)award("exam");
  if(pct===100)award("perfect");
  const msg=pct>=90?"🏆 素晴らしい！サウナ賢者に近づいています。":pct>=70?"👍 よくできました！苦手問題で復習しましょう。":pct>=50?"📚 半分以上正解！もう少しで壁を突破できます。":"💪 ここからが本番。苦手問題を攻略しましょう！";
  const share=`サウナ大学の腕試しで ${total}問中${correct}問正解（${pct}%）！🧖 #サウナ大学 #GOMIRACHELIN`;
  const xurl="https://twitter.com/intent/tweet?text="+encodeURIComponent(share)+"&url="+encodeURIComponent("https://sauna-cospa.com");
  document.getElementById("view-session").innerHTML=`<section class="section"><div class="wrap result">
    <div class="rring" style="background:conic-gradient(var(--gold) ${pct*3.6}deg,var(--bg-2) 0)">
      <div style="width:130px;height:130px;border-radius:50%;background:var(--surface);display:grid;place-items:center">
        <div class="rscore">${pct}<small>%</small></div>
      </div>
    </div>
    <h2>${correct} / ${total} 問正解</h2>
    <p>${msg}</p>
    ${isExam?`<p style="font-size:18px;font-weight:700;color:${passed?'var(--calm)':'var(--wrong)'}">${passed?'✅ 合格！':'❌ 不合格（80%以上で合格）'}</p>`:""}
    <div class="rrow">
      <button class="btn gold" onclick="go('session','${mode}')">もう一度</button>
      <a class="btn ghost" href="${xurl}" target="_blank" rel="noopener">𝕏 で共有</a>
      <button class="btn ghost" onclick="go('quiz')">問題選択へ</button>
    </div>
  </div></section>`;
  QSESSION=null;
}

        <div class="b">こんにちは！サウナ先生です。何でもどうぞ。</div></div></div>
      <div class="suggest" id="chatSuggest">
        <div class="chip" onclick="sendChip(this)">ととのうって何？</div>

        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button class="sendbtn" onclick="sendMsg()">↑</button></div></div>
    <div class="key-note"><b>🔑 本物のAI（Claude）を使うには</b>：Anthropic APIキーを入力すると、より深い質問にも答えられます。キーはあなたのブラウザにのみ保存されます。
      <div class="krow"><input type="password" id="keyInput" placeholder="sk-ant-..." value="${AI_KEY}">
        <button class="mini g" onclick="saveKey()">保存</button><button class="mini" onclick="clearKey()">削除</button></div>

function saveKey(){const v=document.getElementById("keyInput").value.trim();AI_KEY=v;localStorage.setItem("sauna_apikey",v);
  document.getElementById("aiMode").textContent=v?"🟢 AI接続中":"📚 知識ベース";document.getElementById("aiMode").className="mode"+(v?" live":"");toast("🔑",v?"APIキーを保存しました":"APIキーを削除しました");}
function clearKey(){AI_KEY="";localStorage.removeItem("sauna_apikey");document.getElementById("keyInput").value="";document.getElementById("aiMode").textContent="📚 知識ベース";document.getElementById("aiMode").className="mode";}
function sendChip(el){document.getElementById("chatInput").value=el.textContent;document.getElementById("chatSuggest").style.display="none";sendMsg();}
function appendMsg(role,html){const body=document.getElementById("chatBody");const d=document.createElement("div");d.className=`msg ${role==="user"?"me":"ai"}`;d.innerHTML=`<div class="mav">${role==="user"?"👤":"🧖"}</div><div class="b">${html}</div>`;body.appendChild(d);body.scrollTop=body.scrollHeight;return d;}
function setTyping(show){let el=document.getElementById("typingEl");if(show&&!el){el=document.createElement("div");el.id="typingEl";el.className="msg ai";el.innerHTML=`<div class="mav">🧖</div><div class="b"><div class="typing"><i></i><i></i><i></i></div></div>`;document.getElementById("chatBody").appendChild(el);document.getElementById("chatBody").scrollTop=document.getElementById("chatBody").scrollHeight;}else if(!show&&el)el.remove();}
async function sendMsg(){const inp=document.getElementById("chatInput");const txt=inp.value.trim();if(!txt)return;inp.value="";inp.style.height="auto";appendMsg("user",esc(txt));CHAT_HISTORY.push({role:"user",content:txt});document.getElementById("chatSuggest").style.display="none";setTyping(true);if(AI_KEY){await sendToClaudeAPI(txt);}else{await sendToLocalKB(txt);}}
async function sendToLocalKB(txt){await new Promise(r=>setTimeout(r,500));setTyping(false);const tl=txt.toLowerCase();const match=SENSEI_KB.find(item=>item.k.some(k=>tl.includes(k)));let answer,srcHtml="";if(match){answer=match.a;if(match.src){srcHtml=`<div class="src">📖 <a href="#" onclick="event.preventDefault();go('chapter','${match.src.go}')">${esc(match.src.label)}</a></div>`;}}else{answer="すみません、その質問については学習コンテンツをご覧いただくか、APIキーを設定してみてください。";srcHtml=`<div class="src">📚 <a href="#" onclick="event.preventDefault();go('learn')">学習コンテンツを見る →</a></div>`;}appendMsg("ai",answer.replace(/\n/g,"<br>")+srcHtml);CHAT_HISTORY.push({role:"assistant",content:answer});touchStreak();}
async function sendToClaudeAPI(txt){const SYSTEM=`あなたは「サウナ先生」です。GOMIRACHELINが監修するサウナ学習アプリのAIアシスタント。サウナの全領域について正確で分かりやすく日本語で答え、最後に学習コンテンツの章へ誘導してください。200〜400文字程度。`;try{const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":AI_KEY,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:800,stream:true,system:SYSTEM,messages:CHAT_HISTORY.slice(-8)})});if(!resp.ok){const err=await resp.json().catch(()=>({}));setTyping(false);appendMsg("ai","⚠️ APIエラー："+(err.error&&err.error.message||resp.status));return;}setTyping(false);const d=appendMsg("ai","");const bEl=d.querySelector(".b");let full="";const reader=resp.body.getReader();const dec=new TextDecoder();let buf="";while(true){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const evts=buf.split("\n\n");buf=evts.pop();for(const evt of evts){for(const line of evt.split("\n")){if(!line.startsWith("data:"))continue;try{const p=JSON.parse(line.slice(5).trim());if(p.type==="content_block_delta"&&p.delta&&p.delta.type==="text_delta"){full+=p.delta.text;bEl.innerHTML=full.replace(/\n/g,"<br>");document.getElementById("chatBody").scrollTop=document.getElementById("chatBody").scrollHeight;}}catch(e){}}}}CHAT_HISTORY.push({role:"assistant",content:full});touchStreak();}catch(e){setTyping(false);appendMsg("ai","⚠️ 通信エラーが発生しました。");}}

function renderGlossary(){
  document.getElementById("view-glossary").innerHTML=`<section class="section"><div class="wrap">
    <div class="eyebrow">Dictionary</div>
    <h2 class="sec-title">サウナ用語辞典</h2>
    <p class="lead" style="margin-bottom:26px">サウナを楽しむために知っておきたい${GLOSSARY.length}語を収録。</p>
    <div class="gsearch"><span class="gi">🔍</span>
      <input type="text" id="gsearchInput" placeholder="用語を検索..." oninput="filterGlossary(this.value)">
    </div>
    <div class="gterms" id="gterms">${buildGlossaryHTML(GLOSSARY)}</div>
  </div></section>`;
}
function buildGlossaryHTML(terms){
  return terms.map(t=>`<div class="gterm">
    <div><b>${esc(t.t)}</b><span class="rd">${esc(t.r)}</span></div>
    <p>${esc(t.d)}</p>
  </div>`).join("");
}
function filterGlossary(q){
  const lq=q.toLowerCase();
  const filtered=GLOSSARY.filter(t=>t.t.toLowerCase().includes(lq)||t.d.toLowerCase().includes(lq)||t.r.toLowerCase().includes(lq));
  document.getElementById("gterms").innerHTML=buildGlossaryHTML(filtered);
}
