<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本サウナ地図 | GOMIRACHELIN</title>
<meta name="description" content="GOMIRACHELIN掲載サウナを、都道府県の境界・施設数・地図のピンから探せます。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Oswald:wght@400;600&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  color: #e8e2d4;
  font-family: 'Shippori Mincho', serif;
  padding: 16px 12px 60px;
  -webkit-text-size-adjust: 100%;
}

.home-link {
  display: inline-block; margin: 0 0 14px; color: #d4a017;
  font: 12px/1.5 Arial, sans-serif; text-decoration: none;
}
.home-link:hover { text-decoration: underline; }

/* ===== ヘッダー ===== */
.hd { text-align: center; margin-bottom: 20px; }
.hd .en {
  font-family: 'Oswald', sans-serif;
  font-size: 11px; letter-spacing: 5px; color: #d4a017;
  margin-bottom: 6px;
}
.hd h1 {
  font-size: 20px; color: #d4a017; letter-spacing: 3px; font-weight: 700;
}
.hd .sub { font-size: 11px; color: #8a7d5f; margin-top: 6px; letter-spacing: 1px; }

/* ===== 指標切替ボタン ===== */
.metric-tabs {
  display: flex; gap: 8px; justify-content: center; margin: 18px 0 14px;
}
.metric-tabs button {
  flex: 1; max-width: 160px;
  background: #141414; border: 1px solid #2e2a20;
  color: #8a7d5f; font-family: 'Oswald', sans-serif;
  font-size: 12px; letter-spacing: 2px; padding: 11px 6px;
  border-radius: 6px; cursor: pointer; transition: all .18s;
}
.metric-tabs button.on {
  background: linear-gradient(135deg, #d4a017, #b8922a);
  border-color: #d4a017; color: #0a0a0a; font-weight: 600;
}

/* ===== 地図 ===== */
.map-wrap {
  background: #0e0e0e; border: 1px solid #1f1c15;
  border-radius: 10px; padding: 10px 6px; margin-bottom: 14px;
  overflow-x: auto;
}
.map-grid {
  display: grid;
  grid-template-columns: repeat(13, 1fr);
  gap: 2px;
  min-width: 320px;
}
.cell { aspect-ratio: 1; }
.pref {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-radius: 3px; cursor: pointer;
  font-size: 9px; line-height: 1.1;
  border: 1px solid transparent;
  transition: transform .12s, box-shadow .12s;
  overflow: hidden;
}
.pref:active { transform: scale(.9); }
.pref.sel { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
.pref .nm { font-weight: 700; }
.pref .vl { font-family: 'Oswald', sans-serif; font-size: 8px; opacity: .85; }
.pref.empty {
  background: #151515; color: #33302a; cursor: default;
}

/* ===== 凡例 ===== */
.legend {
  display: flex; align-items: center; justify-content: center;
  gap: 4px; font-size: 9px; color: #8a7d5f;
  margin-bottom: 18px; letter-spacing: 1px;
}
.legend .bar { display: flex; }
.legend .bar span {
  width: 24px; height: 9px; display: block;
}

/* ===== フィルタ ===== */
.filters {
  background: #0e0e0e; border: 1px solid #1f1c15;
  border-radius: 10px; padding: 14px; margin-bottom: 18px;
}
.filters > .ttl {
  font-family: 'Oswald', sans-serif; font-size: 10px;
  letter-spacing: 3px; color: #d4a017; margin-bottom: 12px;
}
.frow { margin-bottom: 14px; }
.frow:last-child { margin-bottom: 0; }
.frow label {
  display: flex; justify-content: space-between;
  font-size: 11px; color: #a0946f; margin-bottom: 5px;
}
.frow label b { color: #d4a017; font-family: 'Oswald', sans-serif; }
input[type=range] {
  width: 100%; -webkit-appearance: none; appearance: none;
  height: 3px; background: #2e2a20; border-radius: 2px; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: #d4a017; cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; border: none;
  background: #d4a017; cursor: pointer;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 10px; padding: 6px 10px; border-radius: 14px;
  background: #141414; border: 1px solid #2e2a20; color: #8a7d5f;
  cursor: pointer; transition: all .15s; letter-spacing: .5px;
}
.chip.on { background: #d4a017; border-color: #d4a017; color: #0a0a0a; font-weight: 700; }

select {
  width: 100%; background: #141414; border: 1px solid #2e2a20;
  color: #e8e2d4; padding: 8px; border-radius: 5px;
  font-size: 12px; font-family: 'Shippori Mincho', serif;
}

.search-box {
  width: 100%; background: #141414; border: 1px solid #2e2a20;
  color: #e8e2d4; padding: 10px 12px; border-radius: 5px;
  font-size: 13px; font-family: 'Shippori Mincho', serif;
  outline: none;
}
.search-box::placeholder { color: #5a5346; }
.search-box:focus { border-color: #d4a017; }

.axis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.axis-grid .frow { margin-bottom: 0; }
.axis-grid label { font-size: 10px; }

.reset-btn {
  width: 100%; margin-top: 14px; padding: 9px;
  background: transparent; border: 1px solid #2e2a20;
  color: #8a7d5f; border-radius: 5px; font-size: 11px;
  cursor: pointer; letter-spacing: 2px;
  font-family: 'Oswald', sans-serif;
}

/* ===== 結果リスト ===== */
.res-hd {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px; padding: 0 2px;
}
.res-hd .t {
  font-family: 'Oswald', sans-serif; font-size: 11px;
  letter-spacing: 3px; color: #d4a017;
}
.res-hd .c { font-size: 11px; color: #8a7d5f; }

.card {
  background: #0e0e0e; border: 1px solid #1f1c15;
  border-left: 3px solid #d4a017;
  border-radius: 6px; padding: 12px 14px; margin-bottom: 8px;
}
.card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card .nm { font-size: 14px; color: #d4a017; font-weight: 700; line-height: 1.4; }
.card .loc { font-size: 10px; color: #6e6553; margin-top: 3px; }
.card .sc { text-align: right; flex-shrink: 0; }
.card .sc .v {
  font-family: 'Oswald', sans-serif; font-size: 24px;
  font-weight: 600; line-height: 1; color: #d4a017;
}
.card .sc .l { font-size: 8px; color: #6e6553; letter-spacing: 1px; }
.card .meta {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 9px; font-size: 10px; color: #8a7d5f;
}
.card .meta span { background: #141414; padding: 3px 7px; border-radius: 3px; }
.card .rank {
  font-family: 'Oswald', sans-serif; font-size: 10px;
  color: #6e6553; margin-right: 6px;
}
/* ===== ピン地図(Leaflet) ===== */
#pinMap { height: 380px; border-radius: 8px; display: none; }
#pinMap.on { display: block; }
.leaflet-container { background: #0a0a0a; }
.leaflet-tile { filter: invert(1) hue-rotate(180deg) brightness(.72) contrast(1.15) saturate(.35); }
.leaflet-control-attribution {
  background: rgba(10,10,10,.75) !important; color: #6e6553 !important;
  font-size: 8px !important;
}
.leaflet-control-attribution a { color: #8a7d5f !important; }
.leaflet-control-zoom a {
  background: #141414 !important; color: #d4a017 !important;
  border-color: #2e2a20 !important;
}
.pin {
  border-radius: 50%; border: 1.5px solid rgba(10,10,10,.75);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Oswald', sans-serif; font-weight: 600;
  font-size: 9px; color: #0a0a0a;
  box-shadow: 0 1px 4px rgba(0,0,0,.6);
}
.leaflet-popup-content-wrapper {
  background: #121212; color: #e8e2d4;
  border: 1px solid #2e2a20; border-radius: 7px;
}
.leaflet-popup-tip { background: #121212; border: 1px solid #2e2a20; }
.leaflet-popup-content { margin: 11px 13px; font-family: 'Shippori Mincho', serif; }
.pop-nm { color: #d4a017; font-size: 13px; font-weight: 700; margin-bottom: 3px; }
.pop-lo { color: #6e6553; font-size: 10px; margin-bottom: 6px; }
.pop-sc {
  font-family: 'Oswald', sans-serif; font-size: 20px;
  color: #d4a017; line-height: 1;
}
.pop-sc small { font-size: 8px; color: #6e6553; letter-spacing: 1px; }
.pop-btn {
  display: block; text-align: center; text-decoration: none;
  margin-top: 8px; padding: 6px; border-radius: 4px; font-size: 11px;
  background: linear-gradient(135deg,#d4a017,#b8922a); color: #0a0a0a;
  font-weight: 700;
}

/* 地図モード切替 */
.view-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.view-tabs button {
  flex: 1; background: transparent; border: 1px solid #2e2a20;
  color: #6e6553; font-family: 'Oswald', sans-serif;
  font-size: 10px; letter-spacing: 2px; padding: 7px;
  border-radius: 5px; cursor: pointer;
}
.view-tabs button.on { border-color: #d4a017; color: #d4a017; }

.no-coord {
  font-size: 10px; color: #6e6553; text-align: center;
  padding: 8px 4px 0; line-height: 1.6;
}

.card.closed { border-left-color: #4a4437; opacity: .55; }

.card .acts { display: flex; gap: 7px; margin-top: 11px; }
.act {
  flex: 1; text-align: center; text-decoration: none;
  font-size: 11px; padding: 8px 4px; border-radius: 5px;
  letter-spacing: .5px; transition: opacity .15s;
}
.act:active { opacity: .6; }
.act.map {
  background: linear-gradient(135deg, #d4a017, #b8922a);
  color: #0a0a0a; font-weight: 700;
}
.act.off {
  background: #141414; border: 1px solid #2e2a20; color: #a0946f;
  flex: 0 0 88px;
}

.empty-msg {
  text-align: center; padding: 30px 10px;
  color: #6e6553; font-size: 12px; line-height: 1.8;
}

.loading { text-align: center; padding: 40px; color: #8a7d5f; font-size: 12px; }
/* Readable geographic map; preserve the site's black and gold frame. */
#mapGrid { display:block; height:680px; min-height:560px; border-radius:8px; }
.leaflet-tile { filter:none; }
.leaflet-container { background:#dceaf1; font-family:Arial,'Noto Sans JP',sans-serif; }
.leaflet-control-attribution { background:rgba(255,255,255,.95)!important; color:#334155!important; font-size:10px!important; }
.leaflet-control-attribution a { color:#155e75!important; }
.pref-count-label { color:#18222d; text-align:center; line-height:1.05; background:rgba(255,255,255,.93); border:1px solid #8292a4; border-radius:5px; box-shadow:0 1px 3px #0002; padding:2px; }
.pref-count-label span { display:block; font-size:10px; white-space:nowrap; }
.pref-count-label b { font-size:15px; }
.pref-count-label small { font-size:9px; margin-left:2px; }
.pref-count-label.compact { padding:3px 0; line-height:1; border-radius:12px; }
.pref-count-label.compact b { font-size:14px; }
.map-help,#countSummary { color:#d5cdbd; font:13px/1.6 Arial,sans-serif; margin:12px 6px; }
.pref-controls { display:flex; align-items:center; gap:10px; margin:10px 6px; font:13px Arial,sans-serif; }
.pref-controls select { flex:1; max-width:360px; }
.pref-controls button { padding:9px 12px; border:1px solid #a88320; background:#231f15; color:#e8e2d4; border-radius:5px; cursor:pointer; }
.metric-tabs button { max-width:200px; letter-spacing:0; }
.map-wrap { overflow:visible; }
@media(max-width:600px){#mapGrid{height:560px;}.pref-controls{flex-wrap:wrap;}.pref-controls select{min-width:180px;}}


.facility-marker{background:#bf7800;color:white;border:2px solid white;border-radius:50%;text-align:center;line-height:27px;font:bold 18px/27px Arial;box-shadow:0 2px 5px #0005;}
.facility-marker.closed-pin{background:#64748b;}
.facility-detail{font:13px/1.6 Arial,sans-serif;min-width:180px;}
.facility-detail h3{color:#f5c54c;font-size:15px;margin-bottom:5px;}
.facility-detail a{color:#f5c54c;display:block;margin-top:8px;}
.facility-detail+.facility-detail{border-top:1px solid #777;padding-top:10px;margin-top:10px;}
</style>

function render() {
  var stats=countByPrefecture(ALL);
  updateCountControls(stats, ALL);
  drawMap(stats);
  drawList(ALL);
}

function colorFor(val, min, max) {
  if (max <= min) return SCALE[SCALE.length - 1];
  var t = (val - min) / (max - min);
  var i = Math.min(SCALE.length - 1, Math.floor(t * SCALE.length));
  return SCALE[i];
}

var PMAP = null, PREF_LAYER = null, COUNT_LAYER = null, CURRENT_COUNTS = {};
var PREF_NAMES = '北海道 青森県 岩手県 宮城県 秋田県 山形県 福島県 茨城県 栃木県 群馬県 埼玉県 千葉県 東京都 神奈川県 新潟県 富山県 石川県 福井県 山梨県 長野県 岐阜県 静岡県 愛知県 三重県 滋賀県 京都府 大阪府 兵庫県 奈良県 和歌山県 鳥取県 島根県 岡山県 広島県 山口県 徳島県 香川県 愛媛県 高知県 福岡県 佐賀県 長崎県 熊本県 大分県 宮崎県 鹿児島県 沖縄県'.split(' ');

function uniqueFacilities(rows) {
  var seen = Object.create(null);
  rows.forEach(function(row) {
    var fc = Object.assign({}, row);
    if (fc.name === 'お風呂の国' || fc.name === 'おふろの国') fc.pref = '神奈川県';
    var name = String(fc.name).normalize('NFKC').replace(/\s+/g,'').toLowerCase();
    // Branch name + prefecture + municipality: retain different branches.
    var key = JSON.stringify([name,fc.pref,String(fc.area||'').normalize('NFKC').replace(/\s+/g,'')]);
    var old = seen[key];
    if (!old) {seen[key] = fc; return;}
    var quality = function(f){return Object.keys(f.axes||{}).filter(function(k){return f.axes[k]>0;}).length;};
    if (quality(fc)>quality(old)) seen[key] = Object.assign({},fc,{posted:fc.posted||old.posted});
    else old.posted = old.posted || fc.posted;
  });
  return Object.keys(seen).map(function(k){return seen[k];});
}

function countByPrefecture(rows) {
  var counts = Object.create(null);
  PREF_NAMES.forEach(function(p){counts[p]=0;});
  rows.forEach(function(fc){if(Object.prototype.hasOwnProperty.call(counts,fc.pref)) counts[fc.pref]++;});
  return counts;
}

function selectPref(pref) {
  SEL_PREF = pref;
  if (PMAP && PREF_LAYER) {
    if (!pref) PMAP.fitBounds([[25.3,126.3],[45.8,146.2]]);
    else PREF_LAYER.eachLayer(function(layer){
      if(layer.feature.properties.P === pref) PMAP.fitBounds(layer.feature.properties.mainBounds,{padding:[24,24],maxZoom:8});
    });
  }
  render();
}

function updateCountControls(stats, passed) {
  var select=document.getElementById('prefSelect');
  select.innerHTML='<option value="">全国 '+passed.length+'施設</option>'+PREF_NAMES.map(function(p){
    return '<option value="'+p+'"'+(p===SEL_PREF?' selected':'')+'>'+p+' '+stats[p]+'施設</option>';
  }).join('');
  document.getElementById('countSummary').textContent = (SEL_PREF ? SEL_PREF+' '+(stats[SEL_PREF]||0)+'施設 ／ ' : '') +
    '全国 '+ALL.length+'施設（未評価・閉店の記録を含む）';
}

function drawMap(stats) {

  if (!PMAP) {
    PMAP=L.map('mapGrid',{scrollWheelZoom:false,zoomSnap:.25}).fitBounds([[25.3,126.3],[45.8,146.2]]);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:18,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
    }).addTo(PMAP);
    PMAP.attributionControl.addAttribution('県境: <a href="https://github.com/piuccio/open-data-jp-prefectures-geojson" target="_blank">国土数値情報を加工 / Fabio Crisci</a>');
    PREF_LAYER=L.geoJSON(PREF_GEO,{onEachFeature:function(feature,layer){
      layer.on('click',function(){selectPref(feature.properties.P===SEL_PREF?null:feature.properties.P);});
    }}).addTo(PMAP);
    COUNT_LAYER=L.layerGroup().addTo(PMAP);
    PMAP.on('zoomend moveend',refreshMapDetails);
    buildFacilityPins();
  }
  var max=Math.max.apply(null,Object.keys(stats).map(function(p){return stats[p];}).concat([1]));
  PREF_LAYER.eachLayer(function(layer){
    var name=layer.feature.properties.P, count=stats[name]||0;
    layer.setStyle({color:name===SEL_PREF?'#be123c':'#586779',weight:name===SEL_PREF?3:1.2,
      fillColor:count?'hsl(43, 90%, '+(88-40*count/max)+'%)':'#e5e7eb',fillOpacity:count?.5:.22});
    layer.unbindTooltip();
    layer.bindTooltip(name+' '+count+'施設',{sticky:true});
  });
  CURRENT_COUNTS=stats;
  refreshMapDetails();
  setTimeout(function(){PMAP.invalidateSize();},60);
}

function drawCountLabels() {
  if(!COUNT_LAYER) return;
  COUNT_LAYER.clearLayers();
  if(PMAP.getZoom()>=9) return;
  var size=PMAP.getSize(), labels=[], detailed=PMAP.getZoom()>=6;
  var width=detailed?64:31,height=detailed?39:27;
  PREF_GEO.features.forEach(function(feature){
    var point=PMAP.latLngToContainerPoint(feature.properties.center);
    if(point.x<0||point.x>size.x||point.y<0||point.y>size.y) return;
    labels.push({feature:feature,x:point.x,y:point.y,ax:point.x,ay:point.y});
  });
  // Keep every count legible; leader lines show the actual prefecture anchor.
  for(var turn=0;turn<220;turn++){
    labels.forEach(function(a,i){
      if(turn<140){a.x+=(a.ax-a.x)*.012;a.y+=(a.ay-a.y)*.012;}
      for(var j=i+1;j<labels.length;j++){
        var b=labels[j],dx=b.x-a.x,dy=b.y-a.y,ox=width-Math.abs(dx),oy=height-Math.abs(dy);
        if(ox>0&&oy>0){
          if(ox<oy){var push=ox/2+.4;var sign=dx>=0?1:-1;a.x-=push*sign;b.x+=push*sign;}
          else {var push=oy/2+.4;var sign=dy>=0?1:-1;a.y-=push*sign;b.y+=push*sign;}
        }
      }
      a.x=Math.max(width/2+5,Math.min(size.x-width/2-5,a.x));a.y=Math.max(height/2+5,Math.min(size.y-height/2-15,a.y));
    });
  }
  labels.forEach(function(item){
    var feature=item.feature,name=feature.properties.P,count=CURRENT_COUNTS[name]||0;
    var anchor=feature.properties.center,pos=PMAP.containerPointToLatLng([item.x,item.y]);
    if(Math.hypot(item.x-item.ax,item.y-item.ay)>8){
      L.polyline([anchor,pos],{color:'#475569',weight:1,opacity:.8,interactive:false}).addTo(COUNT_LAYER);
      L.circleMarker(anchor,{radius:2,stroke:false,fillColor:'#172c3b',fillOpacity:1,interactive:false}).addTo(COUNT_LAYER);
    }
    L.marker(pos,{title:name+' '+count+'施設',
      icon:L.divIcon({className:'pref-count-label'+(detailed?'':' compact'),html:(detailed?'<span>'+name+'</span>':'')+'<b>'+count+(detailed?'<small>施設</small>':'')+'</b>',iconSize:detailed?[58,34]:[26,23],iconAnchor:detailed?[29,17]:[13,11]})
    }).bindTooltip(name+' '+count+'施設').on('click',function(){selectPref(name===SEL_PREF?null:name);}).addTo(COUNT_LAYER);
  });
}

function drawList(passed) {
  var list = passed.slice();
  if (SEL_PREF) list = list.filter(function (fc) { return fc.pref === SEL_PREF; });

  list.sort(function (a, b) {
    return (METRIC === 'perf' ? b.perf - a.perf : b.cospa - a.cospa);
  });

  document.getElementById('resTitle').textContent =
    SEL_PREF ? SEL_PREF.toUpperCase() : (METRIC === 'perf' ? 'OVERALL RANKING' : 'COST PERFORMANCE');
  document.getElementById('resCount').textContent = list.length + '施設';

  var el = document.getElementById('results');
  if (!list.length) {
    el.innerHTML = '<div class="empty-msg">この県の掲載施設はまだありません。</div>';
    return;
  }

  var html = '';
  list.forEach(function (fc, i) {
    var val = METRIC === 'perf' ? fc.perf : fc.cospa;
    var meta = [];
    if (fc.price) meta.push('¥' + fc.price.toLocaleString());
    if (fc.yenH)  meta.push('¥' + Math.round(fc.yenH) + '/h');
    if (fc.gaiki) meta.push('外気浴');
    if (fc.rouryu) meta.push('ロウリュ');
    if (fc.kind)  meta.push(fc.kind);

    html += '<div class="card' + (fc.closed ? ' closed' : '') + '">' +
      '<div class="top">' +
        '<div>' +
          '<div class="nm"><span class="rank">' + (i + 1) + '</span>' + esc(fc.name) + '</div>' +
          '<div class="loc">' + esc(fc.pref) + (fc.area ? ' / ' + esc(fc.area) : '') +
            (fc.closed ? ' ・閉店' : '') + '</div>' +
        '</div>' +
        '<div class="sc"><div class="v">' + (val > 0 ? Math.round(val * 10) / 10 : '未評価') + '</div>' +
        '<div class="l">' + (METRIC === 'perf' ? 'OVERALL' : 'COST PERF.') + '</div></div>' +
      '</div>' +
      (meta.length ? '<div class="meta">' + meta.map(function (m) {
        return '<span>' + esc(m) + '</span>';
      }).join('') + '</div>' : '') +
      '<div class="acts">' +
        '<a class="act map" href="' + mapUrl(fc) + '" target="_blank" rel="noopener">' +
          '&#9654; Google Mapで開く</a>' +
        (fc.url ? '<a class="act off" href="' + esc(fc.url) +
          '" target="_blank" rel="noopener nofollow">公式サイト</a>' : '') +
      '</div>' +
    '</div>';
  });
  el.innerHTML = html;
}

/**
 * Google Maps の検索URLを組み立てる。
 * 緯度経度が無くても「施設名 + 都道府県 + エリア」で検索すれば
 * ほぼ確実に目的の施設にたどり着ける。
 * 将来、緯度経度をDBに持たせた場合はそちらを優先する。
 */
function mapUrl(fc) {
  if (fc.lat && fc.lng) {
    return 'https://www.google.com/maps/search/?api=1&query=' +
           encodeURIComponent(fc.lat + ',' + fc.lng);
  }
  var q = [fc.name, fc.pref, fc.area].filter(Boolean).join(' ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

/* ============================================================
   ピン地図(Leaflet + OpenStreetMap)  ※完全無料・APIキー不要
   ============================================================ */
var FACILITY_LAYER=null;
function validPosition(fc){return Number.isFinite(fc.lat)&&Number.isFinite(fc.lng)&&fc.lat>=20&&fc.lat<=46&&fc.lng>=122&&fc.lng<=154;}
function buildFacilityPins(){
  FACILITY_LAYER=L.layerGroup();
  var grouped=Object.create(null);
  ALL.filter(validPosition).forEach(function(fc){
    var key=fc.lat+','+fc.lng;
    (grouped[key]||(grouped[key]=[])).push(fc);
  });
  Object.keys(grouped).forEach(function(key){
    var group=grouped[key],fc=group[0];
    var title=group.length===1?fc.name:group.length+'施設（同じ登録位置）';
    var marker=L.marker([fc.lat,fc.lng],{title:title,
      icon:L.divIcon({className:'facility-marker'+(group.every(function(f){return f.closed;})?' closed-pin':''),html:group.length>1?String(group.length):'♨',iconSize:[31,31],iconAnchor:[15,15]})});
    marker.bindTooltip(esc(title));
    marker.bindPopup(group.map(function(f){
      return '<section class="facility-detail"><h3>'+esc(f.name)+'</h3><div>'+esc(f.pref)+' '+esc(f.area)+(f.closed?' ・閉店／閉館の記録あり':'')+'</div>'+
        '<div>総合点 '+(f.perf>0?esc(f.perf)+'点':'未評価')+' ／ コスパ '+(f.cospa>0?esc(f.cospa):'未評価')+'</div>'+
        (f.price?'<div>平日料金 ¥'+esc(f.price.toLocaleString())+'</div>':'')+
        '<a href="'+mapUrl(f)+'" target="_blank" rel="noopener">Googleマップで開く</a>'+
        (f.url&&/^https?:\/\//i.test(f.url)?'<a href="'+esc(f.url)+'" target="_blank" rel="noopener nofollow">公式サイト</a>':'')+'</section>';
    }).join(''),{maxHeight:330,maxWidth:310});
    FACILITY_LAYER.addLayer(marker);
  });
}
function refreshMapDetails(){
  drawCountLabels();
  if(!FACILITY_LAYER) return;
  var detailed=PMAP.getZoom()>=9;
  if(detailed&&!PMAP.hasLayer(FACILITY_LAYER)) FACILITY_LAYER.addTo(PMAP);
  if(!detailed&&PMAP.hasLayer(FACILITY_LAYER)) PMAP.removeLayer(FACILITY_LAYER);
  var selected=SEL_PREF?ALL.filter(function(fc){return fc.pref===SEL_PREF;}):ALL;
  var located=selected.filter(validPosition).length;
  document.getElementById('noCoord').textContent=(detailed?'施設ピンを表示中。':'拡大すると施設ピンを表示します。')+
    (SEL_PREF||'全国')+'：位置登録 '+located+'施設 ／ 未登録 '+(selected.length-located)+'施設。位置未登録の施設も下の一覧からGoogleマップを開けます。';
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

init();
</script>
